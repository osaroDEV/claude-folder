  id:19, week:10, duration:'≈ 60 minutes',
  title:'Sound Effects & Music',
  objectives:[
    'Play a sound effect on a game event',
    'Add looping background music with volume control',
    'Understand the "audio needs a user gesture" rule',
    'Generate simple beeps when you have no sound files'
  ],
  blocks:[
    {type:'p',html:`Sound is half of how a game <i>feels</i>. A blip when you score, a thud when you crash, a tune humming underneath — audio turns a silent demo into an experience. Today you'll add sound the right way, and learn a neat trick for making beeps in pure code when you don't have any sound files.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-19</code>. Turn your volume up for the demo!`},

    {type:'h',text:'1. Playing a sound file'},
    {type:'p',html:`The simplest way to play a clip is the built-in <code class="inline">Audio</code> object. Point it at a file and call <code class="inline">play()</code>:`},
    {type:'code',lang:'js',code:`const blip = new Audio("blip.wav");

function score() {
  blip.currentTime = 0;  // rewind so rapid plays overlap cleanly
  blip.play();
}`},
    {type:'note',kind:'tip',title:'Rewind for rapid effects',html:`If a sound might fire again before it finishes (rapid scoring, machine-gun fire), set <code class="inline">currentTime = 0</code> before <code class="inline">play()</code> to restart it. For truly overlapping sounds, keep a few copies of the <code class="inline">Audio</code> object and rotate through them.`},

    {type:'h',text:'2. Background music'},
    {type:'p',html:`Music is just a longer clip set to loop, usually quieter than effects:`},
    {type:'code',lang:'js',code:`const music = new Audio("theme.mp3");
music.loop = true;     // repeat forever
music.volume = 0.4;    // 0.0 (silent) to 1.0 (full)
music.play();`},

    {type:'h',text:'3. The browser\'s "user gesture" rule'},
    {type:'p',html:`Browsers <b>block audio from starting on its own</b> — otherwise pages would blast sound at you on load. Sound is only allowed to begin <i>after</i> the user interacts (a click or key press). So games start their audio from the same action that starts the game:`},
    {type:'code',lang:'js',code:`startButton.addEventListener("click", function () {
  music.play();   // allowed — it's inside a click handler
  startGame();
});`},
    {type:'note',kind:'warn',title:'Why your music "won\'t play"',html:`If audio silently refuses to start, this rule is almost always why. The fix is never to autoplay — trigger sound from a click, tap, or key press. A "Click to start" screen solves it neatly and is good design anyway.`},

    {type:'h',text:'4. Live demo: beeps with no files'},
    {type:'p',html:`Sometimes you have no sound files yet. The <b>Web Audio API</b> can <i>synthesize</i> tones in code — perfect for retro blips. Click the buttons below to hear different generated sounds (sound starts on click, satisfying the gesture rule). This is real, file-free audio you can drop into any game.`},
    {type:'run',label:'Click the buttons to hear generated sounds',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;font-family:system-ui;color:#e9ecff;
       display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px}
  button{padding:12px 18px;border:none;border-radius:10px;background:#6c8cff;color:#fff;
         font-size:15px;cursor:pointer;min-width:160px}
  button:hover{filter:brightness(1.1)}
  p{color:#a3aad6;font-size:13px;margin:2px}
</style></head>
<body>
  <p>Sound starts on click (the "user gesture" rule).</p>
  <button id="coin">🪙 Coin / Score</button>
  <button id="jump">⬆️ Jump</button>
  <button id="hit">💥 Hit / Crash</button>
  <script>
    // one shared audio engine
    let audio;
    function beep(startFreq, endFreq, durationMs, type) {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(startFreq, audio.currentTime);
      osc.frequency.linearRampToValueAtTime(endFreq, audio.currentTime + durationMs/1000);
      gain.gain.setValueAtTime(0.2, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + durationMs/1000);
      osc.connect(gain); gain.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + durationMs/1000);
    }
    document.getElementById("coin").onclick = () => beep(660, 990, 140, "square");
    document.getElementById("jump").onclick = () => beep(300, 700, 160, "triangle");
    document.getElementById("hit").onclick  = () => beep(200, 60, 220, "sawtooth");
  <\/script>
</body>
</html>`},
    {type:'note',kind:'info',title:'You don\'t need to master Web Audio',html:`The synthesis code is advanced — you can copy the <code class="inline">beep()</code> helper and just call it. For most games, free sound files plus the simple <code class="inline">Audio</code> object are all you need. Good free sources: <b>freesound.org</b>, <b>Kenney.nl</b> audio packs, and <b>sfxr</b>-style tools that generate retro effects.`},

    {type:'exercise',title:'Make some noise',html:`<ol>
      <li>Add the <code class="inline">beep()</code> helper to your Pong game and play a blip on every paddle hit.</li>
      <li>Play a descending "hit" sound in Snake when the game ends.</li>
      <li>On your machine, add a real looping music track that starts when the player clicks "Start", at <code class="inline">volume = 0.3</code>.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 19 recap',html:`Play clips with <code class="inline">new Audio(file)</code> + <code class="inline">play()</code>; loop music and set <code class="inline">volume</code>. Audio must begin after a <b>user gesture</b> (click/tap/key). When you have no files, the Web Audio <code class="inline">beep()</code> helper generates retro sounds. Next: our biggest project — <b>Breakout</b>.`}
  ]
},
{
  id:20, week:10, duration:'≈ 60 minutes',
  title:'Project: Breakout — Part 1',
  objectives:[
    'Build a grid of bricks using nested loops and an array',
    'Create a paddle controlled by the mouse',
    'Make the ball bounce off the walls and paddle',
    'Lay the groundwork for brick-breaking next session'
  ],
  blocks:[
    {type:'p',html:`<b>Breakout</b> (bounce a ball off a paddle to smash a wall of bricks) is our most ambitious project — and it brings together <i>everything</i>: objects, arrays, nested loops, collisions, and game state. Part 1 builds the playfield and gets the ball bouncing; Part 2 makes the bricks breakable and adds levels and lives.`},
    {type:'note',kind:'info',title:'Real-world example',html:`You're recreating <b>Breakout</b> (Atari, 1976), designed by Nolan Bushnell and Steve Bristow — with the original arcade hardware famously built by Steve Wozniak, later of Apple. Breakout directly inspired <i>Arkanoid</i> (1986) and the entire "brick-breaker" genre that followed.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-20</code> and keep the file for Part 2.`},

    {type:'h',text:'1. Building the brick wall with nested loops'},
    {type:'p',html:`A grid of bricks is rows × columns. To build it, we loop over rows, and <i>inside</i> that loop over columns — a <b>nested loop</b>. Each brick is an object pushed into one array:`},
    {type:'code',lang:'js',code:`const bricks = [];
const ROWS = 4, COLS = 8;
const BW = 52, BH = 20, GAP = 4, TOP = 40, LEFT = 16;

for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    bricks.push({
      x: LEFT + c * (BW + GAP),
      y: TOP  + r * (BH + GAP),
      w: BW, h: BH,
      alive: true            // we'll set this false when it's hit
    });
  }
}`},
    {type:'note',kind:'key',title:'Nested loops build grids',html:`The outer loop picks the row, the inner loop fills every column in that row. <code class="inline">ROWS × COLS</code> bricks are created with a few lines. The <code class="inline">alive</code> flag lets us "remove" a brick by drawing only the live ones (Part 2).`},

    {type:'h',text:'2. The paddle follows the mouse'},
    {type:'p',html:`Breakout feels best with mouse control. Using the <code class="inline">getBoundingClientRect</code> trick from Session 11, we set the paddle's centre to the mouse x, clamped to the canvas:`},
    {type:'code',lang:'js',code:`canvas.addEventListener("mousemove", function (e) {
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  paddle.x = mouseX - paddle.w / 2;                  // centre on cursor
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x)); // clamp
});`},

    {type:'h',text:'3. The ball bounces off walls and paddle'},
    {type:'p',html:`Same physics as Pong: move by velocity, flip on edges, and bounce up off the paddle (AABB from Session 12). We'll handle brick hits in Part 2.`},

    {type:'h',text:'4. Breakout — Part 1, assembled'},
    {type:'p',html:`The full playfield: a wall of bricks, a mouse paddle, and a ball bouncing off the walls and paddle. Move your mouse over the canvas. The ball passes through bricks for now — Part 2 makes them break.`},
    {type:'run',label:'Breakout Part 1 — move your mouse over the canvas',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#06081a;border:3px solid #6c8cff;border-radius:10px;cursor:none}
</style></head>
<body>
  <canvas id="game" width="448" height="320"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;

    const paddle = { x: W/2 - 40, y: H - 24, w: 80, h: 12 };
    const ball = { x: W/2, y: H - 60, r: 8, vx: 3, vy: -3 };

    const bricks = [];
    const ROWS = 4, COLS = 8, BW = 50, BH = 18, GAP = 4, TOP = 36, LEFT = 16;
    const colours = ["#fb7185","#fbbf24","#34d399","#6c8cff"];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        bricks.push({ x: LEFT + c*(BW+GAP), y: TOP + r*(BH+GAP), w: BW, h: BH, alive: true, colour: colours[r] });

    canvas.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      paddle.x = (e.clientX - rect.left) - paddle.w/2;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    });

    function update() {
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x - ball.r < 0 || ball.x + ball.r > W) ball.vx = -ball.vx;
      if (ball.y - ball.r < 0) ball.vy = -ball.vy;
      // paddle bounce
      if (ball.y + ball.r > paddle.y &&
          ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.vy > 0) {
        ball.vy = -Math.abs(ball.vy);
        ball.vx += ((ball.x - (paddle.x + paddle.w/2)) / paddle.w) * 3; // angle
      }
      // fell off the bottom -> just bounce for this session
      if (ball.y - ball.r > H) ball.vy = -Math.abs(ball.vy);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.colour;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
      ctx.fillStyle = "#e9ecff";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'note',kind:'tip',title:'for...of is a friendly loop',html:`Notice <code class="inline">for (const b of bricks)</code> — a cleaner way to visit every item in an array when you don't need the index. It reads as "for each brick b in bricks". Use it whenever you just want each element.`},

    {type:'exercise',title:'Shape the level',html:`<ol>
      <li>Change <code class="inline">ROWS</code> and <code class="inline">COLS</code> to make a bigger or smaller wall.</li>
      <li>Make the paddle narrower for a harder game.</li>
      <li>Give the ball a faster start and see how it changes the feel.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 20 recap',html:`<b>Nested loops</b> build a grid of brick objects in an array, each with an <code class="inline">alive</code> flag. The paddle follows the <b>mouse</b>; the ball bounces off walls and paddle with a bit of <b>angle</b>. Next session we detect brick hits, add lives and levels, and finish Breakout.`}
  ]
},
{
  id:21, week:11, duration:'≈ 60 minutes',
  title:'Project: Breakout — Part 2',
  objectives:[
    'Detect ball-brick collisions and remove broken bricks',
    'Add lives and a game-over condition',
    'Win a level and detect when all bricks are cleared',
    'Polish with score, sound and a restart'
  ],
  blocks:[
    {type:'p',html:`Time to make those bricks breakable and turn Breakout into a real, winnable game. We'll detect ball-brick collisions, add lives and scoring, and handle winning (all bricks cleared) and losing (out of lives). This is your third complete game — and the most sophisticated yet.`},
    {type:'note',kind:'info',html:`Continue from Session 20 in <code class="inline">session-21</code>, or build on the finished demo below.`},

    {type:'h',text:'1. Breaking bricks'},
    {type:'p',html:`Each frame we test the ball against every <i>alive</i> brick using AABB (Session 12). On a hit: kill the brick, score a point, and bounce the ball:`},
    {type:'code',lang:'js',code:`for (const b of bricks) {
  if (!b.alive) continue;            // skip already-broken bricks
  if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
      ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
    b.alive = false;                 // break it
    score += 10;
    ball.vy = -ball.vy;              // bounce
    break;                           // one brick per frame is enough
  }
}`},
    {type:'note',kind:'tip',title:'Why break out of the loop',html:`The <code class="inline">break</code> stops checking after the first hit. Without it, a ball touching two bricks at once could bounce twice and behave strangely. One brick per frame keeps the physics clean.`},

    {type:'h',text:'2. Lives and losing'},
    {type:'p',html:`Now the bottom edge is dangerous. If the ball falls past the paddle, the player loses a life and the ball resets. At zero lives, it's game over:`},
    {type:'code',lang:'js',code:`if (ball.y - ball.r > H) {     // fell off the bottom
  lives--;
  if (lives <= 0) {
    state = "over";
  } else {
    resetBall();               // re-centre and serve again
  }
}`},

    {type:'h',text:'3. Winning the level'},
    {type:'p',html:`The player wins when no bricks remain alive. We check with a quick test — does <i>any</i> brick still live?`},
    {type:'code',lang:'js',code:`const anyLeft = bricks.some(b => b.alive);
if (!anyLeft) {
  state = "won";
}`},
    {type:'note',kind:'info',title:'.some() asks "is any true?"',html:`<code class="inline">bricks.some(b => b.alive)</code> returns <code class="inline">true</code> if at least one brick is still alive. It's a tidy way to check a whole array for a condition — handy for win checks.`},

    {type:'h',text:'4. The complete Breakout'},
    {type:'p',html:`Breaking bricks, score, three lives, win and lose states, and restart on <kbd>R</kbd>. Move the mouse to control the paddle and clear the wall. This is a real, finished game.`},
    {type:'run',label:'Full Breakout — mouse to move, clear the bricks, R to restart',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#06081a;border:3px solid #6c8cff;border-radius:10px;cursor:none;outline:none}
</style></head>
<body>
  <canvas id="game" width="448" height="340" tabindex="0"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    canvas.focus();

    const paddle = { x: W/2-40, y: H-24, w: 80, h: 12 };
    const ball = { x: W/2, y: H-60, r: 8, vx: 3, vy: -3 };
    const colours = ["#fb7185","#fbbf24","#34d399","#6c8cff"];
    let bricks, score, lives, state;

    function buildLevel() {
      bricks = [];
      const ROWS=4, COLS=8, BW=50, BH=18, GAP=4, TOP=36, LEFT=16;
      for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++)
        bricks.push({ x:LEFT+c*(BW+GAP), y:TOP+r*(BH+GAP), w:BW, h:BH, alive:true, colour:colours[r] });
    }
    function resetBall() { ball.x=W/2; ball.y=H-60; ball.vx=3*(Math.random()<.5?1:-1); ball.vy=-3; }
    function newGame() { buildLevel(); resetBall(); score=0; lives=3; state="playing"; }
    newGame();

    canvas.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      paddle.x = (e.clientX - rect.left) - paddle.w/2;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    });
    canvas.addEventListener("keydown", e => {
      if ((e.key==="r"||e.key==="R") && state!=="playing") newGame();
    });

    function update() {
      if (state !== "playing") return;
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x - ball.r < 0 || ball.x + ball.r > W) ball.vx = -ball.vx;
      if (ball.y - ball.r < 0) ball.vy = -ball.vy;
      // paddle
      if (ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x+paddle.w && ball.vy>0) {
        ball.vy = -Math.abs(ball.vy);
        ball.vx += ((ball.x-(paddle.x+paddle.w/2))/paddle.w)*3;
      }
      // bricks
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h) {
          b.alive=false; score+=10; ball.vy=-ball.vy; break;
        }
      }
      // win?
      if (!bricks.some(b=>b.alive)) state="won";
      // lose a life?
      if (ball.y - ball.r > H) {
        lives--;
        if (lives<=0) state="over"; else resetBall();
      }
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      for (const b of bricks) { if(!b.alive) continue; ctx.fillStyle=b.colour; ctx.fillRect(b.x,b.y,b.w,b.h); }
      ctx.fillStyle="#e9ecff"; ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
      ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
      // HUD
      ctx.font="15px system-ui"; ctx.fillStyle="#a3aad6";
      ctx.fillText("Score: "+score, 12, 22);
      ctx.fillText("Lives: "+lives, W-78, 22);
      if (state!=="playing") {
        ctx.fillStyle="rgba(0,0,0,0.65)"; ctx.fillRect(0,H/2-36,W,72);
        ctx.fillStyle="#fff"; ctx.font="22px system-ui"; ctx.textAlign="center";
        ctx.fillText(state==="won" ? "You cleared it! 🎉" : "Game Over", W/2, H/2-2);
        ctx.font="14px system-ui"; ctx.fillText("Press R to play again", W/2, H/2+22);
        ctx.textAlign="left";
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'exercise',title:'Level it up',html:`<ol>
      <li>After winning, build a new, harder level (more rows, faster ball) instead of stopping. Add a <code class="inline">level</code> variable.</li>
      <li>Add the <code class="inline">beep()</code> helper from Session 19 and play a blip on every brick break.</li>
      <li>Make the top row of bricks need <i>two</i> hits (give bricks a <code class="inline">hits</code> count) — they change colour before breaking.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 21 recap — three games built 🏆',html:`You added brick <b>collisions</b> with an <code class="inline">alive</code> flag, <b>lives</b>, scoring, and <b>win/lose</b> states with restart. Breakout is done — your most sophisticated game. Next: making the on-screen info (the <b>HUD</b>) and level flow polished and professional.`}
  ]
},
{
  id:22, week:11, duration:'≈ 60 minutes',
  title:'Scoring, Levels & a Heads-Up Display (HUD)',
  objectives:[
    'Design a clear, readable on-screen HUD',
    'Add level progression with a rising difficulty curve',
    'Give the player satisfying feedback (flashes, pop-ups)',
    'Apply basic accessibility to your games'
  ],
  blocks:[
    {type:'p',html:`Your games <i>work</i> — now let's make them feel <b>finished</b>. A good <b>HUD</b> (Heads-Up Display) tells the player what matters at a glance, levels keep them hooked, and small touches of feedback make every action satisfying. This polish is what separates a demo from a game people enjoy.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-22</code>. These techniques drop into any game you've built.`},

    {type:'h',text:'1. A clean HUD'},
    {type:'p',html:`A HUD is just text and simple shapes drawn <i>on top</i> of the game, every frame, after everything else. Keep it readable: clear font, good contrast, consistent corners. Lives are often shown as little icons rather than a number:`},
    {type:'code',lang:'js',code:`function drawHUD() {
  ctx.fillStyle = "#e9ecff";
  ctx.font = "16px system-ui";
  ctx.fillText("Score " + score, 12, 24);
  ctx.fillText("Level " + level, W/2 - 28, 24);

  // lives as little squares
  for (let i = 0; i < lives; i++) {
    ctx.fillRect(W - 20 - i * 18, 12, 12, 12);
  }
}`},
    {type:'note',kind:'key',title:'Draw the HUD last',html:`Because the HUD sits on top, draw it <i>after</i> the game world in your <code class="inline">draw()</code> function. Otherwise the background would paint over it.`},

    {type:'h',text:'2. Levels and difficulty curves'},
    {type:'p',html:`A <b>level</b> is just a number you raise when the player clears a goal, used to scale the challenge. The art is a gentle <b>difficulty curve</b> — harder, but never suddenly impossible:`},
    {type:'code',lang:'js',code:`let level = 1;

function nextLevel() {
  level++;
  ballSpeed = 3 + level * 0.5;   // a little faster each level
  enemyCount = 2 + level;        // a few more enemies
}`},
    {type:'note',kind:'tip',title:'Tune with small steps',html:`Scale difficulty in small increments (<code class="inline">+0.5</code> speed, <code class="inline">+1</code> enemy). Big jumps frustrate players. Playtest: if you keep dying at the same level, ease that step; if it's boring, steepen it.`},

    {type:'h',text:'3. Feedback that feels good'},
    {type:'p',html:`Tiny reactions make a game juicy. Two easy ones: a brief screen <b>flash</b> on a big event, and floating <b>"+10"</b> score pop-ups. Here's a demo — click anywhere to score and watch the flash and the rising number.`},
    {type:'run',label:'Click anywhere — feel the feedback',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#06081a;border:3px solid #6c8cff;border-radius:10px;cursor:pointer}
</style></head>
<body>
  <canvas id="game" width="400" height="280"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    let score = 0, level = 1, lives = 3;
    let flash = 0;                 // flash strength, fades each frame
    let pops = [];                 // floating "+10" texts

    canvas.addEventListener("click", e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX-rect.left, y = e.clientY-rect.top;
      score += 10;
      flash = 0.5;                 // trigger a flash
      pops.push({ x, y, life: 1 }); // spawn a pop-up
      if (score % 50 === 0) level++;
    });

    function draw() {
      ctx.fillStyle = "#06081a"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = "#a3aad6"; ctx.font = "14px system-ui"; ctx.textAlign = "center";
      ctx.fillText("Click anywhere to score", W/2, H/2);

      // floating score pop-ups
      for (let i = pops.length-1; i >= 0; i--) {
        const p = pops[i];
        p.y -= 1; p.life -= 0.02;
        ctx.fillStyle = "rgba(52,211,153," + Math.max(0,p.life) + ")";
        ctx.font = "20px system-ui";
        ctx.fillText("+10", p.x, p.y);
        if (p.life <= 0) pops.splice(i,1);
      }

      // HUD (drawn last)
      ctx.textAlign = "left"; ctx.fillStyle = "#e9ecff"; ctx.font = "16px system-ui";
      ctx.fillText("Score " + score, 12, 24);
      ctx.fillText("Level " + level, W/2 - 26, 24);
      for (let i = 0; i < lives; i++) ctx.fillRect(W - 20 - i*18, 12, 12, 12);

      // screen flash (a fading white overlay)
      if (flash > 0) {
        ctx.fillStyle = "rgba(255,255,255," + flash + ")";
        ctx.fillRect(0,0,W,H);
        flash -= 0.04;
      }
      requestAnimationFrame(draw);
    }
    draw();
  <\/script>
</body>
</html>`},

    {type:'h',text:'4. A little accessibility'},
    {type:'p',html:`Make games playable for more people with a few easy habits:`},
    {type:'list',items:[
      `<b>Readable text</b>: decent size, high contrast against the background.`,
      `<b>Don't rely on colour alone</b>: pair colour with shape or text (some players are colour-blind).`,
      `<b>Clear, forgiving controls</b>: support arrows <i>and</i> WASD; allow pausing.`,
      `<b>Show the controls</b>: a one-line "Arrow keys to move, Space to start" goes a long way.`
    ]},

    {type:'exercise',title:'Polish a game',html:`<ol>
      <li>Add the floating "+10" pop-ups to your Breakout when a brick breaks.</li>
      <li>Add a level counter to Snake that rises every 5 points and speeds the snake up.</li>
      <li>Draw lives as little hearts or squares instead of a number in one of your games.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 22 recap',html:`A <b>HUD</b> is text/shapes drawn last, every frame — keep it readable. <b>Levels</b> raise a number to scale difficulty along a gentle <b>curve</b>. Small <b>feedback</b> (flash, pop-ups) makes games feel great, and a little <b>accessibility</b> welcomes more players. Next: our finale project — a <b>platformer</b> with gravity and jumping.`}
  ]
},
{
  id:23, week:12, duration:'≈ 60 minutes',
  title:'A Simple Platformer — Gravity & Jumping',
  objectives:[
    'Apply gravity to make a character fall',
    'Make the character jump with upward velocity',
    'Land on and stand on platforms using collisions',
    'Combine input and physics into a playable mini level'
  ],
  blocks:[
    {type:'p',html:`The grand finale project: a <b>platformer</b>. Gravity, jumping, and landing on ledges feel like magic, but they're built entirely from things you already know — velocity (S9), input (S10) and rectangle collisions (S12). Getting jump physics to feel right is a genuine rite of passage in game development. Let's earn it.`},
    {type:'note',kind:'info',title:'Real-world example',html:`This project echoes <b>Super Mario Bros.</b> (Nintendo, 1985), the game that defined the platformer genre and set the template — run, jump, land — that almost every platform game since has followed. Earlier titles like <i>Donkey Kong</i> (1981) and <i>Pitfall!</i> (1982) paved the way, but Mario is the one that made "jump physics feel right" the industry benchmark.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-23</code>. This is the most physics-y session — take it step by step.`},

    {type:'h',text:'1. Gravity is just constant downward velocity'},
    {type:'p',html:`Gravity sounds advanced but it's one line: every frame, add a small amount to the player's vertical velocity. The longer they're in the air, the faster they fall — exactly like real gravity:`},
    {type:'code',lang:'js',code:`const GRAVITY = 0.6;

function update() {
  player.vy += GRAVITY;   // accelerate downward every frame
  player.y  += player.vy; // apply velocity to position
}`},
    {type:'note',kind:'key',title:'Why they accelerate',html:`Because we <i>add</i> to <code class="inline">vy</code> each frame, it grows: 0.6, 1.2, 1.8… so the fall speeds up over time. That growing velocity is what makes jumps arc naturally instead of moving like an elevator.`},

    {type:'h',text:'2. Jumping: a burst of upward velocity'},
    {type:'p',html:`A jump is a sudden <i>negative</i> velocity (remember: up is negative y). Gravity then pulls them back down, creating the arc. The crucial rule: you can only jump when standing on something — otherwise you'd jump in mid-air forever:`},
    {type:'code',lang:'js',code:`const JUMP = -12;

if (keys[" "] && player.onGround) {   // space, and only if grounded
  player.vy = JUMP;                   // launch upward
  player.onGround = false;
}`},
    {type:'note',kind:'tip',title:'The onGround flag',html:`We track whether the player is standing on a surface with a boolean. It's set <code class="inline">true</code> when they land (next step) and <code class="inline">false</code> the moment they jump or walk off an edge. No flag = infinite mid-air jumps.`},

    {type:'h',text:'3. Landing on platforms'},
    {type:'p',html:`Platforms are rectangles. Each frame we assume the player is falling (<code class="inline">onGround = false</code>), then check collisions: if the player is overlapping a platform <i>and</i> moving downward, we sit them on top and mark them grounded:`},
    {type:'code',lang:'js',code:`player.onGround = false;
for (const p of platforms) {
  if (player.x < p.x + p.w && player.x + player.w > p.x &&
      player.y + player.h > p.y && player.y + player.h < p.y + p.h + 20 &&
      player.vy >= 0) {
    player.y = p.y - player.h;   // snap to the top of the platform
    player.vy = 0;               // stop falling
    player.onGround = true;      // can jump again
  }
}`},
    {type:'note',kind:'warn',title:'Check "moving downward"',html:`The <code class="inline">player.vy &gt;= 0</code> test means we only land when falling, not when jumping up through a platform. Without it, the player would stick to the underside of ledges. Small detail, big difference in feel.`},

    {type:'h',text:'4. The playable platformer'},
    {type:'p',html:`Everything together: gravity, jumping, platforms, and horizontal movement. Click the canvas, then use <kbd>←</kbd> <kbd>→</kbd> to run and <kbd>Space</kbd> to jump. Hop across the ledges!`},
    {type:'run',label:'Mini platformer — click, then ← → to run, Space to jump',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;flex-direction:column;align-items:center;padding:12px;
       font-family:system-ui;color:#a3aad6}
  canvas{background:#0a1530;border:3px solid #6c8cff;border-radius:10px;outline:none}
  p{font-size:13px;margin:8px 0 0}
</style></head>
<body>
  <canvas id="game" width="460" height="300" tabindex="0"></canvas>
  <p>Click, then ← → to run and Space to jump.</p>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    canvas.focus();

    const GRAVITY = 0.6, JUMP = -12, SPEED = 4;
    const player = { x: 40, y: 0, w: 26, h: 30, vx: 0, vy: 0, onGround: false };

    const platforms = [
      { x: 0,   y: H-24, w: W,   h: 24 },   // the ground
      { x: 90,  y: 220,  w: 90,  h: 14 },
      { x: 230, y: 175,  w: 90,  h: 14 },
      { x: 360, y: 130,  w: 80,  h: 14 },
      { x: 180, y: 110,  w: 70,  h: 14 }
    ];

    const keys = {};
    canvas.addEventListener("keydown", e => { keys[e.key] = true; e.preventDefault(); });
    canvas.addEventListener("keyup",   e => { keys[e.key] = false; });

    function update() {
      // horizontal movement
      player.vx = 0;
      if (keys["ArrowLeft"])  player.vx = -SPEED;
      if (keys["ArrowRight"]) player.vx = SPEED;
      player.x += player.vx;
      player.x = Math.max(0, Math.min(W - player.w, player.x));

      // jump
      if (keys[" "] && player.onGround) { player.vy = JUMP; player.onGround = false; }

      // gravity
      player.vy += GRAVITY;
      player.y += player.vy;

      // platform landing
      player.onGround = false;
      for (const p of platforms) {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y + player.h < p.y + p.h + 20 &&
            player.vy >= 0) {
          player.y = p.y - player.h; player.vy = 0; player.onGround = true;
        }
      }
      // fell off the bottom -> respawn
      if (player.y > H) { player.x = 40; player.y = 0; player.vy = 0; }
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = "#23306a";
      for (const p of platforms) ctx.fillRect(p.x, p.y, p.w, p.h);
      // player
      ctx.fillStyle = "#34d399";
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = "#06081a"; // eyes
      ctx.fillRect(player.x+6, player.y+8, 5, 5);
      ctx.fillRect(player.x+15, player.y+8, 5, 5);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'note',kind:'tip',title:'Tune the feel',html:`<code class="inline">GRAVITY</code>, <code class="inline">JUMP</code> and <code class="inline">SPEED</code> are the three dials that define how your platformer feels. A bigger negative <code class="inline">JUMP</code> leaps higher; stronger <code class="inline">GRAVITY</code> makes a snappier, heavier fall. Nudge them and find a feel you love — this is exactly what pro designers spend hours doing.`},

    {type:'exercise',title:'Build your level',html:`<ol>
      <li>Rearrange the platforms into a tricky climb to the top-right corner.</li>
      <li>Add a gold coin (a circle) that disappears and scores when the player touches it (AABB from S12).</li>
      <li>Swap the green box for an animated sprite using your Session 18 skills.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 23 recap — your fourth game 🏆',html:`<b>Gravity</b> = add a little to <code class="inline">vy</code> every frame. <b>Jump</b> = a burst of upward velocity, only when <code class="inline">onGround</code>. <b>Landing</b> = rectangle collision that snaps the player onto a platform and re-grounds them. You've built a platformer — the toolkit is complete. Final session: save scores and publish your game to the world.`}
  ]
},

    {type:'p',html:`This is it — the final session. Real developers don't just build games, they <b>ship</b> them. Today you'll make a score that's remembered between visits, polish a game for release, and put it on the internet so friends can play it with a link. Then we'll map where to go next. You've come an enormous way.`},

    {type:'h',text:'1. Saving a high score with localStorage'},
    {type:'p',html:`<code class="inline">localStorage</code> is a tiny built-in storage box in the browser that <b>remembers data even after the page is closed</b>. Perfect for a high score. It only stores text, so we convert numbers with <code class="inline">Number(...)</code> when reading:`},
    {type:'code',lang:'js',code:`// read the saved best (or 0 if none yet)
let best = Number(localStorage.getItem("highScore")) || 0;

function gameOver() {
  if (score > best) {
    best = score;
    localStorage.setItem("highScore", best);   // save it
  }
}`},
    {type:'list',items:[
      `<code class="inline">setItem(key, value)</code> saves; <code class="inline">getItem(key)</code> reads it back later.`,
      `The data survives refreshes and even restarting the browser, because it's stored on the player's computer.`,
      `Each website has its own private storage, so your game's score won't clash with anything else.`
    ]},
    {type:'p',html:`Try it live — this counter remembers your best click streak even if you reload the page:`},
    {type:'run',label:'Click fast! Your best is saved across reloads',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;font-family:system-ui;color:#e9ecff;
       display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px}
  button{padding:14px 22px;border:none;border-radius:10px;background:#6c8cff;color:#fff;
         font-size:16px;cursor:pointer}
  .big{font-size:30px;font-weight:800}
  .muted{color:#a3aad6;font-size:14px}
</style></head>
<body>
  <div class="muted">Clicks in 3 seconds</div>
  <div class="big" id="score">0</div>
  <button id="go">Start / Click!</button>
  <div class="muted">Best ever: <span id="best">0</span></div>
  <script>
    let best = Number(localStorage.getItem("clickBest")) || 0;
    document.getElementById("best").textContent = best;

    let score = 0, running = false;
    const scoreEl = document.getElementById("score");
    const btn = document.getElementById("go");

    btn.onclick = function () {
      if (!running) {
        running = true; score = 0; scoreEl.textContent = 0;
        btn.textContent = "CLICK!";
        setTimeout(function () {
          running = false;
          btn.textContent = "Start / Click!";
          if (score > best) {
            best = score;
            localStorage.setItem("clickBest", best);   // persist!
            document.getElementById("best").textContent = best;
          }
        }, 3000);
      } else {
        score++; scoreEl.textContent = score;
      }
    };
  <\/script>
</body>
</html>`},
    {type:'note',kind:'tip',html:`Reload this whole page after setting a best — your record is still there. That's <code class="inline">localStorage</code> at work.`},

    {type:'h',text:'2. Pre-launch polish checklist'},
    {type:'p',html:`Before you share a game, run through this quick list:`},
    {type:'list',items:[
      `<b>A title / start screen</b> — never drop players straight into action.`,
      `<b>Clear instructions</b> — one line on the controls and the goal.`,
      `<b>A restart</b> — players should replay without refreshing.`,
      `<b>It handles losing well</b> — a clear game-over and a way to try again.`,
      `<b>Works at different sizes</b> — looks okay on a laptop and a phone.`,
      `<b>No console errors</b> — open DevTools (F12) and check the Console is clean.`
    ]},

    {type:'h',text:'3. Publishing free with GitHub Pages'},
    {type:'p',html:`Your game is just an <code class="inline">index.html</code> file, which means hosting it is easy and free. The most popular route is <b>GitHub Pages</b>:`},
    {type:'olist',items:[
      `Create a free account at <code class="inline">github.com</code>.`,
      `Make a new <b>repository</b> (a project folder in the cloud) — name it something like <code class="inline">my-game</code>.`,
      `Upload your <code class="inline">index.html</code> (and any images/sounds) using the "Add file → Upload files" button.`,
      `Go to the repo's <b>Settings → Pages</b>, and under "Branch" choose <code class="inline">main</code> and save.`,
      `Wait a minute, then visit <code class="inline">https://yourname.github.io/my-game</code> — your game is live on the internet!`
    ]},
    {type:'note',kind:'info',title:'An even quicker option',html:`<b>Netlify Drop</b> (<code class="inline">app.netlify.com/drop</code>) lets you literally drag your project folder onto the page and get a public link in seconds — no account needed to try it. Either way, you now have a URL to share with anyone.`},
    {type:'note',kind:'warn',title:'A note on localStorage when published',html:`Saved scores in <code class="inline">localStorage</code> live in each player's <i>own</i> browser — great for a personal best, but it's not a shared global leaderboard. A true online leaderboard needs a server/database, which is a great topic for your next steps below.`},

    {type:'h',text:'4. Where to go next'},
    {type:'p',html:`You now have real foundations. Brilliant directions from here:`},
    {type:'list',items:[
      `<b>Build, build, build</b> — remix your games, combine ideas, finish small projects. Shipping more games is the fastest way to improve.`,
      `<b>Learn a game framework</b> — <b>Phaser</b> is the natural next step: it's JavaScript, and it handles sprites, physics, sound and scenes for you so you can build bigger games faster.`,
      `<b>Go deeper on the maths</b> — vectors and basic trigonometry unlock smooth aiming, rotation and more advanced movement.`,
      `<b>Add a backend</b> — learn a little server-side code to build real online leaderboards and save games.`,
      `<b>Join a game jam</b> — events like <b>Ludum Dare</b> or <b>itch.io</b> jams are a fun, friendly way to make a game in a weekend and meet other developers.`
    ]},

    {type:'exercise',title:'Your capstone',html:`<ol>
      <li>Pick your favourite game, add a start screen, instructions, a saved high score, and a restart.</li>
      <li>Run the polish checklist and fix anything missing.</li>
      <li>Publish it with GitHub Pages or Netlify Drop, and share the link with a friend.</li>
      <li>Write down one new game idea you'd like to build next.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Congratulations — you did it! 🎉',html:`Over three months you went from installing an editor to building <b>four complete games</b> and publishing one to the web. You learned HTML, CSS, JavaScript, the game loop, motion, input, collisions, sprites, sound, and how to organise and ship real software. That is a genuinely hard thing to achieve — be proud of it. The most important thing now is simple: <b>keep building</b>. Every game you make will be better than the last. Welcome to game development. 🚀`}
  ]
