    {type:'note',kind:'warn',title:'Looping while removing',html:`Removing items <i>while</i> looping forward can skip elements, because the indexes shift. A common safe trick is to loop <b>backwards</b> (from <code class="inline">length-1</code> down to 0) when deleting. We'll use this in Breakout — just file it away for now.`},

    {type:'exercise',title:'Loop and list challenges',html:`<ol>
      <li>Change <code class="inline">HOW_MANY</code> to 150 stars, then to 5. One number controls everything.</li>
      <li>Make the stars different colours: build a <code class="inline">colours</code> array and pick <code class="inline">colours[i % colours.length]</code> for each star.</li>
      <li>Use a loop to draw a horizontal row of 8 squares evenly spaced across the canvas (hint: x position = <code class="inline">i * 45</code>).</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 7 recap',html:`<b>Arrays</b> hold lists; index from <b>0</b>; <code class="inline">.push()</code> adds, <code class="inline">.splice()</code> removes; <code class="inline">.length</code> counts. The <b>for loop</b> repeats with a counter. Looping over an array lets one piece of code handle any number of objects. Next: the <b>game loop</b> — the engine that makes everything move.`}
  ]
},
{
  id:8, week:4, duration:'≈ 60 minutes',
  title:'The Game Loop — Bringing the Screen to Life',
  objectives:[
    'Understand frames and why games redraw constantly',
    'Use requestAnimationFrame to create a smooth loop',
    'Structure every game as update() then draw(), each frame',
    'Clear the canvas correctly between frames'
  ],
  blocks:[
    {type:'p',html:`This is the heartbeat of every game you'll ever make. A <b>game loop</b> runs roughly 60 times every second. On each pass it does two jobs: <b>update</b> the world (move things, check rules) and then <b>draw</b> the new picture. Do that fast enough and still images blur into smooth motion — exactly like a flip-book or a film. Today everything from Month 1 comes together.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-08</code>. This is the big payoff session — by the end you'll have a real, running animation engine.`},

    {type:'h',text:'1. What is a "frame"?'},
    {type:'p',html:`A <b>frame</b> is one single picture. A game draws a slightly different frame over and over, very fast. Screens usually refresh <b>60 times per second</b> (written "60 FPS" — frames per second), so a smooth game aims to produce a fresh frame 60 times a second. Each frame, things move a tiny bit; your eye stitches them into motion.`},
    {type:'note',kind:'key',title:'The whole idea of animation',html:`Nothing actually "moves" on screen. We just <b>redraw</b> a shape a few pixels over, 60 times a second. Movement is an illusion built from many still frames.`},

    {type:'h',text:'2. requestAnimationFrame — the right way to loop'},
    {type:'p',html:`We need something to run our code once per frame. The browser gives us exactly that: <code class="inline">requestAnimationFrame</code>. You hand it a function, and it calls that function right before the next screen refresh. If that function asks for the <i>next</i> frame too, you get a continuous loop:`},
    {type:'code',lang:'js',code:`function loop() {
  // ...do one frame of work here...

  requestAnimationFrame(loop);  // ask the browser for the next frame
}

requestAnimationFrame(loop);    // kick it off once to start`},
    {type:'note',kind:'tip',title:'Why not just use a repeated timer?',html:`You might know <code class="inline">setInterval</code>. <code class="inline">requestAnimationFrame</code> is better for games: it syncs to the screen's refresh for smooth motion, and it automatically pauses when the tab isn't visible, saving battery. Always use it for game loops.`},

    {type:'h',text:'3. The update / draw pattern'},
    {type:'p',html:`Professionals split each frame into two clear steps, each its own function:`},
    {type:'olist',items:[
      `<code class="inline">update()</code> — change the world: move objects, check collisions, apply the rules. <b>No drawing here.</b>`,
      `<code class="inline">draw()</code> — paint the current state of the world onto the canvas. <b>No logic here.</b>`
    ]},
    {type:'p',html:`Keeping "thinking" and "painting" separate makes games far easier to build and fix. The loop just calls them in order:`},
    {type:'code',lang:'js',code:`function loop() {
  update();   // 1. move and decide
  draw();     // 2. paint the result
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);`},

    {type:'h',text:'4. Clearing the canvas'},
    {type:'p',html:`There's one essential step inside <code class="inline">draw()</code>: <b>erase the previous frame first</b>. If you don't, every position the object visited stays painted and you get a long smear. <code class="inline">clearRect(0, 0, width, height)</code> wipes the whole canvas clean:`},
    {type:'code',lang:'js',code:`function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);  // wipe first!
  // ...now draw everything fresh...
}`},
    {type:'note',kind:'warn',title:'The #1 beginner motion bug',html:`Forgetting to clear gives you a "snake trail" of every past position. If a moving object leaves a smear, the fix is almost always a missing <code class="inline">clearRect</code> at the top of <code class="inline">draw()</code>. (Sometimes you fill the whole canvas with a background colour instead — that clears it too.)`},

    {type:'h',text:'5. Your first real game loop'},
    {type:'p',html:`Here is a complete, well-structured loop: a square slides across the screen and wraps around. This is the exact skeleton every game in this course uses. Read the comments, press <b>Run</b>, then change the speed and size.`},
    {type:'run',label:'A complete game loop — change speed, then Run',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#0b0e24;border:3px solid #6c8cff;border-radius:12px}
</style></head>
<body>
  <canvas id="game" width="360" height="200"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;

    // ---- the world (its current state) ----
    let player = { x: 0, y: 80, size: 40, speed: 3 };

    // ---- STEP 1: update the world ----
    function update() {
      player.x += player.speed;             // move right
      if (player.x > W) {                   // gone off the right edge?
        player.x = -player.size;            // wrap back to the left
      }
    }

    // ---- STEP 2: draw the world ----
    function draw() {
      ctx.clearRect(0, 0, W, H);            // wipe the old frame
      ctx.fillStyle = "#34d399";
      ctx.fillRect(player.x, player.y, player.size, player.size);
    }

    // ---- the loop: update, draw, repeat forever ----
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'p',html:`Look closely at the structure — <code class="inline">update()</code>, <code class="inline">draw()</code>, and a <code class="inline">loop()</code> that calls both and requests the next frame. Every single game from here on is a richer version of this exact pattern. You now understand the engine under all of them.`},

    {type:'exercise',title:'Make the loop yours',html:`<ol>
      <li>Change <code class="inline">player.speed</code> to 6, then to 1. Watch the frame-by-frame motion speed up and slow down.</li>
      <li>Make the square move <i>diagonally</i> by adding a <code class="inline">player.y += 1</code> in <code class="inline">update()</code>, and wrap it vertically too.</li>
      <li>Add a second object (a circle) with its own position and speed, updated and drawn alongside the square.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 8 recap & Month 1 complete 🎉',html:`A <b>game loop</b> runs ~60 FPS, calling <code class="inline">update()</code> (move & decide) then <code class="inline">draw()</code> (paint), driven by <code class="inline">requestAnimationFrame</code>. Always <code class="inline">clearRect</code> before redrawing. That's the end of Month 1 — you now have tools, HTML/CSS/JS fundamentals, and a working engine. Month 2 turns this skeleton into real games, starting with movement and player control.`}
  ]
},
{
  id:9, week:5, duration:'≈ 60 minutes',
  title:'Animation & Movement',
  objectives:[
    'Move objects smoothly by changing position each frame',
    'Understand velocity as speed plus direction',
    'Make objects bounce off all four canvas edges',
    'Understand why we keep velocity in variables'
  ],
  blocks:[
    {type:'p',html:`Your game loop runs; now let's make things move with purpose. Movement is simple at heart — change an object's position a little each frame — but doing it with <b>velocity</b> variables unlocks bouncing, gravity, and physics later on. This session turns the loop from Session 8 into believable motion.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-09</code>. We build directly on the game loop (S8) and the edge-checks (S6).`},

    {type:'h',text:'1. Position and velocity'},
    {type:'p',html:`Every moving object needs two ideas:`},
    {type:'list',items:[
      `<b>Position</b> — where it is right now: <code class="inline">x</code> and <code class="inline">y</code>.`,
      `<b>Velocity</b> — how it's moving: <code class="inline">vx</code> (horizontal) and <code class="inline">vy</code> (vertical). We use the short names <code class="inline">vx</code>/<code class="inline">vy</code> by convention.`
    ]},
    {type:'p',html:`Each frame, you add velocity to position. That's it — that's motion:`},
    {type:'code',lang:'js',code:`x += vx;   // move horizontally by vx pixels this frame
y += vy;   // move vertically by vy pixels this frame`},
    {type:'note',kind:'key',title:'Velocity = speed + direction',html:`A positive <code class="inline">vx</code> moves right, negative moves left. A positive <code class="inline">vy</code> moves <i>down</i> (remember y grows downward!), negative moves up. The <i>size</i> of the number is the speed: <code class="inline">vx = 5</code> is faster than <code class="inline">vx = 1</code>.`},

    {type:'h',text:'2. Bouncing: flip the velocity'},
    {type:'p',html:`To bounce off a wall, you don't teleport the object — you <b>reverse its direction</b> by flipping the sign of its velocity. A ball moving right (<code class="inline">vx = 4</code>) that hits the right wall starts moving left (<code class="inline">vx = -4</code>). The trick is one line:`},
    {type:'code',lang:'js',code:`vx = -vx;   // reverse horizontal direction (bounce off a side wall)
vy = -vy;   // reverse vertical direction (bounce off top/bottom)`},
    {type:'p',html:`We only flip <i>when</i> the object reaches an edge — using the <code class="inline">if</code> checks you learned in Session 6. For a circle of radius <code class="inline">r</code>, its left edge is at <code class="inline">x - r</code> and its right edge at <code class="inline">x + r</code>.`},

    {type:'h',text:'3. The bouncing ball (full demo)'},
    {type:'p',html:`Here is the classic bouncing ball — the foundation of Pong, Breakout and countless games. Notice the clean structure: an object holding position and velocity, an <code class="inline">update()</code> that moves and bounces, a <code class="inline">draw()</code> that paints. Press <b>Run</b>, then experiment with the velocity numbers and the radius.`},
    {type:'run',label:'A bouncing ball — change vx, vy, radius and Run',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#0b0e24;border:3px solid #6c8cff;border-radius:12px}
</style></head>
<body>
  <canvas id="game" width="380" height="240"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;

    // The ball: position (x,y), velocity (vx,vy), and size (r)
    let ball = { x: 60, y: 50, vx: 3.5, vy: 2.6, r: 16 };

    function update() {
      // 1. move by the velocity
      ball.x += ball.vx;
      ball.y += ball.vy;

      // 2. bounce off left/right walls
      if (ball.x - ball.r < 0 || ball.x + ball.r > W) {
        ball.vx = -ball.vx;
      }
      // 3. bounce off top/bottom walls
      if (ball.y - ball.r < 0 || ball.y + ball.r > H) {
        ball.vy = -ball.vy;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'note',kind:'warn',title:'Keeping the ball from "sticking"',html:`If you set the velocity too high, a ball can move <i>past</i> the wall in one frame, fail the edge check on the next frame, and jitter or escape. For now keep speeds modest (a few pixels per frame). In Pong we'll also nudge the ball back inside the wall when it bounces, which fully prevents sticking.`},

    {type:'h',text:'4. A word on frame rate and speed'},
    {type:'p',html:`Because we move by a fixed amount each frame, the speed depends on how many frames per second the device runs. On most screens that's a steady 60 FPS, so our games feel consistent. Professional engines multiply movement by a "delta time" so speed is identical on every device. That's an advanced refinement — we'll mention it again later, but fixed-per-frame movement is perfect while you learn.`},

    {type:'exercise',title:'Experiment with motion',html:`<ol>
      <li>Give the ball a much larger <code class="inline">vx</code> and a tiny <code class="inline">vy</code>. How does its path change?</li>
      <li>Add a fading trail: instead of <code class="inline">clearRect</code>, fill the canvas each frame with a semi-transparent black <code class="inline">ctx.fillStyle = "rgba(11,14,36,0.2)"; ctx.fillRect(0,0,W,H);</code>.</li>
      <li>Add a second ball with different speed and colour. Two objects, two updates — easy now that you have the pattern.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 9 recap',html:`Motion = add <b>velocity</b> (<code class="inline">vx</code>, <code class="inline">vy</code>) to <b>position</b> (<code class="inline">x</code>, <code class="inline">y</code>) each frame. <b>Bounce</b> by flipping a velocity's sign when an edge is reached. This bouncing ball becomes Pong's ball very soon. Next: letting the <i>player</i> take control with the keyboard.`}
  ]
},
{
  id:10, week:5, duration:'≈ 60 minutes',
  title:'Keyboard Input — Controlling the Player',
  objectives:[
    'Listen for keyboard events with addEventListener',
    'Track which keys are currently held down',
    'Move a player smoothly with the arrow keys',
    'Keep the player clamped inside the play area'
  ],
  blocks:[
    {type:'p',html:`A loop with motion is an animation. Add <b>input</b> and it becomes a <i>game</i> — something the player controls. Today you'll capture keyboard presses and steer an object around the canvas. This is the same control code we'll reuse for Pong's paddle and Snake's direction.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-10</code>. Click the demo canvas first so it has "focus", then use your arrow keys.`},

    {type:'h',text:'1. Events: the browser tells you things happened'},
    {type:'p',html:`The browser constantly notices things — a key pressed, the mouse moved, a button clicked. These are <b>events</b>. You ask to be notified of an event with <code class="inline">addEventListener</code>, handing it a function to run when the event fires:`},
    {type:'code',lang:'js',code:`document.addEventListener("keydown", function (event) {
  console.log("You pressed: " + event.key);
});`},
    {type:'list',items:[
      `<code class="inline">"keydown"</code> fires the moment a key goes down; <code class="inline">"keyup"</code> fires when it's released.`,
      `The function receives an <code class="inline">event</code> object with details. <code class="inline">event.key</code> tells you which key — e.g. <code class="inline">"ArrowLeft"</code>, <code class="inline">"a"</code>, <code class="inline">" "</code> (the spacebar).`
    ]},

    {type:'h',text:'2. The "keys held down" pattern'},
    {type:'p',html:`A beginner's first instinct is to move the player directly inside <code class="inline">keydown</code>. That feels jerky, because the operating system repeats a held key with a stutter. The professional approach: just <b>record</b> which keys are currently down in an object, and let the <i>game loop</i> read that object every frame. Smooth, continuous movement results.`},
    {type:'code',lang:'js',code:`const keys = {};   // remembers which keys are held

document.addEventListener("keydown", function (e) {
  keys[e.key] = true;    // mark this key as down
});
document.addEventListener("keyup", function (e) {
  keys[e.key] = false;   // mark it as up again
});

// Later, inside update(), we simply ask: is this key down?
if (keys["ArrowLeft"]) { /* move left */ }`},
    {type:'note',kind:'key',title:'Why separate input from movement',html:`Events only tell you <i>when</i> a key changes. The game loop decides <i>how far</i> to move each frame. Keeping a <code class="inline">keys</code> record bridges the two: events update the record, the loop reads it 60 times a second. This pattern scales to any control scheme.`},

    {type:'h',text:'3. Moving and clamping the player'},
    {type:'p',html:`Inside <code class="inline">update()</code> we check the keys and change position. We also <b>clamp</b> the player so it can't leave the canvas — using <code class="inline">if</code> checks, or the handy <code class="inline">Math.max</code>/<code class="inline">Math.min</code> pair:`},
    {type:'code',lang:'js',code:`if (keys["ArrowLeft"])  player.x -= player.speed;
if (keys["ArrowRight"]) player.x += player.speed;

// keep player.x between 0 and (W - player.size)
player.x = Math.max(0, Math.min(W - player.size, player.x));`},

    {type:'h',text:'4. Full demo: drive the square'},
    {type:'p',html:`Click the canvas, then use the <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> arrow keys. The square moves smoothly while a key is held and stops at the edges. Read how <code class="inline">keys</code> is filled by the events and read by <code class="inline">update()</code>.`},
    {type:'run',label:'Click the canvas, then use arrow keys',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;flex-direction:column;align-items:center;padding:12px;
       font-family:system-ui;color:#a3aad6}
  canvas{background:#0b0e24;border:3px solid #6c8cff;border-radius:12px;outline:none}
  p{margin:8px 0 0;font-size:13px}
</style></head>
<body>
  <canvas id="game" width="380" height="240" tabindex="0"></canvas>
  <p>Click the box first, then press the arrow keys.</p>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    canvas.focus();

    let player = { x: 170, y: 100, size: 36, speed: 4 };
    const keys = {};

    // record key state (we listen on the canvas so arrows don't scroll the page)
    canvas.addEventListener("keydown", function (e) { keys[e.key] = true;  e.preventDefault(); });
    canvas.addEventListener("keyup",   function (e) { keys[e.key] = false; });

    function update() {
      if (keys["ArrowLeft"])  player.x -= player.speed;
      if (keys["ArrowRight"]) player.x += player.speed;
      if (keys["ArrowUp"])    player.y -= player.speed;
      if (keys["ArrowDown"])  player.y += player.speed;

      // clamp inside the canvas
      player.x = Math.max(0, Math.min(W - player.size, player.x));
      player.y = Math.max(0, Math.min(H - player.size, player.y));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#34d399";
      ctx.fillRect(player.x, player.y, player.size, player.size);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'note',kind:'warn',title:'Two common gotchas',html:`(1) Arrow keys can scroll the page — call <code class="inline">e.preventDefault()</code> in <code class="inline">keydown</code> to stop that. (2) The element must have <b>focus</b> to receive key events; that's why the canvas has <code class="inline">tabindex="0"</code> and we click it. In a full-page game you'd listen on <code class="inline">document</code> instead.`},

    {type:'exercise',title:'Take control',html:`<ol>
      <li>Increase <code class="inline">player.speed</code> and feel the difference.</li>
      <li>Add <b>WASD</b> support: also check <code class="inline">keys["w"]</code>, <code class="inline">keys["a"]</code>, etc., alongside the arrows.</li>
      <li>Make the spacebar change the player's colour. (Use a <code class="inline">keydown</code> check for <code class="inline">e.key === " "</code>.)</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 10 recap',html:`<b>Events</b> (<code class="inline">keydown</code>/<code class="inline">keyup</code> via <code class="inline">addEventListener</code>) tell you when keys change. Store them in a <code class="inline">keys</code> object and read it in <code class="inline">update()</code> for smooth control. <b>Clamp</b> with <code class="inline">Math.max</code>/<code class="inline">Math.min</code>. Next: mouse and touch input.`}
  ]
},
{
  id:11, week:6, duration:'≈ 60 minutes',
  title:'Mouse & Touch Input',
  objectives:[
    'Read the mouse position relative to the canvas correctly',
    'Detect when a click lands inside a shape',
    'Build a click-the-target mini game with a score',
    'Understand how touch maps to the same code'
  ],
  blocks:[
    {type:'p',html:`Keyboards are great, but many games live on the mouse — aiming, clicking, dragging — and on phones, tapping. Today you'll read the pointer's position <i>accurately</i> on the canvas (there's a subtle gotcha here that trips everyone up once) and use it to build a small, complete clicking game.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-11</code>. This combines the loop (S8), arrays (S7) and decisions (S6).`},

    {type:'h',text:'1. The mouse position gotcha'},
    {type:'p',html:`A mouse event gives you <code class="inline">event.clientX</code> and <code class="inline">event.clientY</code> — but those are measured from the top-left of the whole <i>browser window</i>, not your canvas. If your canvas is anywhere except the very corner, those numbers are wrong for drawing. The fix is to subtract the canvas's own position on the page, which <code class="inline">getBoundingClientRect()</code> gives us:`},
    {type:'code',lang:'js',code:`function getMousePos(event) {
  const rect = canvas.getBoundingClientRect();   // canvas position on the page
  return {
    x: event.clientX - rect.left,   // convert to canvas coordinates
    y: event.clientY - rect.top
  };
}`},
    {type:'note',kind:'key',title:'Always convert with getBoundingClientRect',html:`Skipping this conversion is the single most common mouse bug — clicks register offset from where you actually clicked. Wrap it in a tidy <code class="inline">getMousePos</code> helper and reuse it everywhere.`},

    {type:'h',text:'2. Listening for movement and clicks'},
    {type:'p',html:`Two events cover most needs: <code class="inline">"mousemove"</code> (the pointer moved) and <code class="inline">"click"</code> (a full press-and-release):`},
    {type:'code',lang:'js',code:`canvas.addEventListener("mousemove", function (e) {
  const pos = getMousePos(e);
  // pos.x, pos.y now hold the pointer's canvas coordinates
});

canvas.addEventListener("click", function (e) {
  const pos = getMousePos(e);
  // handle a click at pos.x, pos.y
});`},

    {type:'h',text:'3. Did the click hit the target?'},
    {type:'p',html:`To know if a click landed on a circular target, measure the distance from the click to the circle's centre. If that distance is less than the radius, it's a hit. The distance formula (Pythagoras) is built from the x and y gaps:`},
    {type:'code',lang:'js',code:`const dx = pos.x - target.x;
const dy = pos.y - target.y;
const distance = Math.sqrt(dx * dx + dy * dy);

if (distance < target.r) {
  // HIT! it's inside the circle
}`},
    {type:'note',kind:'tip',title:'This is collision detection in disguise',html:`"Is the click inside the circle?" is exactly a point-vs-circle collision test. Next session we generalise this to objects hitting each other — you're already halfway there.`},

    {type:'h',text:'4. Mini game: Click the Target'},
    {type:'p',html:`A complete little game: click the moving target to score; each hit makes it jump to a new random spot. Press <b>Run</b>, then click the circle. Try lowering the radius to make it harder.`},
    {type:'run',label:'Click the green target to score points',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#0b0e24;border:3px solid #6c8cff;border-radius:12px;cursor:crosshair}
</style></head>
<body>
  <canvas id="game" width="380" height="260"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;

    let score = 0;
    let target = { x: 190, y: 130, r: 26 };

    function moveTarget() {
      target.x = target.r + Math.random() * (W - target.r * 2);
      target.y = target.r + Math.random() * (H - target.r * 2);
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener("click", function (e) {
      const pos = getMousePos(e);
      const dx = pos.x - target.x;
      const dy = pos.y - target.y;
      if (Math.sqrt(dx * dx + dy * dy) < target.r) {   // hit?
        score++;
        moveTarget();
      }
    });

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // target
      ctx.fillStyle = "#34d399";
      ctx.beginPath();
      ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);
      ctx.fill();
      // score
      ctx.fillStyle = "#e9ecff";
      ctx.font = "18px system-ui";
      ctx.fillText("Score: " + score, 12, 26);
    }

    function loop() { draw(); requestAnimationFrame(loop); }
    loop();
  <\/script>
</body>
</html>`},

    {type:'h',text:'5. What about touch screens?'},
    {type:'p',html:`Phones and tablets fire <b>touch</b> events instead of mouse events. The good news: they carry the same kind of coordinates. A touch's position is at <code class="inline">event.touches[0].clientX/Y</code>, and you convert it with the very same <code class="inline">getBoundingClientRect</code> trick. Modern code often uses <b>pointer events</b> (<code class="inline">"pointerdown"</code>) which work for mouse, touch and pen with one set of handlers — a great habit once you're comfortable.`},

    {type:'exercise',title:'Improve the game',html:`<ol>
      <li>Shrink <code class="inline">target.r</code> to 14 for a harder game; grow it for an easier one.</li>
      <li>Add a 15-second countdown using a timer, and show "Time's up!" when it ends.</li>
      <li>Make the target slowly drift each frame (give it <code class="inline">vx</code>/<code class="inline">vy</code> like Session 9) so you must click a <i>moving</i> circle.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 11 recap',html:`Convert pointer coordinates with <code class="inline">getBoundingClientRect()</code> — always. Detect a hit on a circle with the <b>distance</b> formula vs its radius. Touch and pointer events reuse the same approach. Next: full <b>collision detection</b> between moving objects.`}
  ]
},
{
  id:12, week:6, duration:'≈ 60 minutes',
  title:'Collision Detection Basics',
  objectives:[
    'Detect when two rectangles overlap (AABB)',
    'Detect circle-to-circle collisions with distance',
    'Respond to a collision (score, bounce, stop)',
    'Build a basket game that catches falling objects'
  ],
  blocks:[
    {type:'p',html:`Collisions are the <i>rules</i> of physical games: did the ball hit the paddle? did the player touch the coin? did the bullet reach the enemy? This session teaches the two collision formulas you'll reuse in every game forever. With movement, input and collisions, you'll have every ingredient for a real game — which is exactly what we build next.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-12</code>. The point-in-circle test from Session 11 was a warm-up; now we handle objects with size.`},

    {type:'h',text:'1. Rectangle overlap (AABB)'},
    {type:'p',html:`Most game objects can be treated as rectangles for collision purposes — even if they're drawn as something fancier. This is called an <b>AABB</b> (Axis-Aligned Bounding Box). Two rectangles overlap only if they overlap on <b>both</b> the x-axis and the y-axis. The test is four comparisons joined with AND:`},
    {type:'code',lang:'js',code:`function rectsOverlap(a, b) {
  return a.x < b.x + b.w &&   // a's left is before b's right
         a.x + a.w > b.x &&   // a's right is past b's left
         a.y < b.y + b.h &&   // a's top is above b's bottom
         a.y + a.h > b.y;     // a's bottom is below b's top
}`},
    {type:'p',html:`Each rectangle here is an object with <code class="inline">x, y, w, h</code> (position and width/height). If all four conditions are true, the boxes are touching.`},
    {type:'note',kind:'key',title:'Why "both axes"',html:`Imagine two cards on a table. They only physically overlap if they share space left-to-right <i>and</i> top-to-bottom. If there's a clear gap on either axis, they miss. That's exactly what the four checks confirm.`},

    {type:'h',text:'2. Circle collisions'},
    {type:'p',html:`For round objects, rectangles feel wrong at the corners. Two circles collide when the <b>distance between their centres</b> is less than the sum of their radii — the same distance idea from last session:`},
    {type:'code',lang:'js',code:`function circlesOverlap(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance < a.r + b.r;
}`},
    {type:'note',kind:'tip',title:'Pick the simplest shape that works',html:`AABB rectangles are cheap and good enough for paddles, bricks, platforms and most players. Circles suit balls and round pickups. You rarely need anything more complex for 2D games — start simple.`},

    {type:'h',text:'3. Responding to a collision'},
    {type:'p',html:`Detecting a collision is only half the job — then you decide what <i>happens</i>. Common responses: add to the score, remove the object, bounce (flip a velocity, Session 9), reduce a life, or end the game. The pattern is always "if collision, then react":`},
    {type:'code',lang:'js',code:`if (rectsOverlap(player, coin)) {
  score += 10;          // react: score
  coin.collected = true; // and remove the coin
}`},

    {type:'h',text:'4. Full game: Catch the Falling Blocks'},
    {type:'p',html:`Everything comes together here: a basket you move with the arrow keys, blocks falling from the top (an array, Session 7), and AABB collision to catch them for points. Miss one and it just resets. Click the canvas, then use <kbd>←</kbd> <kbd>→</kbd>.`},
    {type:'run',label:'Click the canvas, then catch blocks with ← →',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;flex-direction:column;align-items:center;padding:12px;
       font-family:system-ui;color:#a3aad6}
  canvas{background:#0b0e24;border:3px solid #6c8cff;border-radius:12px;outline:none}
  p{font-size:13px;margin:8px 0 0}
</style></head>
<body>
  <canvas id="game" width="380" height="280" tabindex="0"></canvas>
  <p>Click first, then move with the arrow keys.</p>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    canvas.focus();

    let score = 0, misses = 0;
    let basket = { x: 160, y: H - 26, w: 70, h: 16, speed: 6 };
    let block  = { x: 100, y: -20, w: 22, h: 22, vy: 3 };

    const keys = {};
    canvas.addEventListener("keydown", e => { keys[e.key] = true; e.preventDefault(); });
    canvas.addEventListener("keyup",   e => { keys[e.key] = false; });

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }
    function dropNewBlock() {
      block.x = Math.random() * (W - block.w);
      block.y = -20;
    }

    function update() {
      if (keys["ArrowLeft"])  basket.x -= basket.speed;
      if (keys["ArrowRight"]) basket.x += basket.speed;
      basket.x = Math.max(0, Math.min(W - basket.w, basket.x));

      block.y += block.vy;                 // fall

      if (rectsOverlap(basket, block)) {   // caught!
        score++;
        dropNewBlock();
      } else if (block.y > H) {            // missed
        misses++;
        dropNewBlock();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#fbbf24";
      ctx.fillRect(block.x, block.y, block.w, block.h);
      ctx.fillStyle = "#34d399";
      ctx.fillRect(basket.x, basket.y, basket.w, basket.h);
      ctx.fillStyle = "#e9ecff";
      ctx.font = "16px system-ui";
      ctx.fillText("Caught: " + score + "   Missed: " + misses, 12, 24);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'note',kind:'tip',title:'Debugging collisions',html:`When a collision "doesn't work", draw the boxes you're testing (a thin outline with <code class="inline">ctx.strokeRect</code>) so you can <i>see</i> the hitboxes. Nine times out of ten the visual instantly reveals a wrong width, height, or position.`},

    {type:'exercise',title:'Build on it',html:`<ol>
      <li>Speed the block up a little every time you catch one (increase <code class="inline">block.vy</code>).</li>
      <li>End the game after 5 misses: stop updating and draw "Game Over".</li>
      <li>Add a second falling block (use an array of blocks and a loop to update and test each).</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 12 recap & a milestone',html:`<b>AABB</b> = four comparisons for rectangle overlap. <b>Circle</b> collisions compare centre distance to summed radii. Then you <i>react</i>: score, remove, bounce or end. You now have movement, input <i>and</i> collisions — everything a game needs. Next session we build our first complete one: <b>Pong</b>!`}
  ]
},
{
  id:13, week:7, duration:'≈ 60 minutes',
  title:'Project: Pong — Part 1',
  objectives:[
    'Plan a complete game before coding it',
    'Create paddle and ball objects with position and size',
    'Move the player paddle with the keyboard',
    'Get the ball moving and bouncing off top and bottom walls'
  ],
  blocks:[
    {type:'p',html:`This is the moment everything has been building toward — your first <b>complete game</b>. <b>Pong</b> (two paddles, a bouncing ball) is the perfect first project: it uses the loop, objects, motion, input and collisions all together, yet stays small enough to fully understand. Part 1 today gets everything on screen and moving; Part 2 adds the opponent and scoring.`},
    {type:'note',kind:'info',title:'Real-world example',html:`You're recreating <b>Pong</b> (Atari, 1972), designed by Allan Alcorn. It was one of the first commercially successful video games and is widely credited with kicking off the arcade industry — a simple idea (bat, ball, wall) that proved games could be a real business.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-13</code> and start from your reusable game shell (Session 3). Keep this file — we extend it next session.`},

    {type:'h',text:'1. Plan before you code'},
    {type:'p',html:`Professionals sketch the plan first. Pong needs:`},
    {type:'list',items:[
      `A <b>left paddle</b> — the player, moved by the keyboard.`,
      `A <b>right paddle</b> — the opponent (a simple AI in Part 2).`,
      `A <b>ball</b> that moves and bounces.`,
      `Rules: ball bounces off top/bottom and paddles; a point is scored when it passes a paddle.`
    ]},
    {type:'p',html:`We'll represent each thing as an <b>object</b> with the data it needs. Planning the data first makes the code almost write itself.`},

    {type:'h',text:'2. The objects'},
    {type:'p',html:`Each paddle is a tall rectangle; the ball is a small square (simpler than a circle for collisions, and looks retro):`},
    {type:'code',lang:'js',code:`const W = 480, H = 300;

const player = { x: 16,      y: H/2 - 35, w: 12, h: 70, speed: 6 };
const ball   = { x: W/2, y: H/2, size: 12, vx: 4, vy: 3 };`},
    {type:'note',kind:'tip',title:'Use the canvas size, not magic numbers',html:`Writing <code class="inline">H/2 - 35</code> instead of a fixed <code class="inline">115</code> means your game still looks right if you change the canvas size. Build positions <i>relative</i> to <code class="inline">W</code> and <code class="inline">H</code> whenever you can.`},

    {type:'h',text:'3. Move the player paddle'},
    {type:'p',html:`Reuse the keyboard pattern from Session 10. The player paddle moves up and down and is clamped inside the play area:`},
    {type:'code',lang:'js',code:`if (keys["ArrowUp"])   player.y -= player.speed;
if (keys["ArrowDown"]) player.y += player.speed;
player.y = Math.max(0, Math.min(H - player.h, player.y));`},

    {type:'h',text:'4. Move and bounce the ball'},
    {type:'p',html:`Straight from Session 9: add velocity to position, and flip <code class="inline">vy</code> when the ball reaches the top or bottom. (We'll handle paddle bounces and scoring in Part 2.)`},
    {type:'code',lang:'js',code:`ball.x += ball.vx;
ball.y += ball.vy;

// bounce off top and bottom walls
if (ball.y < 0 || ball.y + ball.size > H) {
  ball.vy = -ball.vy;
}`},

    {type:'h',text:'5. Pong — Part 1, fully assembled'},
    {type:'p',html:`Here is everything so far in one runnable game. Both paddles are drawn (the right one is static for now), and the ball bounces off the top and bottom. Click the canvas, then use <kbd>↑</kbd> <kbd>↓</kbd>. The ball will fly off the sides for now — that's what Part 2 fixes.`},
    {type:'run',label:'Pong Part 1 — click, then move your paddle with ↑ ↓',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;flex-direction:column;align-items:center;padding:12px;
       font-family:system-ui;color:#a3aad6}
  canvas{background:#06081a;border:3px solid #6c8cff;border-radius:10px;outline:none}
  p{font-size:13px;margin:8px 0 0}
</style></head>
<body>
  <canvas id="game" width="480" height="300" tabindex="0"></canvas>
  <p>Click the board, then use the Up/Down arrow keys.</p>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    canvas.focus();

    const player   = { x: 16,     y: H/2 - 35, w: 12, h: 70, speed: 6 };
    const opponent = { x: W - 28, y: H/2 - 35, w: 12, h: 70 };
    const ball     = { x: W/2, y: H/2, size: 12, vx: 4, vy: 3 };

    const keys = {};
    canvas.addEventListener("keydown", e => { keys[e.key] = true; e.preventDefault(); });
    canvas.addEventListener("keyup",   e => { keys[e.key] = false; });

    function update() {
      if (keys["ArrowUp"])   player.y -= player.speed;
      if (keys["ArrowDown"]) player.y += player.speed;
      player.y = Math.max(0, Math.min(H - player.h, player.y));

      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.y < 0 || ball.y + ball.size > H) ball.vy = -ball.vy;

      // temporary: bounce off the sides so it stays on screen this session
      if (ball.x < 0 || ball.x + ball.size > W) ball.vx = -ball.vx;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // centre dashed line
      ctx.fillStyle = "#23306a";
      for (let y = 8; y < H; y += 28) ctx.fillRect(W/2 - 2, y, 4, 16);
      // paddles + ball
      ctx.fillStyle = "#34d399";
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = "#fb7185";
      ctx.fillRect(opponent.x, opponent.y, opponent.w, opponent.h);
      ctx.fillStyle = "#fff";
      ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'note',kind:'info',title:'About the temporary side-bounce',html:`So the ball doesn't vanish today, we let it bounce off the left/right walls too. In Part 2 we remove that and instead make those edges <i>score a point</i> and reset the ball — the real Pong rule.`},

    {type:'exercise',title:'Get ready for Part 2',html:`<ol>
      <li>Make your paddle taller or shorter by changing <code class="inline">player.h</code>. How does it change the feel?</li>
      <li>Speed the ball up by raising <code class="inline">vx</code> and <code class="inline">vy</code>.</li>
      <li>Try making the opponent paddle slowly follow the ball: <code class="inline">opponent.y += (ball.y - opponent.y) * 0.05;</code> inside <code class="inline">update()</code>. (A taste of Part 2's AI.)</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 13 recap',html:`You planned a game, modelled it with <b>objects</b>, controlled a paddle with the <b>keyboard</b>, and made the ball <b>move and bounce</b> — all inside one clean loop. Next session: a computer opponent, paddle collisions, scoring, and a win condition to finish Pong.`}
  ]
},
{
  id:14, week:7, duration:'≈ 60 minutes',
  title:'Project: Pong — Part 2',
  objectives:[
    'Bounce the ball off paddles with collision detection',
    'Add a simple computer opponent (AI)',
    'Score points and reset the ball after each point',
    'Add a win condition to complete the game'
  ],
  blocks:[
    {type:'p',html:`Today Pong becomes a real, winnable game. We'll add paddle collisions, an opponent that plays against you, scoring, and a "first to 5 wins" finish. Everything connects what you learned in Sessions 9–12 — by the end you'll have built a complete game entirely by hand.`},
    {type:'note',kind:'info',html:`Continue from your Session 13 file in <code class="inline">session-14</code> (or just build on the demo below).`},

    {type:'h',text:'1. Bouncing off the paddles'},
    {type:'p',html:`A paddle is a rectangle and the ball is a small rectangle — so this is the <b>AABB</b> test from Session 12. When the ball overlaps a paddle, we reverse <code class="inline">vx</code> to send it back. We also nudge it just outside the paddle so it can't get "stuck" inside and jitter:`},
    {type:'code',lang:'js',code:`function hitsPaddle(b, p) {
  return b.x < p.x + p.w && b.x + b.size > p.x &&
         b.y < p.y + p.h && b.y + b.size > p.y;
}

if (hitsPaddle(ball, player)) {
  ball.vx = Math.abs(ball.vx);   // force it to move right (away from left paddle)
  ball.x = player.x + player.w;  // nudge it clear of the paddle
}`},
    {type:'note',kind:'tip',title:'Add angle for skill',html:`To make Pong feel good, change the ball's vertical speed based on <i>where</i> it hit the paddle. Hitting near the top sends it upward, near the bottom sends it downward. We do this in the demo — it rewards aiming and makes rallies interesting.`},

    {type:'h',text:'2. A simple opponent (AI)'},
    {type:'p',html:`The opponent doesn't need to be clever. It just eases its paddle toward the ball's height each frame. Multiplying the gap by a small factor gives smooth, beatable movement:`},
    {type:'code',lang:'js',code:`// move a fraction of the way toward the ball each frame
const target = ball.y - opponent.h / 2;
opponent.y += (target - opponent.y) * 0.08;`},
    {type:'note',kind:'key',title:'Tuning difficulty',html:`The factor <code class="inline">0.08</code> is the difficulty dial. Higher (e.g. 0.15) makes a sharper, harder opponent; lower makes it sluggish and easy. Small numbers like this are how you balance a game's challenge.`},

    {type:'h',text:'3. Scoring and resetting'},
    {type:'p',html:`When the ball passes a paddle and leaves the left or right edge, the other side scores. Then we re-centre the ball and send it toward the player who was just scored on:`},
    {type:'code',lang:'js',code:`function resetBall(direction) {
  ball.x = W / 2; ball.y = H / 2;
  ball.vx = 4 * direction;                 // direction is +1 or -1
  ball.vy = (Math.random() * 4) - 2;       // a little random vertical
}

if (ball.x < 0)        { opponentScore++; resetBall(1);  }
if (ball.x > W)        { playerScore++;   resetBall(-1); }`},

    {type:'h',text:'4. The complete game'},
    {type:'p',html:`Here is finished Pong: opponent AI, paddle bounces with angle, scoring, and "first to 5 wins" with a restart. Click the canvas and play with <kbd>↑</kbd> <kbd>↓</kbd>. This is a real game you built from scratch.`},
    {type:'run',label:'Full Pong — click, play with ↑ ↓, first to 5 wins',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;flex-direction:column;align-items:center;padding:12px;
       font-family:system-ui;color:#a3aad6}
  canvas{background:#06081a;border:3px solid #6c8cff;border-radius:10px;outline:none}
  p{font-size:13px;margin:8px 0 0}
</style></head>
<body>
  <canvas id="game" width="480" height="300" tabindex="0"></canvas>
  <p>Click the board, then play with Up/Down. Press R to restart after a win.</p>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    canvas.focus();

    const WIN = 5;
    let playerScore, opponentScore, over;
    const player   = { x: 16,     y: H/2-35, w: 12, h: 70, speed: 6 };
    const opponent = { x: W - 28, y: H/2-35, w: 12, h: 70 };
    const ball     = { x: W/2, y: H/2, size: 12, vx: 4, vy: 3 };

    function resetBall(dir) {
      ball.x = W/2; ball.y = H/2;
      ball.vx = 4 * dir; ball.vy = (Math.random()*4) - 2;
    }
    function newGame() {
      playerScore = 0; opponentScore = 0; over = false;
      resetBall(Math.random() < 0.5 ? 1 : -1);
    }
    newGame();

    const keys = {};
    canvas.addEventListener("keydown", e => {
      keys[e.key] = true; e.preventDefault();
      if (over && (e.key === "r" || e.key === "R")) newGame();
    });
    canvas.addEventListener("keyup", e => { keys[e.key] = false; });

    function hits(b, p) {
      return b.x < p.x + p.w && b.x + b.size > p.x &&
             b.y < p.y + p.h && b.y + b.size > p.y;
    }

    function update() {
      if (over) return;
      // player
      if (keys["ArrowUp"])   player.y -= player.speed;
      if (keys["ArrowDown"]) player.y += player.speed;
      player.y = Math.max(0, Math.min(H - player.h, player.y));
      // opponent AI
      const target = ball.y - opponent.h/2;
      opponent.y += (target - opponent.y) * 0.08;
      opponent.y = Math.max(0, Math.min(H - opponent.h, opponent.y));
      // ball
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.y < 0 || ball.y + ball.size > H) ball.vy = -ball.vy;
      // paddle bounces, with angle based on hit position
      if (hits(ball, player)) {
        ball.vx = Math.abs(ball.vx);
        ball.x = player.x + player.w;
        ball.vy += ((ball.y - (player.y + player.h/2)) / player.h) * 5;
      }
      if (hits(ball, opponent)) {
        ball.vx = -Math.abs(ball.vx);
        ball.x = opponent.x - ball.size;
        ball.vy += ((ball.y - (opponent.y + opponent.h/2)) / opponent.h) * 5;
      }
      // scoring
      if (ball.x < 0)  { opponentScore++; resetBall(1);  }
      if (ball.x > W)  { playerScore++;   resetBall(-1); }
      if (playerScore >= WIN || opponentScore >= WIN) over = true;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#23306a";
      for (let y = 8; y < H; y += 28) ctx.fillRect(W/2-2, y, 4, 16);
      ctx.fillStyle = "#34d399"; ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = "#fb7185"; ctx.fillRect(opponent.x, opponent.y, opponent.w, opponent.h);
      ctx.fillStyle = "#fff"; ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
      // scores
      ctx.font = "30px system-ui";
      ctx.fillText(playerScore, W/2 - 60, 40);
      ctx.fillText(opponentScore, W/2 + 44, 40);
      if (over) {
        ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, H/2-40, W, 80);
        ctx.fillStyle = "#fff"; ctx.font = "24px system-ui"; ctx.textAlign = "center";
        const youWon = playerScore > opponentScore;
        ctx.fillText((youWon ? "You win! 🎉" : "Opponent wins") + "  —  press R", W/2, H/2+8);
        ctx.textAlign = "left";
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},

    {type:'exercise',title:'Make Pong your own',html:`<ol>
      <li>Change <code class="inline">WIN</code> to 3 or 10. Adjust the opponent's <code class="inline">0.08</code> to make it easier or harder.</li>
      <li>Speed the ball up slightly on every paddle hit (multiply <code class="inline">ball.vx</code> by <code class="inline">1.03</code>) so rallies get tense.</li>
      <li>Add a "Get Ready" pause for one second after each point before the ball moves.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 14 recap — your first finished game 🏆',html:`You added paddle <b>collisions</b>, a simple <b>AI</b>, <b>scoring</b> with ball reset, and a <b>win condition</b> with restart. That's a complete, playable game built entirely by you. Take a moment — this is a real milestone. Next: a different style of game with <b>Snake</b>, which introduces grid-based movement.`}
  ]
},
{
  id:15, week:8, duration:'≈ 60 minutes',
  title:'Project: Snake — Part 1',
  objectives:[
    'Understand grid-based movement',
    'Represent the snake as an array of segments',
    'Move the snake on a timed step instead of every frame',
    'Turn with the keyboard without reversing into itself'
  ],
  blocks:[
    {type:'p',html:`<b>Snake</b> is a wonderful second project because it works completely differently from Pong. Instead of smooth pixel motion, the world is a <b>grid</b> of cells and the snake hops one cell at a time. The snake itself is just an <b>array</b> of segments — the perfect use of everything you learned in Session 7. Part 1 builds a moving, steerable snake.`},
    {type:'note',kind:'info',title:'Real-world example',html:`Grid-chasing games like this go back to <i>Blockade</i> (Gremlin Industries, 1976), but the version almost everyone has actually played is <b>Snake on Nokia phones</b> (1997) — pre-installed on millions of handsets, it became one of the most-played games in history without anyone needing to buy or download it.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-15</code>. Keep the file — Part 2 adds food, growth and game-over.`},

    {type:'h',text:'1. Thinking in a grid'},
    {type:'p',html:`We divide the canvas into equal squares — say 20×20 pixels each. Instead of tracking pixel positions, we track <b>cell positions</b>: column 3, row 5, and so on. To draw a cell, multiply its grid position by the cell size:`},
    {type:'code',lang:'js',code:`const CELL = 20;          // each cell is 20x20 pixels
const COLS = 18, ROWS = 14;  // grid is 18 cells wide, 14 tall

// a cell at column c, row r is drawn at:
const pixelX = c * CELL;
const pixelY = r * CELL;`},
    {type:'note',kind:'key',title:'Grid coordinates vs pixel coordinates',html:`In a grid game you think in <i>cells</i> (small whole numbers) and only convert to pixels when drawing. This makes movement and collisions far simpler — everything snaps to a tidy grid.`},

    {type:'h',text:'2. The snake is an array'},
    {type:'p',html:`The snake is a list of <code class="inline">{x, y}</code> cells. The <b>first</b> item is the head; the rest is the body trailing behind:`},
    {type:'code',lang:'js',code:`let snake = [
  { x: 8, y: 7 },   // head
  { x: 7, y: 7 },
  { x: 6, y: 7 }    // tail
];
let dir = { x: 1, y: 0 };   // currently moving right (one cell per step)`},

    {type:'h',text:'3. Moving by adding a new head'},
    {type:'p',html:`The elegant trick that makes Snake click: to move, add a <b>new head</b> in the direction of travel, and remove the <b>tail</b>. The snake appears to slither forward one cell:`},
    {type:'code',lang:'js',code:`function step() {
  const head = snake[0];
  const newHead = { x: head.x + dir.x, y: head.y + dir.y };
  snake.unshift(newHead);  // add new head to the FRONT
  snake.pop();             // remove the tail from the END
}`},
    {type:'list',items:[
      `<code class="inline">unshift</code> adds to the front of an array; <code class="inline">pop</code> removes from the end.`,
      `In Part 2, when the snake eats, we simply <i>skip</i> the <code class="inline">pop()</code> — so it keeps the extra segment and grows. Beautifully simple.`
    ]},

    {type:'h',text:'4. Stepping on a timer, not every frame'},
    {type:'p',html:`At 60 FPS the snake would blur across the screen instantly. We want it to move a few times per second so it's playable. We keep the <code class="inline">requestAnimationFrame</code> loop for drawing, but only <code class="inline">step()</code> the snake every so often using a time check:`},
    {type:'code',lang:'js',code:`let lastStep = 0;
const STEP_MS = 130;   // move every 130 milliseconds

function loop(now) {
  if (now - lastStep > STEP_MS) {
    step();
    lastStep = now;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);`},
    {type:'note',kind:'tip',title:'The loop gets a timestamp',html:`<code class="inline">requestAnimationFrame</code> hands your loop function the current time automatically (the <code class="inline">now</code> parameter). Comparing it to <code class="inline">lastStep</code> lets us act on a schedule. Smaller <code class="inline">STEP_MS</code> = faster snake.`},

    {type:'h',text:'5. Turning (without reversing into yourself)'},
    {type:'p',html:`Arrow keys change <code class="inline">dir</code>. But a snake mustn't instantly reverse — that would run it straight into its own neck. So we reject a direction that's the exact opposite of the current one (a Session 6 decision):`},
    {type:'code',lang:'js',code:`if (e.key === "ArrowUp"    && dir.y !== 1)  dir = { x: 0, y: -1 };
if (e.key === "ArrowDown"  && dir.y !== -1) dir = { x: 0, y: 1 };
if (e.key === "ArrowLeft"  && dir.x !== 1)  dir = { x: -1, y: 0 };
if (e.key === "ArrowRight" && dir.x !== -1) dir = { x: 1, y: 0 };`},

    {type:'h',text:'6. Snake — Part 1, assembled'},
    {type:'p',html:`A steerable snake gliding around the grid. Click the canvas, then steer with the arrows. It wraps around the edges for now; Part 2 makes walls deadly and adds food. Watch how the body follows the head naturally.`},
    {type:'run',label:'Snake Part 1 — click, then steer with the arrow keys',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;flex-direction:column;align-items:center;padding:12px;
       font-family:system-ui;color:#a3aad6}
  canvas{background:#06081a;border:3px solid #6c8cff;border-radius:10px;outline:none}
  p{font-size:13px;margin:8px 0 0}
</style></head>
<body>
  <canvas id="game" width="360" height="280" tabindex="0"></canvas>
  <p>Click the board, then steer with the arrow keys.</p>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    canvas.focus();
    const CELL = 20;
    const COLS = canvas.width / CELL, ROWS = canvas.height / CELL;

    let snake = [{x:8,y:7},{x:7,y:7},{x:6,y:7}];
    let dir = { x: 1, y: 0 };

    canvas.addEventListener("keydown", e => {
      e.preventDefault();
      if (e.key === "ArrowUp"    && dir.y !== 1)  dir = {x:0,y:-1};
      if (e.key === "ArrowDown"  && dir.y !== -1) dir = {x:0,y:1};
      if (e.key === "ArrowLeft"  && dir.x !== 1)  dir = {x:-1,y:0};
      if (e.key === "ArrowRight" && dir.x !== -1) dir = {x:1,y:0};
    });

    function step() {
      const head = snake[0];
      let nx = head.x + dir.x, ny = head.y + dir.y;
      // wrap around edges (Part 2 makes these deadly)
      if (nx < 0) nx = COLS - 1; if (nx >= COLS) nx = 0;
      if (ny < 0) ny = ROWS - 1; if (ny >= ROWS) ny = 0;
      snake.unshift({ x: nx, y: ny });
      snake.pop();
    }

    function draw() {
      ctx.fillStyle = "#06081a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#34d399";
      for (let i = 0; i < snake.length; i++) {
        ctx.fillRect(snake[i].x*CELL+1, snake[i].y*CELL+1, CELL-2, CELL-2);
      }
    }

    let lastStep = 0;
    const STEP_MS = 130;
    function loop(now) {
      if (now - lastStep > STEP_MS) { step(); lastStep = now; }
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'exercise',title:'Prepare for Part 2',html:`<ol>
      <li>Change <code class="inline">STEP_MS</code> to 80 (fast) and 250 (slow). Find a speed you like.</li>
      <li>Make the snake start longer by adding more segments to the initial array.</li>
      <li>Colour the head differently from the body (draw <code class="inline">snake[0]</code> in a separate colour after the loop).</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 15 recap',html:`Grid games think in <b>cells</b>, converting to pixels only when drawing. The snake is an <b>array</b>; it moves by <code class="inline">unshift</code>-ing a new head and <code class="inline">pop</code>-ing the tail, on a <b>timer</b>. Turning rejects instant reversals. Next: food, growth, collisions and game over to finish Snake.`}
  ]
},
{
  id:16, week:8, duration:'≈ 60 minutes',
  title:'Project: Snake — Part 2',
  objectives:[
    'Spawn food at random grid cells',
    'Grow the snake when it eats',
    'Detect collisions with walls and the snake\'s own body',
    'Add score, game over and restart'
  ],
  blocks:[
    {type:'p',html:`Let's turn the slithering snake into a real game with a goal and a way to lose. We'll add food to chase, growth when it's eaten, deadly walls and self-collision, plus a score and game-over with restart. This completes your second full game.`},
    {type:'note',kind:'info',html:`Continue from Session 15 in <code class="inline">session-16</code>, or build on the finished demo below.`},

    {type:'h',text:'1. Food on a random cell'},
    {type:'p',html:`Food lives on one grid cell. When eaten, it jumps to a new random cell. (Ideally not on the snake — we'll keep it simple and re-roll if it lands on the body.)`},
    {type:'code',lang:'js',code:`let food = { x: 5, y: 5 };

function placeFood() {
  food.x = Math.floor(Math.random() * COLS);
  food.y = Math.floor(Math.random() * ROWS);
}`},
    {type:'note',kind:'tip',title:'Math.floor for whole cells',html:`<code class="inline">Math.random() * COLS</code> gives a decimal like 7.34. <code class="inline">Math.floor</code> chops off the decimal to a whole column number — exactly what a grid needs.`},

    {type:'h',text:'2. Eating and growing'},
    {type:'p',html:`Remember the move trick from Part 1 — add a head, remove the tail. To <b>grow</b>, we just don't remove the tail on the step where the head lands on the food:`},
    {type:'code',lang:'js',code:`const head = snake[0];
const ate = (head.x === food.x && head.y === food.y);

if (ate) {
  score++;
  placeFood();     // new food
  // note: we DON'T pop() this step, so the snake keeps the extra segment
} else {
  snake.pop();     // normal move: drop the tail
}`},

    {type:'h',text:'3. Losing: walls and yourself'},
    {type:'p',html:`Now the walls are deadly (no more wrapping), and running into your own body ends the game. Both are simple checks on the new head position:`},
    {type:'code',lang:'js',code:`// hit a wall?
if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
  gameOver = true;
}
// hit your own body? check the head against every other segment
for (let i = 1; i < snake.length; i++) {
  if (snake[i].x === head.x && snake[i].y === head.y) gameOver = true;
}`},

    {type:'h',text:'4. The complete Snake game'},
    {type:'p',html:`Food, growth, deadly walls, self-collision, score and restart — a finished game. Click the canvas, steer with the arrows, eat the gold food, and don't crash. Press <kbd>R</kbd> to restart after game over.`},
    {type:'run',label:'Full Snake — click, steer with arrows, eat the gold, avoid crashing',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;flex-direction:column;align-items:center;padding:12px;
       font-family:system-ui;color:#a3aad6}
  canvas{background:#06081a;border:3px solid #6c8cff;border-radius:10px;outline:none}
  p{font-size:13px;margin:8px 0 0}
</style></head>
<body>
  <canvas id="game" width="360" height="280" tabindex="0"></canvas>
  <p>Click, steer with arrows, eat gold. Press R to restart.</p>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    canvas.focus();
    const CELL = 20;
    const COLS = canvas.width / CELL, ROWS = canvas.height / CELL;

    let snake, dir, nextDir, food, score, gameOver, stepMs;

    function reset() {
      snake = [{x:8,y:7},{x:7,y:7},{x:6,y:7}];
      dir = {x:1,y:0}; nextDir = {x:1,y:0};
      score = 0; gameOver = false; stepMs = 130;
      placeFood();
    }
    function placeFood() {
      food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
    }

    canvas.addEventListener("keydown", e => {
      e.preventDefault();
      if (e.key === "ArrowUp"    && dir.y !== 1)  nextDir = {x:0,y:-1};
      if (e.key === "ArrowDown"  && dir.y !== -1) nextDir = {x:0,y:1};
      if (e.key === "ArrowLeft"  && dir.x !== 1)  nextDir = {x:-1,y:0};
      if (e.key === "ArrowRight" && dir.x !== -1) nextDir = {x:1,y:0};
      if (gameOver && (e.key === "r" || e.key === "R")) reset();
    });

    function step() {
      if (gameOver) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // walls are deadly
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { gameOver = true; return; }
      // self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) { gameOver = true; return; }
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++; placeFood();
        if (stepMs > 70) stepMs -= 4;   // speed up a little — harder!
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = "#06081a"; ctx.fillRect(0,0,canvas.width,canvas.height);
      // food
      ctx.fillStyle = "#fbbf24";
      ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);
      // snake
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#9be8a0" : "#34d399";
        ctx.fillRect(snake[i].x*CELL+1, snake[i].y*CELL+1, CELL-2, CELL-2);
      }
      // score
      ctx.fillStyle = "#e9ecff"; ctx.font = "16px system-ui";
      ctx.fillText("Score: " + score, 10, canvas.height - 8);
      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, canvas.height/2-34, canvas.width, 68);
        ctx.fillStyle = "#fff"; ctx.font = "22px system-ui"; ctx.textAlign = "center";
        ctx.fillText("Game Over — press R", canvas.width/2, canvas.height/2+6);
        ctx.textAlign = "left";
      }
    }

    let last = 0;
    function loop(now) {
      if (now - last > stepMs) { step(); last = now; }
      draw();
      requestAnimationFrame(loop);
    }
    reset();
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'note',kind:'tip',title:'Notice the clean reset()',html:`All the game's variables are set up in one <code class="inline">reset()</code> function, so starting a new game is a single call. This is a preview of the "game state" organisation you'll formalise in Session 17.`},

    {type:'exercise',title:'Finish strong',html:`<ol>
      <li>Show a "New high score!" message when the score beats the best so far this session.</li>
      <li>Add a second food that's worth 3 points but appears only occasionally.</li>
      <li>Make eating flash the screen briefly for satisfying feedback.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 16 recap — Month 2 complete 🎉',html:`Snake is done: random <b>food</b>, growth by skipping the tail <code class="inline">pop()</code>, deadly <b>walls</b> and <b>self-collision</b>, plus score and restart. You've now built <b>two complete games</b> and understand the full anatomy of a game. Month 3 makes your code more professional and tackles bigger projects — starting with objects and game state.`}
  ]
},
{
  id:17, week:9, duration:'≈ 60 minutes',
  title:'Organising Code with Objects & Game State',
  objectives:[
    'Group related data using JavaScript objects',
    'Model game things as objects with properties',
    'Track the overall game with a single state variable',
    'Switch cleanly between menu, playing and game-over screens'
  ],
  blocks:[
    {type:'p',html:`Welcome to Month 3. Your games work — but as they grow, a pile of loose variables (<code class="inline">ballX</code>, <code class="inline">ballY</code>, <code class="inline">ballVX</code>…) becomes hard to manage. Today is about <b>writing code like a professional</b>: bundling related data into <b>objects</b>, and steering the whole game with a single <b>state</b> value. These two habits make the bigger Breakout and platformer projects ahead far easier.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-17</code>. This is a "code quality" session — the same games, organised better.`},

    {type:'h',text:'1. Objects bundle related data'},
    {type:'p',html:`You've used objects already (<code class="inline">ball.x</code>, <code class="inline">player.speed</code>). Let's understand them properly. An <b>object</b> groups related values under one name, each as a <code class="inline">key: value</code> pair:`},
    {type:'code',lang:'js',code:`const ball = {
  x: 100,
  y: 80,
  vx: 4,
  vy: 3,
  radius: 10
};

console.log(ball.x);      // read a property: 100
ball.x = ball.x + ball.vx; // update a property`},
    {type:'p',html:`Instead of five separate variables, you have one tidy <code class="inline">ball</code>. Pass it to a function and everything travels together. This is how every object in your games should be modelled.`},
    {type:'note',kind:'key',title:'Dot notation',html:`Reach inside an object with a dot: <code class="inline">object.key</code>. You can read (<code class="inline">ball.vx</code>) and write (<code class="inline">ball.vx = -ball.vx</code>) the same way.`},

    {type:'h',text:'2. Functions that work on objects'},
    {type:'p',html:`Pass an object into a function and that function can update it. This keeps logic neatly separated by object:`},
    {type:'code',lang:'js',code:`function moveBall(b) {
  b.x += b.vx;
  b.y += b.vy;
}
function drawBall(b) {
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
  ctx.fill();
}

moveBall(ball);
drawBall(ball);`},

    {type:'h',text:'3. Game state: one variable to rule the screens'},
    {type:'p',html:`Most games aren't always "playing" — there's a title screen, the game itself, a pause, a game-over screen. Track which one you're in with a single <b>state</b> string:`},
    {type:'code',lang:'js',code:`let state = "menu";   // "menu" | "playing" | "over"

function update() {
  if (state === "playing") {
    // ...move things, check rules...
  }
}

function draw() {
  if (state === "menu")    drawMenu();
  if (state === "playing") drawGame();
  if (state === "over")    drawGameOver();
}`},
    {type:'note',kind:'key',title:'This is a "state machine"',html:`A single variable that decides how the game behaves and what it draws is called a <b>state machine</b>. It's the standard way to organise screens and modes — and it scales beautifully as your game grows.`},

    {type:'h',text:'4. Full demo: a game with three screens'},
    {type:'p',html:`A complete little game showing the pattern: a <b>menu</b> (press Space to start), <b>playing</b> (click the moving target for points; runs 8 seconds), and <b>game over</b> (press Space to return). Watch how <code class="inline">state</code> controls everything. Click the canvas first.`},
    {type:'run',label:'Three-screen game — click canvas, press Space to start',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#06081a;border:3px solid #6c8cff;border-radius:10px;outline:none;cursor:crosshair}
</style></head>
<body>
  <canvas id="game" width="400" height="280" tabindex="0"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    canvas.focus();

    let state = "menu";
    let score = 0, timeLeft = 0;
    const target = { x: 200, y: 140, r: 24 };

    function startGame() { state = "playing"; score = 0; timeLeft = 8; moveTarget(); }
    function moveTarget() {
      target.x = target.r + Math.random()*(W - target.r*2);
      target.y = target.r + Math.random()*(H - target.r*2);
    }

    canvas.addEventListener("keydown", e => {
      if (e.key === " ") {
        e.preventDefault();
        if (state === "menu" || state === "over") startGame();
      }
    });
    canvas.addEventListener("click", e => {
      if (state !== "playing") return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const dx = mx - target.x, dy = my - target.y;
      if (Math.sqrt(dx*dx + dy*dy) < target.r) { score++; moveTarget(); }
    });

    // countdown timer for the playing state
    setInterval(() => {
      if (state === "playing") {
        timeLeft -= 0.1;
        if (timeLeft <= 0) state = "over";
      }
    }, 100);

    function draw() {
      ctx.fillStyle = "#06081a"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = "#e9ecff"; ctx.textAlign = "center";
      if (state === "menu") {
        ctx.font = "26px system-ui"; ctx.fillText("🎯 Target Rush", W/2, H/2 - 10);
        ctx.font = "15px system-ui"; ctx.fillStyle = "#a3aad6";
        ctx.fillText("Press SPACE to start", W/2, H/2 + 24);
      } else if (state === "playing") {
        ctx.fillStyle = "#34d399";
        ctx.beginPath(); ctx.arc(target.x, target.y, target.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#e9ecff"; ctx.textAlign = "left"; ctx.font = "16px system-ui";
        ctx.fillText("Score: " + score, 12, 24);
        ctx.fillText("Time: " + timeLeft.toFixed(1), W - 110, 24);
      } else {
        ctx.font = "24px system-ui"; ctx.fillText("Game Over", W/2, H/2 - 12);
        ctx.font = "16px system-ui"; ctx.fillText("You scored " + score, W/2, H/2 + 14);
        ctx.fillStyle = "#a3aad6"; ctx.font = "14px system-ui";
        ctx.fillText("Press SPACE to play again", W/2, H/2 + 42);
      }
      ctx.textAlign = "left";
      requestAnimationFrame(draw);
    }
    draw();
  <\/script>
</body>
</html>`},

    {type:'exercise',title:'Practise organising',html:`<ol>
      <li>Add a <code class="inline">"paused"</code> state toggled by the <kbd>P</kbd> key while playing.</li>
      <li>Go back to your Snake game and gather its variables into a single <code class="inline">game</code> object.</li>
      <li>Make an array of three target objects and loop to draw and test them all — your first array-of-objects.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 17 recap',html:`<b>Objects</b> bundle related data; reach in with a dot and pass them to functions. A single <b>state</b> variable (a state machine) controls which screen shows and how the game behaves. This organisation is what makes the upcoming Breakout project manageable. Next: replacing rectangles with real <b>images and sprites</b>.`}
  ]
},
{
  id:18, week:9, duration:'≈ 60 minutes',
  title:'Sprites & Images — Real Graphics',
  objectives:[
    'Load image files and wait for them to be ready',
    'Draw and scale images on the canvas with drawImage',
    'Understand sprite sheets and crop a single frame',
    'Replace plain rectangles with real artwork'
  ],
  blocks:[
    {type:'p',html:`Rectangles taught us the mechanics, but games come alive with <b>art</b>. Today you'll load image files and draw them on the canvas, then learn the trick behind animated characters: <b>sprite sheets</b>. This sets up the animated hero for our platformer.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-18</code>. Grab a small PNG (a character or an icon) and drop it in your folder to follow along on your own machine.`},

    {type:'h',text:'1. Loading an image (and waiting for it)'},
    {type:'p',html:`Images don't appear instantly — the browser has to fetch the file. So we create an <code class="inline">Image</code>, set its <code class="inline">src</code>, and use its <code class="inline">onload</code> event to know when it's ready to draw:`},
    {type:'code',lang:'js',code:`const playerImg = new Image();
playerImg.onload = function () {
  // the image is ready — safe to draw now
  ctx.drawImage(playerImg, 50, 50);
};
playerImg.src = "player.png";   // setting src starts the loading`},
    {type:'note',kind:'warn',title:'The #1 image mistake',html:`If you call <code class="inline">drawImage</code> <i>before</i> the image has loaded, nothing appears — the file isn't there yet. In a game loop this is usually fine (the image loads within a frame or two), but always set <code class="inline">src</code> and let the loop draw it once ready. For a single draw, do it inside <code class="inline">onload</code>.`},

    {type:'h',text:'2. drawImage — three useful forms'},
    {type:'p',html:`<code class="inline">drawImage</code> is flexible. The three versions you'll use:`},
    {type:'code',lang:'js',code:`// 1. Draw at a position (natural size)
ctx.drawImage(img, x, y);

// 2. Draw at a position AND set width/height (scaling)
ctx.drawImage(img, x, y, width, height);

// 3. Draw just a CROPPED PIECE of the image, scaled to a destination
//    (sx,sy,sw,sh = source rectangle) (dx,dy,dw,dh = destination)
ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);`},
    {type:'p',html:`Form 3 looks busy, but it's the key to animation — it lets you draw <i>one frame</i> out of a larger image.`},

    {type:'h',text:'3. Sprite sheets'},
    {type:'p',html:`Drawing a character that walks needs several poses. Rather than many files, artists pack the frames side by side into one image called a <b>sprite sheet</b>. To animate, you use form 3 of <code class="inline">drawImage</code> to crop a different frame each step:`},
    {type:'code',lang:'js',code:`const FRAME_W = 32, FRAME_H = 32;
let frame = 0;   // which frame (0,1,2,3...)

// crop the frame at column 'frame' and draw it scaled up 2x
ctx.drawImage(
  sheet,
  frame * FRAME_W, 0, FRAME_W, FRAME_H,   // source: pick the frame
  x, y, FRAME_W * 2, FRAME_H * 2          // destination: where + size
);`},
    {type:'note',kind:'key',title:'Animation = swap the crop',html:`A sprite animation is just changing which slice you crop, a few times per second (like Snake's timed steps). Cycle <code class="inline">frame</code> through 0,1,2,3 and back, and the character appears to walk.`},

    {type:'h',text:'4. Live demo: a drawn-and-animated sprite'},
    {type:'p',html:`So this runs anywhere with no external files, the demo <i>builds</i> a 4-frame sprite sheet in code (a little bouncing creature) and then animates it with the cropping form of <code class="inline">drawImage</code> — exactly as you would with a real PNG sheet. Press <b>Run</b>.`},
    {type:'run',label:'A sprite-sheet animation (frames generated in code)',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#06081a;border:3px solid #6c8cff;border-radius:10px}
</style></head>
<body>
  <canvas id="game" width="360" height="200"></canvas>
  <script>
    const ctx = document.getElementById("game").getContext("2d");
    const W = 360, H = 200, FW = 32, FH = 32, FRAMES = 4;

    // --- build a sprite SHEET on an offscreen canvas (stands in for a PNG) ---
    const sheet = document.createElement("canvas");
    sheet.width = FW * FRAMES; sheet.height = FH;
    const sctx = sheet.getContext("2d");
    for (let f = 0; f < FRAMES; f++) {
      const ox = f * FW;
      // body
      sctx.fillStyle = "#9a6bff";
      sctx.fillRect(ox + 6, 8, 20, 18);
      // eyes
      sctx.fillStyle = "#fff";
      sctx.fillRect(ox + 11, 13, 4, 4);
      sctx.fillRect(ox + 18, 13, 4, 4);
      // feet shift each frame -> walking illusion
      sctx.fillStyle = "#6c8cff";
      const step = (f % 2 === 0) ? 0 : 4;
      sctx.fillRect(ox + 8 + step, 26, 6, 4);
      sctx.fillRect(ox + 18 - step, 26, 6, 4);
    }

    // --- animate: crop a different frame on a timer, and bob across screen ---
    let frame = 0, x = 0, lastStep = 0;
    function loop(now) {
      ctx.clearRect(0, 0, W, H);
      if (now - lastStep > 150) { frame = (frame + 1) % FRAMES; lastStep = now; }
      x += 1.2; if (x > W) x = -64;
      const bob = Math.sin(now / 150) * 6;
      ctx.drawImage(
        sheet,
        frame * FW, 0, FW, FH,         // crop this frame
        x, 90 + bob, FW * 2, FH * 2    // draw it 2x, bobbing
      );
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`},
    {type:'note',kind:'info',title:'Where to get real art (free)',html:`Great beginner-friendly sources include <b>OpenGameArt.org</b>, <b>Kenney.nl</b> (superb free packs), and <b>itch.io</b> asset sections. Always check the licence and credit the artist when asked. With a real sheet, you'd just swap our generated <code class="inline">sheet</code> for a loaded <code class="inline">Image</code>.`},

    {type:'exercise',title:'Add some art',html:`<ol>
      <li>On your own machine, load a PNG with the <code class="inline">Image</code> pattern and draw it in your Snake or Pong game.</li>
      <li>Scale your image to half and double size using the width/height form of <code class="inline">drawImage</code>.</li>
      <li>Slow the animation down (raise the 150ms) and speed it up. Notice how frame rate changes the "walk".</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 18 recap',html:`Load images with <code class="inline">new Image()</code> + <code class="inline">onload</code>, draw with <code class="inline">drawImage</code> (position, scaled, or <b>cropped</b>). A <b>sprite sheet</b> packs animation frames into one image; cycling the crop makes a character move. Next: <b>sound</b> to make games feel alive.`}
  ]
},
{
