<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Dev Pro — Course Companion (Beginner)</title>
<style>
  :root{
    --bg:#0f1226; --bg2:#161a36; --panel:#1c2147; --panel2:#232a5c;
    --ink:#e9ecff; --muted:#a3aad6; --line:#2c3470;
    --brand:#6c8cff; --brand2:#9a6bff; --accent:#34d399; --warn:#fbbf24; --bad:#fb7185;
    --code-bg:#0b0e24; --radius:14px; --maxw:1280px;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:linear-gradient(180deg,#0c0f22,#0f1226 40%);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
  a{color:var(--brand)}
  /* Header */
  header.topbar{position:sticky;top:0;z-index:30;background:rgba(13,16,38,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
  .logo .badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:18px}
  .logo small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.5px}
  .topbar .spacer{flex:1}
  .progresswrap{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .pbar{width:160px;height:8px;background:#0c1030;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .pbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--brand));transition:width .4s}
  .menu-btn{display:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:18px}
  /* Layout */
  .layout{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:320px 1fr;gap:26px;padding:22px 18px 80px}
  aside.sidebar{position:sticky;top:74px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:6px}
  .search{width:100%;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);margin-bottom:14px;font-size:14px}
  .search::placeholder{color:var(--muted)}
  .month-group{margin-bottom:16px}
  .month-title{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--brand);font-weight:800;margin:6px 4px 8px}
  .month-sub{font-size:11px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:.2px;margin-top:2px}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--muted);border:1px solid transparent;font-size:14px}
  .navitem:hover{background:var(--panel);color:var(--ink)}
  .navitem.active{background:linear-gradient(135deg,rgba(108,140,255,.25),rgba(154,107,255,.18));border-color:var(--line);color:var(--ink)}
  .navitem .num{flex:none;width:26px;height:26px;border-radius:8px;background:#0c1030;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
  .navitem.done .num{background:var(--accent);color:#08130d;border-color:transparent}
  .navitem .t{flex:1;line-height:1.25}
  .navitem .wk{font-size:10px;color:var(--muted);display:block}
  .navitem.locked{opacity:.55}
  /* Main */
  main.content{min-width:0}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .crumbs{font-size:12.5px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:8px}
  h1.session-title{font-size:30px;line-height:1.15;margin:0 0 6px}
  .session-meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
  .chip{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .chip.brand{color:var(--ink);border-color:var(--brand);background:rgba(108,140,255,.12)}
  .obj{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 24px}
  .obj h3{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
  .obj ul{margin:0;padding-left:20px}
  .obj li{margin:4px 0}
  .content h2{font-size:22px;margin:34px 0 10px;padding-top:6px;border-top:1px solid var(--line);padding-top:22px}
  .content h2:first-of-type{border-top:none;padding-top:0}
  .content h3{font-size:17px;margin:22px 0 6px;color:#cfd6ff}
  .content p{margin:10px 0}
  .content ul,.content ol{margin:10px 0;padding-left:22px}
  .content li{margin:6px 0}
  code.inline{font-family:var(--mono);background:#0c1030;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:13.5px;color:#ffd9a0}
  kbd{font-family:var(--mono);background:#0c1030;border:1px solid var(--line);border-bottom-width:2px;padding:1px 7px;border-radius:6px;font-size:12.5px}
  /* callouts */
  .note{border-radius:12px;padding:14px 16px 14px 16px;margin:18px 0;border:1px solid var(--line);position:relative}
  .note .nt{font-weight:700;font-size:13px;letter-spacing:.4px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .note.tip{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.4)}
  .note.tip .nt{color:var(--accent)}
  .note.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.4)}
  .note.warn .nt{color:var(--warn)}
  .note.info{background:rgba(108,140,255,.08);border-color:rgba(108,140,255,.4)}
  .note.info .nt{color:var(--brand)}
  .note.key{background:rgba(154,107,255,.08);border-color:rgba(154,107,255,.45)}
  .note.key .nt{color:#c5a8ff}
  /* static code */
  .codeblock{position:relative;margin:16px 0}
  .codeblock pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:16px 16px;overflow:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
  .codeblock .lang{position:absolute;top:8px;right:54px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .copybtn{position:absolute;top:7px;right:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:3px 9px;font-size:11px;cursor:pointer}
  .copybtn:hover{color:var(--ink)}
  .tok-key{color:#ff9ecd}.tok-str{color:#9be8a0}.tok-num{color:#ffd9a0}.tok-com{color:#6f78b0;font-style:italic}.tok-fn{color:#8fd3ff}
  /* runnable demo */
  .runner{margin:18px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--code-bg)}
  .runner .rhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .runner .rhead .dot{width:10px;height:10px;border-radius:99px;background:#3a4280}
  .runner .rhead .label{flex:1;font-weight:600;color:var(--ink)}
  .runner textarea{width:100%;border:none;background:var(--code-bg);color:#e7ecff;font-family:var(--mono);font-size:13px;line-height:1.5;padding:14px;resize:vertical;min-height:150px;outline:none}
  .runner .ractions{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
  .btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
  .btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .btn:hover{filter:brightness(1.08)}
  .runner .stage{background:#fff;min-height:60px}
  .runner iframe{width:100%;border:none;display:block;background:#fff;min-height:220px}
  /* exercise */
  .exercise{background:linear-gradient(135deg,rgba(154,107,255,.1),rgba(108,140,255,.06));border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:20px 0}
  .exercise .xh{font-weight:800;color:#c5a8ff;font-size:13px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  /* outline (sessions not yet fully written) */
  .outline-banner{background:rgba(108,140,255,.08);border:1px dashed var(--brand);border-radius:12px;padding:16px 18px;margin:8px 0 22px;color:var(--muted);font-size:14px}
  .outline-banner b{color:var(--ink)}
  .footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
  .footer-nav button{flex:1;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);cursor:pointer}
  .footer-nav button:hover{border-color:var(--brand)}
  .footer-nav button.next{text-align:right}
  .footer-nav button span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .footer-nav button.disabled{opacity:.4;pointer-events:none}
  .complete-row{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .checkbtn{display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:14px}
  .checkbtn.done{background:var(--accent);color:#08130d;border-color:transparent}
  .home-hero{padding:8px 4px}
  .home-hero h1{font-size:34px;margin:0 0 8px;background:linear-gradient(90deg,#fff,#b9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}
  .home-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .home-card .big{font-size:26px;font-weight:800}
  .home-card .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr}
    aside.sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-height:none;background:var(--bg);z-index:40;padding:74px 14px 20px;transform:translateX(-105%);transition:transform .25s;border-right:1px solid var(--line)}
    aside.sidebar.open{transform:none}
    .menu-btn{display:block}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
    .scrim.show{display:block}
    .card{padding:20px 18px}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="logo">
      <div class="badge">🎮</div>
      <div>Game Dev Pro<small>BEGINNER COURSE COMPANION</small></div>
    </div>
    <div class="spacer"></div>
    <div class="progresswrap">
      <span id="progressLabel">0 / 24</span>
      <div class="pbar"><i id="pbarFill"></i></div>
    </div>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <input class="search" id="search" placeholder="🔍  Search sessions…" />
    <div id="nav"></div>
  </aside>
  <main class="content">
    <div class="card" id="content"></div>
  </main>
</div>

<script>
/* ============================================================
   GAME DEV PRO — COURSE COMPANION
   Engine: rendering, navigation, live code runner, progress.
   Course content lives in the SESSIONS array further below.
   ============================================================ */

let SESSIONS = [];

/* ---------- tiny syntax highlighter (HTML/CSS/JS-ish) ----------
   Single-pass tokenizer. We scan the RAW code once and emit HTML,
   escaping each plain slice as we go. Because we never re-scan the
   output, the <span> tags we inject (which contain class="...") can
   never be corrupted by a later pass. */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const HL_KEYWORDS = new Set(['const','let','var','function','return','if','else','for','while','new','class','this','true','false','null','undefined','import','export','of','in','break','continue','switch','case','document','window','console']);
function highlight(code){
  // one regex, alternation order matters: comments, strings, numbers, words
  const re = /(\/\/[^\n]*|<!--[\s\S]*?-->)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][A-Za-z0-9_$]*)/g;
  let out = '', last = 0, m;
  while((m = re.exec(code)) !== null){
    out += esc(code.slice(last, m.index));   // plain text before the match
    if(m[1])      out += '<span class="tok-com">' + esc(m[1]) + '</span>';
    else if(m[2]) out += '<span class="tok-str">' + esc(m[2]) + '</span>';
    else if(m[3]) out += '<span class="tok-num">' + m[3] + '</span>';
    else if(m[4]) out += HL_KEYWORDS.has(m[4]) ? '<span class="tok-key">' + m[4] + '</span>' : esc(m[4]);
    last = re.lastIndex;
  }
  out += esc(code.slice(last));              // trailing plain text
  return out;
}

/* ---------- block renderers ---------- */
function rid(){return 'x'+Math.random().toString(36).slice(2,9);}

function renderBlock(b){
  if(typeof b === 'string') return `<p>${b}</p>`;
  switch(b.type){
    case 'h': return `<h2>${b.text}</h2>`;
    case 'h3': return `<h3>${b.text}</h3>`;
    case 'p': return `<p>${b.html}</p>`;
    case 'list': return `<ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'olist': return `<ol>${b.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
    case 'note': {
      const k = b.kind||'info';
      const icon = {tip:'💡',warn:'⚠️',info:'ℹ️',key:'🔑'}[k]||'ℹ️';
      const title = b.title || ({tip:'Tip',warn:'Watch out',info:'Note',key:'Key idea'}[k]);
      return `<div class="note ${k}"><div class="nt">${icon} ${title}</div><div>${b.html}</div></div>`;
    }
    case 'exercise':
      return `<div class="exercise"><div class="xh">✏️ ${b.title||'Your turn'}</div><div>${b.html}</div></div>`;
    case 'code': {
      const id=rid();
      return `<div class="codeblock"><span class="lang">${b.lang||'code'}</span>
        <button class="copybtn" data-copy="${id}">Copy</button>
        <pre id="${id}"><code>${highlight(b.code)}</code></pre></div>`;
    }
    case 'run': {
      const id=rid();
      const code = b.code;
      return `<div class="runner" data-runner>
        <div class="rhead"><span class="dot"></span><span class="dot" style="background:#4a5290"></span><span class="dot" style="background:#5a63a8"></span>
        <span class="label">${b.label||'Live editor — try changing the code, then press Run'}</span></div>
        <textarea spellcheck="false" id="${id}">${esc(code)}</textarea>
        <div class="ractions">
          <button class="btn" data-run="${id}">▶ Run</button>
          <button class="btn ghost" data-reset="${id}">↺ Reset</button>
        </div>
        <iframe data-stage="${id}" sandbox="allow-scripts" title="output"></iframe>
      </div>`;
    }
    default: return '';
  }
}

/* ---------- wire up interactive bits after render ---------- */
function wireInteractions(root){
  // copy buttons
  root.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const pre=document.getElementById(btn.dataset.copy);
      const text=pre.innerText;
      navigator.clipboard?.writeText(text);
      const old=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=old,1200);
    });
  });
  // runnable demos
  root.querySelectorAll('[data-runner]').forEach(r=>{
    const ta=r.querySelector('textarea');
    const id=ta.id;
    const stage=r.querySelector(`[data-stage="${id}"]`);
    const original=ta.value;
    const run=()=>{ stage.srcdoc = ta.value; };
    r.querySelector(`[data-run="${id}"]`).addEventListener('click',run);
    r.querySelector(`[data-reset="${id}"]`).addEventListener('click',()=>{ta.value=original;run();});
    // auto-run once so students see output immediately
    run();
    // grow textarea to fit
    ta.style.height = Math.min(460, Math.max(150, ta.value.split('\n').length*20+24))+'px';
  });
}

/* ---------- progress (saved in this browser) ---------- */
const STORE='gamedevpro_progress_v1';
function getDone(){ try{return JSON.parse(localStorage.getItem(STORE))||{};}catch(e){return {};} }
function setDone(map){ try{localStorage.setItem(STORE,JSON.stringify(map));}catch(e){} }
function isDone(id){ return !!getDone()[id]; }
function toggleDone(id){ const m=getDone(); m[id]=!m[id]; setDone(m); }
function doneCount(){ return Object.values(getDone()).filter(Boolean).length; }

/* ---------- navigation / routing ---------- */
let current = 'home';

function buildNav(filter){
  filter=(filter||'').toLowerCase();
  const nav=document.getElementById('nav');
  const months=[
    {n:'Month 1 — Foundations', sub:'Setup, the web, HTML, CSS & JavaScript basics', range:[1,8]},
    {n:'Month 2 — Core Game Mechanics', sub:'The game loop, input, motion, collisions, first games', range:[9,16]},
    {n:'Month 3 — Real Projects & Polish', sub:'Breakout, a platformer, sound, scoring & shipping', range:[17,24]},
  ];
  let html = `<div class="navitem ${current==='home'?'active':''}" data-go="home"><span class="num">★</span><span class="t">Course Home<span class="wk">Start here</span></span></div>`;
  months.forEach(m=>{
    const items = SESSIONS.filter(s=>s.id>=m.range[0]&&s.id<=m.range[1])
      .filter(s=> !filter || (s.title+s.objectives.join(' ')).toLowerCase().includes(filter));
    if(!items.length) return;
    html += `<div class="month-group"><div class="month-title">${m.n}<div class="month-sub">${m.sub}</div></div>`;
    items.forEach(s=>{
      const done=isDone(s.id)?'done':'';
      const active=(current===s.id)?'active':'';
      html += `<div class="navitem ${done} ${active}" data-go="${s.id}">
        <span class="num">${isDone(s.id)?'✓':s.id}</span>
        <span class="t">${s.title}<span class="wk">Week ${s.week} · Session ${s.id}</span></span></div>`;
    });
    html += `</div>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',()=>{ go(el.dataset.go); closeSidebar(); });
  });
}

function updateProgressUI(){
  const c=doneCount();
  document.getElementById('progressLabel').textContent = c+' / '+SESSIONS.length;
  document.getElementById('pbarFill').style.width = (c/SESSIONS.length*100)+'%';
}

function renderHome(){
  const total=SESSIONS.length, done=doneCount();
  const full=SESSIONS.filter(s=>!s.outline).length;
  return `<div class="home-hero">
    <div class="crumbs">Welcome</div>
    <h1>Build Real Games from Zero — with HTML, CSS & JavaScript</h1>
    <p style="color:var(--muted);max-width:680px">A 3-month, twice-a-week journey designed for complete beginners. No prior coding needed. Every session builds on the last: you'll install your tools, learn the language of the web, and steadily create real playable 2D games — Pong, Snake, Breakout and a platformer — all in your browser.</p>
    <div class="home-grid">
      <div class="home-card"><div class="big">24</div><div class="lbl">Sessions</div></div>
      <div class="home-card"><div class="big">12</div><div class="lbl">Weeks · 2×1hr / week</div></div>
      <div class="home-card"><div class="big">${done}</div><div class="lbl">Completed by you</div></div>
      <div class="home-card"><div class="big">4+</div><div class="lbl">Playable games</div></div>
    </div>
    <div class="note info" style="margin-top:24px"><div class="nt">ℹ️ How to use this companion</div><div>
      Work through the sessions <b>in order</b> — each one assumes what you learned before. Read the explanations, then use the <b>green Run buttons</b> to edit and run code right here on the page (nothing to install for that). Mark a session <b>complete</b> at the bottom when you finish; your progress is saved in this browser. Sessions 1–4 are fully written; the rest show their full plan and arrive as you progress.
    </div></div>
    <div class="note key" style="margin-top:8px"><div class="nt">🔑 The golden rule of learning to code</div><div>
      Don't just read — <b>type the code yourself and break it on purpose</b>. Change a number, delete a line, see what happens, then fix it. That loop is where real understanding comes from.
    </div></div>
    <div style="margin-top:22px"><button class="btn" data-go="1">Start Session 1 →</button></div>
  </div>`;
}

function renderSession(s){
  const objectives = `<div class="obj"><h3>By the end of this session you will be able to</h3><ul>${s.objectives.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
  let body='';
  if(s.outline){
    body = `<div class="outline-banner">📋 <b>Full session plan below.</b> This session's complete written walkthrough and live demos are being prepared. Everything you'll cover, in order, is listed here so you can see exactly where the course is heading.</div>`;
    body += (s.blocks||[]).map(renderBlock).join('');
  } else {
    body = (s.blocks||[]).map(renderBlock).join('');
  }
  const prev=SESSIONS.find(x=>x.id===s.id-1);
  const next=SESSIONS.find(x=>x.id===s.id+1);
  const nav=`<div class="footer-nav">
    <button class="${prev?'':'disabled'}" data-go="${prev?prev.id:'home'}"><span>Previous</span>${prev?('← '+prev.title):'← Home'}</button>
    <button class="next ${next?'':'disabled'}" data-go="${next?next.id:'home'}"><span>Next</span>${next?(next.title+' →'):'Home →'}</button>
  </div>`;
  const complete=`<div class="complete-row">
    <button class="checkbtn ${isDone(s.id)?'done':''}" id="completeBtn">${isDone(s.id)?'✓ Completed':'Mark this session complete'}</button>
    <span style="color:var(--muted);font-size:13px">Week ${s.week} · ${s.duration||'≈ 60 min'} · Session ${s.id} of ${SESSIONS.length}</span>
  </div>`;
  return `<div class="crumbs">Game Dev Pro · Week ${s.week} · Session ${s.id}</div>
    <h1 class="session-title">${s.title}</h1>
    <div class="session-meta">
      <span class="chip brand">⏱ ${s.duration||'≈ 60 minutes'}</span>
      <span class="chip">📅 Week ${s.week}</span>
      <span class="chip">🧩 ${s.outline?'Planned':'Full lesson'}</span>
    </div>
    ${objectives}
    <div class="content">${body}</div>
    ${complete}
    ${nav}`;
}

function go(target){
  current = (target==='home')?'home':parseInt(target,10);
  const c=document.getElementById('content');
  if(current==='home'){
    c.innerHTML=renderHome();
  } else {
    const s=SESSIONS.find(x=>x.id===current);
    c.innerHTML=renderSession(s);
    const cb=document.getElementById('completeBtn');
    if(cb) cb.addEventListener('click',()=>{ toggleDone(s.id); go(s.id); updateProgressUI(); buildNav(document.getElementById('search').value); });
  }
  c.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
  wireInteractions(c);
  buildNav(document.getElementById('search').value);
  window.scrollTo({top:0,behavior:'smooth'});
  location.hash = current==='home'?'':('s'+current);
}

/* sidebar mobile */
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');}

/* boot */
function boot(){
  buildNav();
  updateProgressUI();
  const h=location.hash.replace('#','');
  if(h.startsWith('s')) go(parseInt(h.slice(1),10)); else go('home');
  document.getElementById('search').addEventListener('input',e=>buildNav(e.target.value));
  document.getElementById('menuBtn').addEventListener('click',openSidebar);
  document.getElementById('scrim').addEventListener('click',closeSidebar);
}

  blocks:[
    {type:'p',html:`Welcome to <b>Game Dev Pro</b>! Over the next three months you'll go from never having written a line of code to building real, playable games that run in any web browser. This very first session is all about <b>setting up your tools</b> — the same way a carpenter sets up a workbench before building anything. Take your time here; a clean setup makes everything that follows easier.`},

    {type:'note',kind:'info',title:'No experience needed',html:`If you've never coded before, you're in exactly the right place. We assume <b>zero</b> prior knowledge. Every new word is explained the first time it appears.`},

    {type:'h',text:'1. What are we actually building games with?'},
    {type:'p',html:`Every website you've ever visited is built from three technologies that work together. We'll use the exact same three to build games:`},

    {type:'note',kind:'key',html:`A helpful mental picture: <b>HTML is the noun, CSS is the adjective, JavaScript is the verb.</b> A page says <i>"button"</i> (HTML), <i>"a big red button"</i> (CSS), <i>"when clicked, jump"</i> (JavaScript).`},
    {type:'p',html:`Your web browser (Chrome, Firefox, Edge, Safari…) already knows how to read all three of these and turn them into something you can see and interact with. That means <b>you don't need to install anything special to run your games</b> — if it works in your browser, you can share it with anyone who has a browser. That's the magic of building games this way.`},

    {type:'h',text:'3. Installing Visual Studio Code'},

    {type:'note',kind:'tip',title:'One extension worth installing now',html:`In VS Code, click the <b>Extensions</b> icon on the left bar (it looks like four little squares), search for <b>"Live Server"</b> by Ritwick Dey, and click <b>Install</b>. This lets you preview your game in the browser and auto-refreshes every time you save. We'll use it in a moment.`},

    {type:'h',text:'4. A quick tour of VS Code'},
    {type:'p',html:`When you open VS Code you'll see a few main areas. You don't need to memorise these — just know they exist:`},
    {type:'list',items:[
      `<b>The Activity Bar</b> (far left): icons for Files (Explorer), Search, Extensions, and more.`,

    {type:'h',text:'5. Create your first project folder'},
    {type:'p',html:`Good organisation now saves headaches later. Let's make a home for everything you'll build in this course.`},
    {type:'olist',items:[
      `On your computer, create a folder somewhere easy to find — for example <code class="inline">Documents/game-dev-pro</code>.`,
      `Inside it, create another folder called <code class="inline">session-01</code>. (Each session will get its own folder.)`,

    ]},
    {type:'note',kind:'tip',title:'Naming files and folders',html:`Use lowercase letters and dashes instead of spaces: <code class="inline">my-first-game</code>, not <code class="inline">My First Game</code>. Spaces and capital letters can cause subtle problems on the web. Make this a habit from day one.`},

    {type:'h',text:'6. Your first web page: "Hello, Game!"'},
    {type:'p',html:`In VS Code's Explorer, hover over your folder name and click the <b>New File</b> icon. Name it exactly <code class="inline">index.html</code>. The name <code class="inline">index</code> is special — browsers look for it first, so it's the traditional name for a site's home page.`},
    {type:'p',html:`Type the following into <code class="inline">index.html</code>. <b>Type it by hand</b> rather than copy-pasting — your fingers learn the shapes of code, and you'll start to recognise the pieces. We'll explain every line right after.`},
    {type:'code',lang:'html',code:`<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My First Game Page</title>
  </head>
  <body>
    <h1>Hello, Game!</h1>
    <p>This is the beginning of my game development journey.</p>
  </body>
</html>`},
    {type:'h3',text:'What each line means'},
    {type:'list',items:[
      `<code class="inline">&lt;!DOCTYPE html&gt;</code> — tells the browser "this is a modern HTML page." Always the first line.`,
      `<code class="inline">&lt;html lang="en"&gt;</code> — the container that wraps the whole page; <code class="inline">lang="en"</code> says the content is in English.`,
      `<code class="inline">&lt;head&gt;</code> — information <i>about</i> the page that you don't see directly: its title, character settings, and later its styles and scripts.`,
      `<code class="inline">&lt;meta charset="UTF-8"&gt;</code> — lets the page use any character (accents, emoji, symbols) correctly.`,
      `<code class="inline">&lt;title&gt;</code> — the text shown on the browser tab.`,
      `<code class="inline">&lt;body&gt;</code> — everything you actually see on the page goes here.`,
      `<code class="inline">&lt;h1&gt;</code> — a big top-level heading. <code class="inline">&lt;p&gt;</code> — a paragraph of text.`
    ]},
    {type:'note',kind:'key',title:'Tags come in pairs',html:`Notice most things open and close: <code class="inline">&lt;h1&gt;</code> … <code class="inline">&lt;/h1&gt;</code>. The one with the slash <code class="inline">/</code> is the <b>closing</b> tag. Whatever sits between the two is what that tag affects. Forgetting to close a tag is one of the most common beginner mistakes — so watch for it.`},

    {type:'h',text:'7. See it run — right here'},
    {type:'p',html:`On your own machine you'd right-click <code class="inline">index.html</code> and choose <b>"Open with Live Server"</b> to view it in your browser. But this companion has a live editor built in! The box below contains that exact page. Press <b>▶ Run</b> to see it, then try changing the heading text and run it again.`},
    {type:'run',label:'Live editor — change the words, then press Run',code:`<!DOCTYPE html>

    {type:'note',kind:'tip',html:`Try replacing <code class="inline">Hello, Game!</code> with your own name, or add a second <code class="inline">&lt;p&gt;…&lt;/p&gt;</code> line. Press Run to see the change. Press <b>↺ Reset</b> to go back to the original. You cannot break anything here — experiment freely.`},

    {type:'h',text:'8. Meet the browser developer tools'},
    {type:'p',html:`Your browser hides a powerful workshop called the <b>Developer Tools</b> (or "DevTools"). Game developers practically live in here. Open it on a real web page with <kbd>F12</kbd>, or right-click anywhere and choose <b>Inspect</b>.`},
    {type:'list',items:[
      `The <b>Elements</b> tab shows the live HTML of the page — you can even edit it temporarily.`,
      `The <b>Console</b> tab is where JavaScript prints messages and where errors show up in red. When something goes wrong later, <b>the Console is the first place you look.</b>`

    {type:'note',kind:'info',html:`We'll use the Console heavily from Session 4 onward when we start writing JavaScript. For now, just know it exists and how to open it.`},

    {type:'exercise',title:'Practice before next session',html:`<ol>
      <li>Make sure VS Code and a browser are installed, and the <b>Live Server</b> extension is added.</li>
      <li>Create the <code class="inline">game-dev-pro</code> folder with a <code class="inline">session-01</code> folder inside.</li>

    {type:'note',kind:'key',title:'Session 1 recap',html:`Games here are made of <b>HTML</b> (structure), <b>CSS</b> (style) and <b>JavaScript</b> (behaviour). You installed <b>VS Code</b> and a browser, learned to make a project folder and an <code class="inline">index.html</code> page, and saw it run. Next time: HTML in depth, and your first game <i>canvas</i>.`}

{
  id:2, week:1, duration:'≈ 60 minutes',
  title:'HTML & Your First Game Canvas',
  objectives:[
    'Understand HTML elements, tags, and attributes properly',
    'Build a well-structured page that will host a game',
    'Meet the canvas element — the rectangle where games are drawn',
    'Draw your very first shapes on the canvas with a few lines of JavaScript',
    'Understand the canvas coordinate system'
  ],
  blocks:[
    {type:'p',html:`Last session you set up your tools and made a tiny page. Today we go deeper into <b>HTML</b> and then meet the single most important element for game development: the <b>&lt;canvas&gt;</b>. By the end you'll have drawn your first shapes — the literal building blocks of every game you'll make.`},
    {type:'note',kind:'info',html:`Make a new folder <code class="inline">session-02</code> and a fresh <code class="inline">index.html</code> inside it, just like last time. Open it with Live Server as you follow along.`},

    {type:'h',text:'1. HTML, looked at more closely'},
    {type:'p',html:`An HTML page is a tree of <b>elements</b>. Each element is written with <b>tags</b>. Most elements have an opening tag and a closing tag with content in between:`},
    {type:'code',lang:'html',code:`<p>This sentence is the content of a paragraph element.</p>`},
    {type:'p',html:`Some elements also carry extra information called <b>attributes</b>, written inside the opening tag as <code class="inline">name="value"</code> pairs. For example, an image element needs to know <i>which</i> image to show:`},
    {type:'code',lang:'html',code:`<img src="player.png" alt="The player character" />`},
    {type:'list',items:[
      `<code class="inline">src</code> is an attribute whose value is the file to load.`,
      `<code class="inline">alt</code> is alternative text shown if the image can't load.`,
      `<code class="inline">&lt;img&gt;</code> has no separate closing tag — it's "self-closing". We write it as <code class="inline">&lt;img … /&gt;</code>.`
    ]},
    {type:'note',kind:'key',title:'The three pieces',html:`<b>Tag</b> = the keyword in angle brackets (<code class="inline">p</code>, <code class="inline">img</code>). <b>Element</b> = the whole thing including content. <b>Attribute</b> = extra settings inside the opening tag. You'll use these words constantly.`},

    {type:'h',text:'2. A few HTML elements you\'ll use a lot'},
    {type:'list',items:[
      `<code class="inline">&lt;div&gt;</code> — a generic box/container used to group things and lay them out.`,
      `<code class="inline">&lt;button&gt;</code> — a clickable button (Start, Pause, Restart).`,
      `<code class="inline">&lt;h1&gt;</code> to <code class="inline">&lt;h6&gt;</code> — headings, biggest to smallest.`,
      `<code class="inline">&lt;span&gt;</code> — a small inline container, handy for showing a score number.`,
      `<code class="inline">&lt;canvas&gt;</code> — the drawing surface for our games. The star of the show.`
    ]},
    {type:'note',kind:'tip',title:'The id attribute',html:`We often give an element a unique name with the <code class="inline">id</code> attribute, e.g. <code class="inline">&lt;canvas id="game"&gt;</code>. Later, JavaScript uses that id to "grab" the element and control it. Think of an id as a name tag.`},

    {type:'h',text:'3. Meet the canvas'},
    {type:'p',html:`The <code class="inline">&lt;canvas&gt;</code> element is exactly what it sounds like: a blank rectangle you can paint on using JavaScript. It does nothing on its own — it's an empty frame. We give it a <b>width</b> and <b>height</b> in pixels:`},
    {type:'code',lang:'html',code:`<canvas id="game" width="400" height="300"></canvas>`},
    {type:'note',kind:'warn',title:'Set size with attributes, not just CSS',html:`Always set the canvas <code class="inline">width</code> and <code class="inline">height</code> as <b>attributes</b> (as above). If you only set the size with CSS, the drawing gets stretched and blurry. We'll revisit this, but build the habit now.`},

    {type:'h',text:'4. Drawing needs a "context"'},
    {type:'p',html:`To paint on the canvas, JavaScript first asks the canvas for its <b>drawing context</b> — a toolbox of drawing commands. For 2D games we ask for the <code class="inline">"2d"</code> context. Here's the pattern you'll repeat in every game:`},
    {type:'code',lang:'js',code:`// 1. Find the canvas element on the page by its id
const canvas = document.getElementById("game");

// 2. Ask it for the 2D drawing toolbox (the "context")
const ctx = canvas.getContext("2d");

// 3. Now use ctx.* commands to draw!
ctx.fillStyle = "tomato";       // choose a colour
ctx.fillRect(20, 20, 100, 60);  // draw a filled rectangle`},
    {type:'list',items:[
      `<code class="inline">document.getElementById("game")</code> — finds the element whose id is "game".`,
      `<code class="inline">getContext("2d")</code> — hands back the 2D toolbox; we store it in a variable called <code class="inline">ctx</code> (short for "context") by convention.`,
      `<code class="inline">fillStyle</code> — sets the current fill colour (a name, or a code like <code class="inline">"#34d399"</code>).`,
      `<code class="inline">fillRect(x, y, width, height)</code> — draws a solid rectangle.`
    ]},

    {type:'h',text:'5. The canvas coordinate system'},
    {type:'p',html:`This is important and slightly surprising: on a canvas, the point <b>(0, 0) is the top-left corner</b>. The <b>x</b> value grows to the <b>right</b>, and the <b>y</b> value grows <b>downward</b> (not upward like in school maths). So a higher y means lower on the screen.`},
    {type:'note',kind:'key',title:'Remember the flip',html:`<b>x → right, y → down.</b> A ball at <code class="inline">(0,0)</code> sits in the top-left; increasing its y moves it <i>down</i> the screen. Almost every movement bug beginners hit comes from forgetting that y grows downward.`},

    {type:'h',text:'6. Your first drawing — live'},
    {type:'p',html:`Here is a complete page: an HTML canvas plus a script that draws on it. Press <b>▶ Run</b>, then change the numbers and colours and run again. Notice how the rectangle moves as you change its x and y.`},
    {type:'run',label:'Draw on the canvas — change the numbers and Run',code:`<!DOCTYPE html>
<html>
<head>
  <style>
    body { background:#222; display:flex; justify-content:center; padding:16px; }
    canvas { background:#fff; border:2px solid #555; }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="260"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // A red square near the top-left
    ctx.fillStyle = "tomato";
    ctx.fillRect(20, 20, 80, 80);

    // A green rectangle further right and down
    ctx.fillStyle = "#34d399";
    ctx.fillRect(160, 100, 120, 60);

    // A blue circle (drawn as an arc)
    ctx.fillStyle = "dodgerblue";
    ctx.beginPath();
    ctx.arc(320, 70, 40, 0, Math.PI * 2);
    ctx.fill();

    // Some text
    ctx.fillStyle = "#333";
    ctx.font = "20px sans-serif";
    ctx.fillText("My canvas!", 20, 200);
  <\/script>
</body>
</html>`},
    {type:'h3',text:'New things you just used'},
    {type:'list',items:[
      `<code class="inline">arc(x, y, radius, startAngle, endAngle)</code> draws a circle/arc. <code class="inline">Math.PI * 2</code> means "all the way around" (a full circle).`,
      `<code class="inline">beginPath()</code> starts a new shape, and <code class="inline">fill()</code> fills it with the current colour.`,
      `<code class="inline">font</code> and <code class="inline">fillText(text, x, y)</code> draw words.`,
      `The <code class="inline">&lt;style&gt;</code> in the head is CSS — we'll dive into that next session. Here it just centres the canvas and gives it a white background.`
    ]},
    {type:'note',kind:'warn',title:'Why the funny <\\/script>?',html:`Inside this editor we write <code class="inline">&lt;\\/script&gt;</code> with a backslash so the page doesn't end the script too early. In your own files on your computer, you write a normal <code class="inline">&lt;/script&gt;</code> with no backslash.`},

    {type:'h',text:'7. Putting it together in your own file'},
    {type:'p',html:`In your <code class="inline">session-02/index.html</code>, recreate the page above (without the backslash trick). Save, and Live Server will refresh automatically. You're now drawing graphics with code — that's the foundation of literally every game.`},

    {type:'exercise',title:'Try these challenges',html:`<ol>
      <li>Draw a "traffic light": three circles stacked vertically in red, yellow, green.</li>
      <li>Draw a simple house: a square for the wall and a triangle for the roof. (Hint for the triangle: <code class="inline">beginPath()</code>, then <code class="inline">moveTo(x,y)</code>, two <code class="inline">lineTo(x,y)</code> calls, then <code class="inline">fill()</code>.)</li>
      <li>Write your name on the canvas in a colour you like.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 2 recap',html:`HTML is built from <b>elements</b> (tags + content + attributes). The <b>&lt;canvas&gt;</b> is a blank rectangle; JavaScript gets its <b>2D context</b> (<code class="inline">ctx</code>) and draws shapes with commands like <code class="inline">fillRect</code> and <code class="inline">arc</code>. Coordinates start at the top-left, with <b>y growing downward</b>. Next: CSS to make everything look good.`}
  ]
},
{
  id:3, week:2, duration:'≈ 60 minutes',
  title:'CSS — Styling Your Game',
  objectives:[
    'Understand what CSS is and the three ways to add it',
    'Learn selectors, properties and values',
    'Style the page and centre your game canvas neatly',
    'Use colours, borders, spacing and fonts confidently',
    'Build a clean "game frame" layout you\'ll reuse in every project'
  ],
  blocks:[
    {type:'p',html:`You can now draw on a canvas, but the page around it looks plain. <b>CSS</b> is how we make things look good — colours, spacing, fonts, and layout. A polished frame makes even a simple game feel real. Today you'll learn just enough CSS to present your games beautifully.`},
    {type:'note',kind:'info',html:`Create a <code class="inline">session-03</code> folder with an <code class="inline">index.html</code>. Follow along and run each example below.`},

    {type:'h',text:'1. What CSS looks like'},
    {type:'p',html:`CSS is a list of <b>rules</b>. Each rule picks some elements (the <b>selector</b>) and then sets one or more <b>properties</b>:`},
    {type:'code',lang:'css',code:`h1 {
  color: white;
  font-size: 32px;
}`},
    {type:'list',items:[
      `<code class="inline">h1</code> — the <b>selector</b>: "find all h1 elements".`,
      `<code class="inline">color</code> and <code class="inline">font-size</code> — <b>properties</b>: things you can change.`,
      `<code class="inline">white</code> and <code class="inline">32px</code> — the <b>values</b>.`,
      `Each property/value pair ends with a semicolon <code class="inline">;</code> and the whole block is wrapped in curly braces <code class="inline">{ }</code>.`
    ]},

    {type:'h',text:'2. Three ways to add CSS (use the third)'},
    {type:'olist',items:[
      `<b>Inline</b> — a <code class="inline">style</code> attribute on one element. Quick but messy; avoid for anything real.`,
      `<b>Internal</b> — a <code class="inline">&lt;style&gt;</code> block in the page <code class="inline">&lt;head&gt;</code>. Fine for small single-page games, and what we'll use early on.`,
      `<b>External</b> — a separate <code class="inline">style.css</code> file linked with <code class="inline">&lt;link rel="stylesheet" href="style.css" /&gt;</code>. The professional approach for bigger projects.`
    ]},
    {type:'note',kind:'tip',html:`We'll mostly use an internal <code class="inline">&lt;style&gt;</code> block while learning, because it keeps everything in one file and is easy to follow. Later projects will graduate to an external file.`},

    {type:'h',text:'3. Selectors: targeting the right elements'},
    {type:'p',html:`There are three selectors you'll use constantly:`},
    {type:'list',items:[
      `<b>By tag</b>: <code class="inline">canvas { … }</code> styles every canvas.`,
      `<b>By class</b>: <code class="inline">.panel { … }</code> styles every element with <code class="inline">class="panel"</code>. A class can be reused on many elements.`,
      `<b>By id</b>: <code class="inline">#game { … }</code> styles the single element with <code class="inline">id="game"</code>.`
    ]},
    {type:'note',kind:'key',html:`Remember the symbols: a <b>dot</b> <code class="inline">.</code> means class, a <b>hash</b> <code class="inline">#</code> means id, and <b>no symbol</b> means a tag name.`},

    {type:'h',text:'4. The properties you\'ll reach for most'},
    {type:'list',items:[
      `<code class="inline">color</code> — text colour. <code class="inline">background</code> — background colour or gradient.`,
      `<code class="inline">font-family</code>, <code class="inline">font-size</code> — text appearance.`,
      `<code class="inline">margin</code> — space <i>outside</i> an element. <code class="inline">padding</code> — space <i>inside</i> it.`,
      `<code class="inline">border</code> — a line around an element, e.g. <code class="inline">2px solid #555</code>.`,
      `<code class="inline">border-radius</code> — rounded corners.`,
      `<code class="inline">display:flex</code> with <code class="inline">justify-content</code> / <code class="inline">align-items</code> — a simple, powerful way to centre things.`
    ]},
    {type:'note',kind:'info',title:'Colours on the web',html:`You can name colours (<code class="inline">tomato</code>), use hex codes (<code class="inline">#34d399</code>), or RGB (<code class="inline">rgb(52,211,153)</code>). Hex codes are six characters after a <code class="inline">#</code>: two each for red, green, blue.`},

    {type:'h',text:'5. Centring the canvas (the classic layout)'},
    {type:'p',html:`Almost every game wants its canvas centred on screen with a tidy title above it. <b>Flexbox</b> makes this easy. Run this and watch how the canvas sits perfectly in the middle:`},
    {type:'run',label:'A clean game frame — tweak the CSS and Run',code:`<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #1b1f3b, #0d1024);
    color: #e9ecff;
    font-family: system-ui, sans-serif;
    /* flexbox: stack children in a column, centred */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  h1 { margin: 0; letter-spacing: 1px; }
  .subtitle { color: #a3aad6; margin: 0; }
  #game {
    background: #0b0e24;
    border: 3px solid #6c8cff;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
  <h1>⭐ Star Catcher</h1>
  <p class="subtitle">A clean, centred game frame</p>
  <canvas id="game" width="360" height="220"></canvas>
  <script>
    const ctx = document.getElementById("game").getContext("2d");
    ctx.fillStyle = "gold";
    ctx.font = "60px serif";
    ctx.fillText("★", 150, 130);
  <\/script>
</body>
</html>`},
    {type:'h3',text:'What made the centring work'},
    {type:'list',items:[
      `<code class="inline">display:flex</code> on the body turns it into a flexible container.`,
      `<code class="inline">flex-direction:column</code> stacks children top-to-bottom.`,
      `<code class="inline">align-items:center</code> centres them left-to-right; <code class="inline">justify-content:center</code> centres top-to-bottom.`,
      `<code class="inline">min-height:100vh</code> makes the body at least as tall as the screen (<code class="inline">vh</code> = "viewport height"), so there's room to centre within.`,
      `<code class="inline">gap:14px</code> adds even spacing between the stacked items.`
    ]},

    {type:'h',text:'6. Spacing: margin vs padding'},
    {type:'p',html:`Beginners mix these up, so here's the simple version. Imagine a framed picture on a wall:`},
    {type:'list',items:[
      `<b>Padding</b> = the mat <i>inside</i> the frame, between the picture and the frame edge.`,
      `<b>Margin</b> = the empty wall space <i>outside</i> the frame, pushing other pictures away.`
    ]},
    {type:'note',kind:'tip',html:`A reset you'll see everywhere: <code class="inline">body { margin: 0; }</code> removes the small default gap browsers add around the page, so your game can sit flush to the edges.`},

    {type:'h',text:'7. A reusable game shell'},
    {type:'p',html:`The frame above isn't throwaway — it's a template. From now on, start each game with a centred canvas, a title, and a dark background. Save the example above as your personal starter and copy it into new projects.`},

    {type:'exercise',title:'Style challenges',html:`<ol>
      <li>Change the gradient background to your own two colours.</li>
      <li>Give the canvas a thicker border and more rounded corners.</li>
      <li>Add a <code class="inline">&lt;button&gt;Start&lt;/button&gt;</code> under the canvas and style it: padding, a background colour, rounded corners, and <code class="inline">cursor: pointer</code>. (We'll make it actually <i>do</i> something in Session 5.)</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 3 recap',html:`CSS rules = <b>selector</b> + <b>properties/values</b>. Target elements by tag, <b>.class</b>, or <b>#id</b>. <b>Padding</b> is space inside, <b>margin</b> is space outside. <b>Flexbox</b> (<code class="inline">display:flex</code> + <code class="inline">align-items</code>/<code class="inline">justify-content</code>) centres your canvas effortlessly. Next: JavaScript — making things actually happen.`}
  ]
},
{
  id:4, week:2, duration:'≈ 60 minutes',
  title:'JavaScript Fundamentals — Variables & Data',
  objectives:[
    'Write and run JavaScript, and print to the Console',
    'Store information in variables with let and const',
    'Work with the core data types: numbers, strings, booleans',
    'Do arithmetic and combine text',
    'Use these ideas to track a simple game score'
  ],
  blocks:[
    {type:'p',html:`HTML gives structure and CSS gives style, but <b>JavaScript is where games come alive</b>. It's the language that moves things, keeps score, and responds to the player. Today we learn the absolute fundamentals: how to store and work with data. These ideas power everything we'll build for the rest of the course.`},
    {type:'note',kind:'info',html:`Set up <code class="inline">session-04</code>. We'll write small scripts and watch their output. Open your browser's <b>Console</b> (<kbd>F12</kbd>) on your real page to see messages — and the runnable boxes here show output on screen too.`},

    {type:'h',text:'1. Saying hello to the Console'},
    {type:'p',html:`<code class="inline">console.log(…)</code> prints a message — it's the developer's best friend for checking what's going on. Run this:`},
    {type:'run',label:'Press Run, then open this box’s output',code:`<!DOCTYPE html>
<html>
<head><style>body{font-family:system-ui;background:#0b0e24;color:#e9ecff;padding:16px}</style></head>
<body>
  <h3>Open the Console (F12) on your own page to see logs.</h3>
  <p id="out"></p>
  <script>
    console.log("Hello from JavaScript!");
    // We'll also show output on the page so you can see it here:
    document.getElementById("out").textContent = "JavaScript ran. Check the Console too!";
  <\/script>
</body>
</html>`},
    {type:'note',kind:'tip',html:`On your own machine, after running, open DevTools and click the <b>Console</b> tab — you'll see "Hello from JavaScript!". Use <code class="inline">console.log</code> constantly to peek inside your programs.`},

    {type:'h',text:'2. Variables: boxes that hold values'},
    {type:'p',html:`A <b>variable</b> is a named box that stores a value so you can use it later. You create one with <code class="inline">let</code> or <code class="inline">const</code>:`},
    {type:'code',lang:'js',code:`let score = 0;          // a value that will change over time
const playerName = "Ada"; // a value that should never change`},
    {type:'list',items:[
      `<code class="inline">let</code> — use when the value will <b>change</b> later (a score, a position).`,
      `<code class="inline">const</code> — use when the value should <b>stay the same</b> (constant). Trying to change it causes an error, which is helpful protection.`,
      `The <code class="inline">=</code> sign means "put the value on the right into the box on the left." It is <b>assignment</b>, not "equals" in the maths sense.`
    ]},
    {type:'note',kind:'key',html:`Default to <b>const</b>. Only switch to <b>let</b> when you know the value needs to change. This makes your intentions clear and prevents accidental changes.`},

    {type:'h',text:'3. The core data types'},
    {type:'p',html:`Early on you'll use three kinds of data constantly:`},
    {type:'list',items:[
      `<b>Number</b> — <code class="inline">0</code>, <code class="inline">42</code>, <code class="inline">3.5</code>, <code class="inline">-10</code>. Positions, speeds, scores.`,
      `<b>String</b> — text inside quotes: <code class="inline">"Game Over"</code> or <code class="inline">'Level 1'</code>. Single or double quotes both work.`,
      `<b>Boolean</b> — either <code class="inline">true</code> or <code class="inline">false</code>. Perfect for yes/no questions like "is the game paused?"`
    ]},
    {type:'code',lang:'js',code:`let lives = 3;             // number
let title = "Star Catcher"; // string
let isPaused = false;       // boolean`},

    {type:'h',text:'4. Doing maths with numbers'},
    {type:'p',html:`JavaScript does arithmetic with the usual symbols: <code class="inline">+</code> add, <code class="inline">-</code> subtract, <code class="inline">*</code> multiply, <code class="inline">/</code> divide.`},
    {type:'code',lang:'js',code:`let score = 0;
score = score + 10;  // score is now 10
score = score + 5;   // score is now 15

// A handy shortcut: += means "add to what's already there"
score += 20;         // score is now 35`},
    {type:'note',kind:'tip',title:'The += shortcut',html:`<code class="inline">score += 10</code> is just a shorter way of writing <code class="inline">score = score + 10</code>. You'll use <code class="inline">+=</code> a lot to move characters and add points. There's also <code class="inline">-=</code>, <code class="inline">*=</code> and <code class="inline">/=</code>.`},

    {type:'h',text:'5. Joining text together'},
    {type:'p',html:`The <code class="inline">+</code> symbol also joins strings — this is called <b>concatenation</b>. It's how we build messages like "Score: 35".`},
    {type:'code',lang:'js',code:`let score = 35;
let message = "Score: " + score;   // "Score: 35"
console.log(message);

let name = "Ada";
console.log("Player " + name + " is ready!"); // Player Ada is ready!`},
    {type:'note',kind:'warn',title:'Numbers vs text with +',html:`<code class="inline">3 + 4</code> gives <code class="inline">7</code> (maths), but <code class="inline">"3" + "4"</code> gives <code class="inline">"34"</code> (text joined!). If a number is wrapped in quotes it's a <b>string</b>, and <code class="inline">+</code> glues instead of adds. Watch out for stray quotes around numbers.`},

    {type:'h',text:'6. Putting it together: a live scoreboard'},
    {type:'p',html:`Let's combine variables, maths and text. This page draws a score on the canvas, and a button adds points each time you click — your first interactive use of variables. (We'll fully cover buttons and events in Session 5; here, just enjoy seeing variables in action.)`},
    {type:'run',label:'Click the button a few times, then Run again to reset',code:`<!DOCTYPE html>
<html>
<head><style>
  body{font-family:system-ui;background:#0d1024;color:#e9ecff;text-align:center;padding:16px}
  canvas{background:#0b0e24;border:3px solid #6c8cff;border-radius:12px}
  button{margin-top:12px;padding:10px 18px;border:none;border-radius:8px;
    background:#6c8cff;color:#fff;font-size:15px;cursor:pointer}
</style></head>
<body>
  <canvas id="game" width="320" height="160"></canvas><br>
  <button id="add">+10 points</button>
  <script>
    const ctx = document.getElementById("game").getContext("2d");
    let score = 0;            // a number variable that will change

    function draw() {
      ctx.fillStyle = "#0b0e24";
      ctx.fillRect(0, 0, 320, 160);          // clear the canvas
      ctx.fillStyle = "#34d399";
      ctx.font = "26px system-ui";
      ctx.fillText("Score: " + score, 90, 90); // number joined to text
    }

    document.getElementById("add").onclick = function () {
      score += 10;   // add 10 to the score
      draw();        // redraw with the new number
    };

    draw(); // draw once at the start
  <\/script>
</body>
</html>`},
    {type:'p',html:`Notice the pieces you already know: a <code class="inline">let score = 0</code> variable, <code class="inline">score += 10</code> to add points, and <code class="inline">"Score: " + score</code> to build the text. The <code class="inline">function</code> and <code class="inline">onclick</code> are previews of the next two sessions — don't worry about them yet.`},

    {type:'exercise',title:'Make it yours',html:`<ol>
      <li>Start <code class="inline">score</code> at <code class="inline">100</code> instead of <code class="inline">0</code> and run again.</li>
      <li>Change <code class="inline">+= 10</code> to <code class="inline">+= 25</code>. What does each click do now?</li>
      <li>Add a second variable <code class="inline">let lives = 3;</code> and draw it on a second line: <code class="inline">ctx.fillText("Lives: " + lives, 90, 130);</code>.</li>
      <li>In the Console on your own page, type <code class="inline">console.log(2 + 2)</code> and then <code class="inline">console.log("2" + "2")</code>. Notice the difference.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 4 recap',html:`Variables (<b>const</b> by default, <b>let</b> when it changes) hold data. The three core types are <b>number</b>, <b>string</b> and <b>boolean</b>. <code class="inline">+</code> adds numbers but joins strings. <code class="inline">+=</code> is the everyday shortcut for adding. You used all of this to track a live score. Next: <b>functions</b> and <b>making decisions</b> with <code class="inline">if</code>.`}
  ]
},
{
  id:5, week:3, duration:'≈ 60 minutes',
  title:'Functions — Reusable Blocks of Code',
  objectives:[
    'Understand what a function is and why games depend on them',
    'Write functions and call them to run the same code many times',
    'Pass values in with parameters and get results back with return',
    'Refactor repeated drawing code into tidy, reusable functions'
  ],
  blocks:[
    {type:'p',html:`So far our code runs top to bottom, once. But games need to do the same thing over and over — draw the player, check the score, redraw the screen 60 times a second. A <b>function</b> is a named block of code you write once and <i>run whenever you like</i>. Functions are the single most important tool for keeping code organised, and from here on we'll use them constantly.`},
    {type:'note',kind:'info',html:`Make a <code class="inline">session-05</code> folder. Today is mostly about how you <i>organise</i> code — a skill that pays off in every session that follows.`},

    {type:'h',text:'1. A function is a named recipe'},
    {type:'p',html:`Think of a function like a recipe card. You write the steps once, give the recipe a name, and then any time you want that result you just say the name. Here's the simplest possible function:`},
    {type:'code',lang:'js',code:`// Define the function (write the recipe)
function sayHello() {
  console.log("Hello, game developer!");
}

// Call the function (use the recipe) — runs the code inside
sayHello();
sayHello();  // call it again — it runs again`},
    {type:'list',items:[
      `<code class="inline">function</code> is the keyword that starts a definition.`,
      `<code class="inline">sayHello</code> is the name we chose. The empty <code class="inline">()</code> is where inputs go (none yet).`,
      `The code between <code class="inline">{ }</code> is the function's <b>body</b> — it doesn't run until you call it.`,
      `<code class="inline">sayHello()</code> with the parentheses is how you <b>call</b> (run) it.`
    ]},
    {type:'note',kind:'key',title:'Define vs call',html:`Writing <code class="inline">function sayHello() {…}</code> only <i>describes</i> the steps — nothing happens yet. The code runs only when you <b>call</b> it with <code class="inline">sayHello()</code>. Beginners often forget the parentheses; without them you're referring to the recipe, not cooking it.`},

    {type:'h',text:'2. Parameters — giving a function inputs'},
    {type:'p',html:`A recipe is more useful if you can change the ingredients. <b>Parameters</b> are named inputs you pass into a function. Inside the function they behave like variables:`},
    {type:'code',lang:'js',code:`// 'name' is a parameter — a placeholder for whatever we pass in
function greet(name) {
  console.log("Welcome, " + name + "!");
}

greet("Ada");    // Welcome, Ada!
greet("Sam");    // Welcome, Sam!`},
    {type:'p',html:`You can have several parameters, separated by commas. This is how we'll draw a shape at any position and size:`},
    {type:'code',lang:'js',code:`function drawCircle(x, y, radius) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

drawCircle(50, 50, 20);    // small circle, top-left
drawCircle(200, 120, 45);  // bigger circle, further down`},
    {type:'note',kind:'tip',title:'Arguments vs parameters',html:`The names in the definition (<code class="inline">x, y, radius</code>) are <b>parameters</b>. The actual values you pass when calling (<code class="inline">200, 120, 45</code>) are <b>arguments</b>. Don't worry about the jargon — just remember: define with placeholders, call with real values.`},

    {type:'h',text:'3. Return values — getting something back'},
    {type:'p',html:`Some functions <i>do</i> something (like drawing). Others <i>calculate</i> something and hand the answer back with the <code class="inline">return</code> keyword:`},
    {type:'code',lang:'js',code:`function add(a, b) {
  return a + b;   // hand this value back to whoever called us
}

let total = add(3, 4);   // total is now 7
console.log(total);

// You can use the result directly:
console.log("Double of 10 is " + add(10, 10));`},
    {type:'note',kind:'warn',title:'return ends the function',html:`As soon as <code class="inline">return</code> runs, the function stops — any code after it is skipped. A function with no <code class="inline">return</code> simply gives back <code class="inline">undefined</code>, which is fine for "doer" functions like <code class="inline">drawCircle</code>.`},

    {type:'h',text:'4. Why functions matter: DRY code'},
    {type:'p',html:`Programmers follow a rule called <b>DRY — Don't Repeat Yourself</b>. If you copy-paste the same code in three places and later find a bug, you have to fix it three times. Put it in a function once, and you fix it in one place. Functions make your games shorter, clearer, and far easier to change.`},

    {type:'h',text:'5. Hands-on: a scoreboard built from functions'},
    {type:'p',html:`Remember the scoreboard from Session 4? Let's rebuild it cleanly using functions. Notice how <code class="inline">draw()</code> bundles all the drawing, and <code class="inline">addPoints(n)</code> takes a parameter so one button can add any amount. Press <b>Run</b>, then click the buttons.`},
    {type:'run',label:'Functions in action — click the buttons',code:`<!DOCTYPE html>
<html>
<head><style>
  body{font-family:system-ui;background:#0d1024;color:#e9ecff;text-align:center;padding:14px}
  canvas{background:#0b0e24;border:3px solid #6c8cff;border-radius:12px}
  button{margin:10px 4px 0;padding:9px 16px;border:none;border-radius:8px;
    background:#6c8cff;color:#fff;font-size:14px;cursor:pointer}
</style></head>
<body>
  <canvas id="game" width="340" height="150"></canvas><br>
  <button id="b5">+5</button>
  <button id="b10">+10</button>
  <button id="reset">Reset</button>
  <script>
    const ctx = document.getElementById("game").getContext("2d");
    let score = 0;

    // One function that knows how to draw everything
    function draw() {
      ctx.fillStyle = "#0b0e24";
      ctx.fillRect(0, 0, 340, 150);
      ctx.fillStyle = "#34d399";
      ctx.font = "28px system-ui";
      ctx.fillText("Score: " + score, 90, 85);
    }

    // A function WITH A PARAMETER: add any number of points
    function addPoints(amount) {
      score += amount;
      draw();           // redraw after changing the score
    }

    document.getElementById("b5").onclick  = function(){ addPoints(5);  };
    document.getElementById("b10").onclick = function(){ addPoints(10); };
    document.getElementById("reset").onclick = function(){ score = 0; draw(); };

    draw();  // draw once at the start
  <\/script>
</body>
</html>`},
    {type:'p',html:`See how both buttons reuse the <i>same</i> <code class="inline">addPoints</code> function with a different argument? That's the power of parameters. And every button calls <code class="inline">draw()</code> instead of repeating the drawing code — that's DRY in action.`},

    {type:'exercise',title:'Your turn',html:`<ol>
      <li>Add a <code class="inline">-5</code> button that calls <code class="inline">addPoints(-5)</code>. (A negative argument works perfectly!)</li>
      <li>Write a function <code class="inline">function double(n) { return n * 2; }</code> and <code class="inline">console.log(double(21))</code>.</li>
      <li>Write a <code class="inline">drawBox(x, y, size, colour)</code> function and call it three times to draw three different squares on a canvas.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 5 recap',html:`A <b>function</b> packages code under a name. <b>Define</b> it once, <b>call</b> it (with <code class="inline">()</code>) as often as you like. <b>Parameters</b> feed values in; <code class="inline">return</code> hands a result back. Functions keep code <b>DRY</b>. Next: making functions <i>decide</i> what to do with <code class="inline">if</code> statements.`}
  ]
},
{
  id:6, week:3, duration:'≈ 60 minutes',
  title:'Making Decisions — if / else & Comparisons',
  objectives:[
    'Compare values with ===, <, >, <= and >=',
    'Branch your code with if, else if and else',
    'Combine conditions with AND (&&), OR (||) and NOT (!)',
    'Keep a moving object inside the canvas using edge checks'
  ],
  blocks:[
    {type:'p',html:`Every game is a flood of decisions: "did the ball hit the wall?", "is the player out of lives?", "is the game paused?". The <code class="inline">if</code> statement is how code <b>chooses</b> what to do. Master this and your programs stop being a fixed script and start <i>reacting</i> — which is exactly what a game is.`},
    {type:'note',kind:'info',html:`Create <code class="inline">session-06</code>. Combine today's <code class="inline">if</code> statements with the functions from Session 5 and you have the core of real game logic.`},

    {type:'h',text:'1. Comparing values'},
    {type:'p',html:`Before we can decide, we need to <i>ask questions</i>. Comparison operators ask a question and answer with a boolean — <code class="inline">true</code> or <code class="inline">false</code>:`},
    {type:'code',lang:'js',code:`5 > 3       // true   (greater than)
5 < 3       // false  (less than)
10 >= 10    // true   (greater than or equal)
4 <= 2      // false  (less than or equal)
7 === 7     // true   (exactly equal)
7 === "7"   // false  (number 7 is NOT the same as text "7")
5 !== 3     // true   (not equal)`},
    {type:'note',kind:'warn',title:'Always use === (three equals)',html:`Use <code class="inline">===</code> to test equality, not <code class="inline">==</code>. The triple version checks value <i>and</i> type and behaves predictably; the double version does surprising automatic conversions (e.g. <code class="inline">0 == ""</code> is <code class="inline">true</code>!). Make <code class="inline">===</code> a firm habit. For "not equal", use <code class="inline">!==</code>.`},

    {type:'h',text:'2. The if statement'},
    {type:'p',html:`An <code class="inline">if</code> runs a block of code <b>only when</b> its question is true:`},
    {type:'code',lang:'js',code:`let score = 120;

if (score > 100) {
  console.log("You beat the high score!");
}`},
    {type:'p',html:`Add <code class="inline">else</code> for "otherwise", and <code class="inline">else if</code> to check more cases in order:`},
    {type:'code',lang:'js',code:`let lives = 0;

if (lives > 1) {
  console.log("Keep going!");
} else if (lives === 1) {
  console.log("Last life — be careful!");
} else {
  console.log("Game over.");
}`},
    {type:'list',items:[
      `JavaScript checks each condition from top to bottom and runs the <b>first</b> one that's true.`,
      `<code class="inline">else</code> is the catch-all that runs if none matched. It's optional.`,
      `Indent the code inside the braces — it makes the structure readable (and is a professional habit).`
    ]},

    {type:'h',text:'3. Combining conditions: AND, OR, NOT'},
    {type:'p',html:`Real decisions often depend on several things at once. Logical operators join conditions:`},
    {type:'list',items:[
      `<code class="inline">&&</code> (<b>AND</b>) — true only if <i>both</i> sides are true.`,
      `<code class="inline">||</code> (<b>OR</b>) — true if <i>at least one</i> side is true.`,
      `<code class="inline">!</code> (<b>NOT</b>) — flips true to false and back.`
    ]},
    {type:'code',lang:'js',code:`let x = 50;
let canvasWidth = 400;

// Is x inside the canvas? It must be past the left AND before the right.
if (x > 0 && x < canvasWidth) {
  console.log("On screen");
}

let isPaused = false;
if (!isPaused) {        // "if NOT paused"
  console.log("The game is running");
}`},
    {type:'note',kind:'key',title:'Reading && and ||',html:`Say them out loud: <code class="inline">&&</code> is "and", <code class="inline">||</code> is "or", <code class="inline">!</code> is "not". "If past the left <b>and</b> before the right" maps straight onto <code class="inline">x &gt; 0 && x &lt; width</code>.`},

    {type:'h',text:'4. The most useful game decision: staying in bounds'},
    {type:'p',html:`Here's a decision you'll use in nearly every game: keeping a ball <i>inside</i> the canvas by checking its edges and bouncing it back. When the ball reaches an edge, we flip its direction. Press <b>Run</b> and watch it bounce — then change the start position or the speed.`},
    {type:'run',label:'Edge checks make the ball bounce — change speed/position and Run',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#0b0e24;border:3px solid #6c8cff;border-radius:12px}
</style></head>
<body>
  <canvas id="game" width="360" height="220"></canvas>
  <script>
    const ctx = document.getElementById("game").getContext("2d");
    const W = 360, H = 220, r = 14;

    let x = 60, y = 60;     // ball position
    let vx = 3, vy = 2.4;   // ball velocity (speed + direction)

    function update() {
      x += vx;
      y += vy;

      // DECISIONS: if the ball reaches a horizontal edge, reverse vx
      if (x - r < 0 || x + r > W) {
        vx = -vx;
      }
      // if it reaches a vertical edge, reverse vy
      if (y - r < 0 || y + r > H) {
        vy = -vy;
      }
    }

    function draw() {
      ctx.fillStyle = "#0b0e24";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#34d399";
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);  // we'll explain this fully in Session 8
    }
    loop();
  <\/script>
</body>
</html>`},
    {type:'p',html:`The two <code class="inline">if</code> statements are the whole trick: "<i>if</i> the ball has gone past an edge, flip its direction." Notice the OR (<code class="inline">||</code>) — we bounce whether it hit the <i>left</i> edge or the <i>right</i> edge. You're seeing a tiny preview of the game loop too; we'll build that properly in Session 8.`},

    {type:'h',text:'5. Booleans as switches'},
    {type:'p',html:`A boolean variable makes a perfect on/off switch. To pause a game, keep an <code class="inline">isPaused</code> flag and only update the world when it's <code class="inline">false</code>:`},
    {type:'code',lang:'js',code:`let isPaused = false;

function togglePause() {
  isPaused = !isPaused;   // flip it: false→true, true→false
}

function update() {
  if (isPaused) {
    return;   // do nothing this frame
  }
  // ...normal game updates happen here...
}`},

    {type:'exercise',title:'Practice the logic',html:`<ol>
      <li>In the bouncing demo, change <code class="inline">vx</code> and <code class="inline">vy</code> to make the ball move faster, then slower.</li>
      <li>Add a colour change: inside <code class="inline">update()</code>, if <code class="inline">x &lt; W/2</code> use one colour, <code class="inline">else</code> another. (You'll set <code class="inline">ctx.fillStyle</code> based on a variable.)</li>
      <li>Write an <code class="inline">if/else if/else</code> that logs "Win", "Draw" or "Lose" based on a <code class="inline">myScore</code> vs <code class="inline">theirScore</code> comparison.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 6 recap',html:`Comparisons (<code class="inline">===</code>, <code class="inline">&lt;</code>, <code class="inline">&gt;</code>…) ask true/false questions. <code class="inline">if</code> / <code class="inline">else if</code> / <code class="inline">else</code> chooses what runs. <code class="inline">&&</code>, <code class="inline">||</code> and <code class="inline">!</code> combine conditions. Edge checks that flip velocity are the heart of bouncing. Next: handling <i>many</i> things at once with loops and arrays.`}
  ]
},
{
  id:7, week:4, duration:'≈ 60 minutes',
  title:'Loops & Arrays — Handling Many Things',
  objectives:[
    'Store lists of data in arrays and read them by index',
    'Repeat actions automatically with for loops',
    'Loop over an array to draw or update many objects at once',
    'Add and remove items from an array'
  ],
  blocks:[
    {type:'p',html:`Real games are full of <i>many</i> things: a field of stars, a wall of bricks, a swarm of enemies, a stream of bullets. You can't write a separate variable for each one. <b>Arrays</b> store whole lists of data, and <b>loops</b> let you do something to every item without repeating yourself. Together they're the secret behind games with lots going on.`},
    {type:'note',kind:'info',html:`Open <code class="inline">session-07</code>. This pairs perfectly with the functions and decisions you already know.`},

    {type:'h',text:'1. Arrays: a list in one variable'},
    {type:'p',html:`An <b>array</b> is an ordered list of values, written inside square brackets <code class="inline">[ ]</code>:`},
    {type:'code',lang:'js',code:`let scores = [10, 25, 40, 100];
let colours = ["red", "green", "blue"];
let enemies = [];   // an empty list, ready to fill later`},
    {type:'p',html:`You reach into an array by its position, called the <b>index</b>. The catch that trips up every beginner: <b>counting starts at 0</b>, not 1.`},
    {type:'code',lang:'js',code:`let colours = ["red", "green", "blue"];
colours[0]   // "red"   (the FIRST item is index 0)
colours[1]   // "green"
colours[2]   // "blue"
colours.length   // 3  (how many items)`},
    {type:'note',kind:'key',title:'Zero-based counting',html:`The first item is at index <b>0</b>, so the last item is always at index <code class="inline">length - 1</code>. An array of 3 items has indexes 0, 1 and 2. This feels odd at first but quickly becomes natural.`},
    {type:'p',html:`Add to the end of an array with <code class="inline">.push()</code>, and remove the last item with <code class="inline">.pop()</code>:`},
    {type:'code',lang:'js',code:`let enemies = [];
enemies.push("goblin");   // ["goblin"]
enemies.push("dragon");   // ["goblin", "dragon"]
enemies.length;           // 2`},

    {type:'h',text:'2. The for loop'},
    {type:'p',html:`A <b>loop</b> repeats code. The <code class="inline">for</code> loop is built for "do this a set number of times." It has three parts in its header:`},
    {type:'code',lang:'js',code:`for (let i = 0; i < 5; i++) {
  console.log("Hello number " + i);
}
// prints Hello number 0, 1, 2, 3, 4`},
    {type:'list',items:[
      `<code class="inline">let i = 0</code> — the <b>start</b>: a counter beginning at 0.`,
      `<code class="inline">i < 5</code> — the <b>condition</b>: keep looping while this is true.`,
      `<code class="inline">i++</code> — the <b>step</b>: add 1 to <code class="inline">i</code> after each pass (<code class="inline">i++</code> is shorthand for <code class="inline">i += 1</code>).`
    ]},
    {type:'note',kind:'tip',title:'Why start at 0?',html:`Because array indexes start at 0! Starting the counter at 0 and looping while <code class="inline">i &lt; array.length</code> visits every item exactly once. This pattern is everywhere — memorise it.`},

    {type:'h',text:'3. Looping over an array'},
    {type:'p',html:`Combine the two ideas to touch every item in a list:`},
    {type:'code',lang:'js',code:`let colours = ["red", "green", "blue"];

for (let i = 0; i < colours.length; i++) {
  console.log(colours[i]);   // red, then green, then blue
}`},
    {type:'p',html:`Whether the array has 3 items or 3,000, the same three lines handle them all. That's the magic: <b>write the logic once, apply it to everything.</b>`},

    {type:'h',text:'4. Hands-on: a field of stars'},
    {type:'p',html:`Let's build an array of star objects with random positions, then draw them all with one loop. Press <b>Run</b> a few times — each run scatters the stars differently. Try changing how many stars there are.`},
    {type:'run',label:'Make many objects with an array + loop — Run again to re-scatter',code:`<!DOCTYPE html>
<html>
<head><style>
  body{margin:0;background:#0d1024;display:flex;justify-content:center;padding:14px}
  canvas{background:#070920;border:3px solid #6c8cff;border-radius:12px}
</style></head>
<body>
  <canvas id="game" width="360" height="240"></canvas>
  <script>
    const ctx = document.getElementById("game").getContext("2d");
    const W = 360, H = 240;

    let stars = [];   // an empty array to hold our stars

    // Fill the array with star objects (each is {x, y, size})
    const HOW_MANY = 40;
    for (let i = 0; i < HOW_MANY; i++) {
      stars.push({
        x: Math.random() * W,      // random across the width
        y: Math.random() * H,      // random down the height
        size: Math.random() * 3 + 1
      });
    }

    // Now draw every star with ONE loop
    ctx.fillStyle = "#fff";
    for (let i = 0; i < stars.length; i++) {
      let s = stars[i];
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // A bright moon on top
    ctx.fillStyle = "gold";
    ctx.beginPath();
    ctx.arc(300, 60, 26, 0, Math.PI * 2);
    ctx.fill();
  <\/script>
</body>
</html>`},
    {type:'list',items:[
      `<code class="inline">Math.random()</code> gives a random decimal from 0 up to 1. Multiplying by <code class="inline">W</code> spreads positions across the canvas.`,
      `The first loop <b>builds</b> the list; the second loop <b>draws</b> it. Two loops, any number of stars.`,
      `Each star is a little object <code class="inline">{x, y, size}</code> — a preview of Session 17.`
    ]},

    {type:'h',text:'5. Removing items'},
    {type:'p',html:`When a star is collected or a brick is broken, you remove it from the array. <code class="inline">splice(index, 1)</code> removes one item at a position:`},
    {type:'code',lang:'js',code:`let stars = ["a", "b", "c", "d"];
stars.splice(1, 1);   // remove 1 item at index 1
// stars is now ["a", "c", "d"]`},
