<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Dev Pro — Course Companion (Beginner)</title>
<style>
  :root{
    --bg:#0f1226; --bg2:#161a36; --panel:#1c2147; --panel2:#232a5c;
    --ink:#e9ecff; --muted:#a3aad6; --line:#2c3470;
    --brand:#6c8cff; --brand2:#9a6bff; --accent:#34d399; --warn:#fbbf24; --bad:#fb7185;
    --code-bg:#0b0e24; --radius:14px; --maxw:1280px;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:linear-gradient(180deg,#0c0f22,#0f1226 40%);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
  a{color:var(--brand)}
  /* Header */
  header.topbar{position:sticky;top:0;z-index:30;background:rgba(13,16,38,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
  .logo .badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:18px}
  .logo small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.5px}
  .topbar .spacer{flex:1}
  .progresswrap{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .pbar{width:160px;height:8px;background:#0c1030;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .pbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--brand));transition:width .4s}
  .menu-btn{display:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:18px}
  /* Layout */
  .layout{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:320px 1fr;gap:26px;padding:22px 18px 80px}
  aside.sidebar{position:sticky;top:74px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:6px}
  .search{width:100%;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);margin-bottom:14px;font-size:14px}
  .search::placeholder{color:var(--muted)}
  .month-group{margin-bottom:16px}
  .month-title{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--brand);font-weight:800;margin:6px 4px 8px}
  .month-sub{font-size:11px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:.2px;margin-top:2px}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--muted);border:1px solid transparent;font-size:14px}
  .navitem:hover{background:var(--panel);color:var(--ink)}
  .navitem.active{background:linear-gradient(135deg,rgba(108,140,255,.25),rgba(154,107,255,.18));border-color:var(--line);color:var(--ink)}
  .navitem .num{flex:none;width:26px;height:26px;border-radius:8px;background:#0c1030;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
  .navitem.done .num{background:var(--accent);color:#08130d;border-color:transparent}
  .navitem .t{flex:1;line-height:1.25}
  .navitem .wk{font-size:10px;color:var(--muted);display:block}
  .navitem.locked{opacity:.55}
  /* Main */
  main.content{min-width:0}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .crumbs{font-size:12.5px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:8px}
  h1.session-title{font-size:30px;line-height:1.15;margin:0 0 6px}
  .session-meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
  .chip{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .chip.brand{color:var(--ink);border-color:var(--brand);background:rgba(108,140,255,.12)}
  .obj{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 24px}
  .obj h3{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
  .obj ul{margin:0;padding-left:20px}
  .obj li{margin:4px 0}
  .content h2{font-size:22px;margin:34px 0 10px;padding-top:6px;border-top:1px solid var(--line);padding-top:22px}
  .content h2:first-of-type{border-top:none;padding-top:0}
  .content h3{font-size:17px;margin:22px 0 6px;color:#cfd6ff}
  .content p{margin:10px 0}
  .content ul,.content ol{margin:10px 0;padding-left:22px}
  .content li{margin:6px 0}
  code.inline{font-family:var(--mono);background:#0c1030;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:13.5px;color:#ffd9a0}
  kbd{font-family:var(--mono);background:#0c1030;border:1px solid var(--line);border-bottom-width:2px;padding:1px 7px;border-radius:6px;font-size:12.5px}
  /* callouts */
  .note{border-radius:12px;padding:14px 16px 14px 16px;margin:18px 0;border:1px solid var(--line);position:relative}
  .note .nt{font-weight:700;font-size:13px;letter-spacing:.4px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .note.tip{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.4)}
  .note.tip .nt{color:var(--accent)}
  .note.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.4)}
  .note.warn .nt{color:var(--warn)}
  .note.info{background:rgba(108,140,255,.08);border-color:rgba(108,140,255,.4)}
  .note.info .nt{color:var(--brand)}
  .note.key{background:rgba(154,107,255,.08);border-color:rgba(154,107,255,.45)}
  .note.key .nt{color:#c5a8ff}
  /* static code */
  .codeblock{position:relative;margin:16px 0}
  .codeblock pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:16px 16px;overflow:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
  .codeblock .lang{position:absolute;top:8px;right:54px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .copybtn{position:absolute;top:7px;right:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:3px 9px;font-size:11px;cursor:pointer}
  .copybtn:hover{color:var(--ink)}
  .tok-key{color:#ff9ecd}.tok-str{color:#9be8a0}.tok-num{color:#ffd9a0}.tok-com{color:#6f78b0;font-style:italic}.tok-fn{color:#8fd3ff}
  /* runnable demo */
  .runner{margin:18px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--code-bg)}
  .runner .rhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .runner .rhead .dot{width:10px;height:10px;border-radius:99px;background:#3a4280}
  .runner .rhead .label{flex:1;font-weight:600;color:var(--ink)}
  .runner textarea{width:100%;border:none;background:var(--code-bg);color:#e7ecff;font-family:var(--mono);font-size:13px;line-height:1.5;padding:14px;resize:vertical;min-height:150px;outline:none}
  .runner .ractions{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
  .btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
  .btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .btn:hover{filter:brightness(1.08)}
  .runner .stage{background:#fff;min-height:60px}
  .runner iframe{width:100%;border:none;display:block;background:#fff;min-height:220px}
  /* exercise */
  .exercise{background:linear-gradient(135deg,rgba(154,107,255,.1),rgba(108,140,255,.06));border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:20px 0}
  .exercise .xh{font-weight:800;color:#c5a8ff;font-size:13px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  /* outline (sessions not yet fully written) */
  .outline-banner{background:rgba(108,140,255,.08);border:1px dashed var(--brand);border-radius:12px;padding:16px 18px;margin:8px 0 22px;color:var(--muted);font-size:14px}
  .outline-banner b{color:var(--ink)}
  .footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
  .footer-nav button{flex:1;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);cursor:pointer}
  .footer-nav button:hover{border-color:var(--brand)}
  .footer-nav button.next{text-align:right}
  .footer-nav button span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .footer-nav button.disabled{opacity:.4;pointer-events:none}
  .complete-row{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .checkbtn{display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:14px}
  .checkbtn.done{background:var(--accent);color:#08130d;border-color:transparent}
  .home-hero{padding:8px 4px}
  .home-hero h1{font-size:34px;margin:0 0 8px;background:linear-gradient(90deg,#fff,#b9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}
  .home-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .home-card .big{font-size:26px;font-weight:800}
  .home-card .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr}
    aside.sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-height:none;background:var(--bg);z-index:40;padding:74px 14px 20px;transform:translateX(-105%);transition:transform .25s;border-right:1px solid var(--line)}
    aside.sidebar.open{transform:none}
    .menu-btn{display:block}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
    .scrim.show{display:block}
    .card{padding:20px 18px}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="logo">
      <div class="badge">🎮</div>
      <div>Game Dev Pro<small>BEGINNER COURSE COMPANION</small></div>
    </div>
    <div class="spacer"></div>
    <div class="progresswrap">
      <span id="progressLabel">0 / 24</span>
      <div class="pbar"><i id="pbarFill"></i></div>
    </div>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <input class="search" id="search" placeholder="🔍  Search sessions…" />
    <div id="nav"></div>
  </aside>
  <main class="content">
    <div class="card" id="content"></div>
  </main>
</div>

<script>
/* ============================================================
   GAME DEV PRO — COURSE COMPANION
   Engine: rendering, navigation, live code runner, progress.
   Course content lives in the SESSIONS array further below.
   ============================================================ */

let SESSIONS = [];

/* ---------- tiny syntax highlighter (HTML/CSS/JS-ish) ----------
   Single-pass tokenizer. We scan the RAW code once and emit HTML,
   escaping each plain slice as we go. Because we never re-scan the
   output, the <span> tags we inject (which contain class="...") can
   never be corrupted by a later pass. */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const HL_KEYWORDS = new Set(['const','let','var','function','return','if','else','for','while','new','class','this','true','false','null','undefined','import','export','of','in','break','continue','switch','case','document','window','console']);
function highlight(code){
  // one regex, alternation order matters: comments, strings, numbers, words
  const re = /(\/\/[^\n]*|<!--[\s\S]*?-->)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][A-Za-z0-9_$]*)/g;
  let out = '', last = 0, m;
  while((m = re.exec(code)) !== null){
    out += esc(code.slice(last, m.index));   // plain text before the match
    if(m[1])      out += '<span class="tok-com">' + esc(m[1]) + '</span>';
    else if(m[2]) out += '<span class="tok-str">' + esc(m[2]) + '</span>';
    else if(m[3]) out += '<span class="tok-num">' + m[3] + '</span>';
    else if(m[4]) out += HL_KEYWORDS.has(m[4]) ? '<span class="tok-key">' + m[4] + '</span>' : esc(m[4]);
    last = re.lastIndex;
  }
  out += esc(code.slice(last));              // trailing plain text
  return out;
}

/* ---------- block renderers ---------- */
function rid(){return 'x'+Math.random().toString(36).slice(2,9);}

function renderBlock(b){
  if(typeof b === 'string') return `<p>${b}</p>`;
  switch(b.type){
    case 'h': return `<h2>${b.text}</h2>`;
    case 'h3': return `<h3>${b.text}</h3>`;
    case 'p': return `<p>${b.html}</p>`;
    case 'list': return `<ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'olist': return `<ol>${b.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
    case 'note': {
      const k = b.kind||'info';
      const icon = {tip:'💡',warn:'⚠️',info:'ℹ️',key:'🔑'}[k]||'ℹ️';
      const title = b.title || ({tip:'Tip',warn:'Watch out',info:'Note',key:'Key idea'}[k]);
      return `<div class="note ${k}"><div class="nt">${icon} ${title}</div><div>${b.html}</div></div>`;
    }
    case 'exercise':
      return `<div class="exercise"><div class="xh">✏️ ${b.title||'Your turn'}</div><div>${b.html}</div></div>`;
    case 'code': {
      const id=rid();
      return `<div class="codeblock"><span class="lang">${b.lang||'code'}</span>
        <button class="copybtn" data-copy="${id}">Copy</button>
        <pre id="${id}"><code>${highlight(b.code)}</code></pre></div>`;
    }
    case 'run': {
      const id=rid();
      const code = b.code;
      return `<div class="runner" data-runner>
        <div class="rhead"><span class="dot"></span><span class="dot" style="background:#4a5290"></span><span class="dot" style="background:#5a63a8"></span>
        <span class="label">${b.label||'Live editor — try changing the code, then press Run'}</span></div>
        <textarea spellcheck="false" id="${id}">${esc(code)}</textarea>
        <div class="ractions">
          <button class="btn" data-run="${id}">▶ Run</button>
          <button class="btn ghost" data-reset="${id}">↺ Reset</button>
        </div>
        <iframe data-stage="${id}" sandbox="allow-scripts" title="output"></iframe>
      </div>`;
    }
    default: return '';
  }
}

/* ---------- wire up interactive bits after render ---------- */
function wireInteractions(root){
  // copy buttons
  root.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const pre=document.getElementById(btn.dataset.copy);
      const text=pre.innerText;
      navigator.clipboard?.writeText(text);
      const old=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=old,1200);
    });
  });
  // runnable demos
  root.querySelectorAll('[data-runner]').forEach(r=>{
    const ta=r.querySelector('textarea');
    const id=ta.id;
    const stage=r.querySelector(`[data-stage="${id}"]`);
    const original=ta.value;
    const run=()=>{ stage.srcdoc = ta.value; };
    r.querySelector(`[data-run="${id}"]`).addEventListener('click',run);
    r.querySelector(`[data-reset="${id}"]`).addEventListener('click',()=>{ta.value=original;run();});
    // auto-run once so students see output immediately
    run();
    // grow textarea to fit
    ta.style.height = Math.min(460, Math.max(150, ta.value.split('\n').length*20+24))+'px';
  });
}

/* ---------- progress (saved in this browser) ---------- */
const STORE='gamedevpro_progress_v1';
function getDone(){ try{return JSON.parse(localStorage.getItem(STORE))||{};}catch(e){return {};} }
function setDone(map){ try{localStorage.setItem(STORE,JSON.stringify(map));}catch(e){} }
function isDone(id){ return !!getDone()[id]; }
function toggleDone(id){ const m=getDone(); m[id]=!m[id]; setDone(m); }
function doneCount(){ return Object.values(getDone()).filter(Boolean).length; }

/* ---------- navigation / routing ---------- */
let current = 'home';

function buildNav(filter){
  filter=(filter||'').toLowerCase();
  const nav=document.getElementById('nav');
  const months=[
    {n:'Month 1 — Foundations', sub:'Setup, the web, HTML, CSS & JavaScript basics', range:[1,8]},
    {n:'Month 2 — Core Game Mechanics', sub:'The game loop, input, motion, collisions, first games', range:[9,16]},
    {n:'Month 3 — Real Projects & Polish', sub:'Breakout, a platformer, sound, scoring & shipping', range:[17,24]},
  ];
  let html = `<div class="navitem ${current==='home'?'active':''}" data-go="home"><span class="num">★</span><span class="t">Course Home<span class="wk">Start here</span></span></div>`;
  months.forEach(m=>{
    const items = SESSIONS.filter(s=>s.id>=m.range[0]&&s.id<=m.range[1])
      .filter(s=> !filter || (s.title+s.objectives.join(' ')).toLowerCase().includes(filter));
    if(!items.length) return;
    html += `<div class="month-group"><div class="month-title">${m.n}<div class="month-sub">${m.sub}</div></div>`;
    items.forEach(s=>{
      const done=isDone(s.id)?'done':'';
      const active=(current===s.id)?'active':'';
      html += `<div class="navitem ${done} ${active}" data-go="${s.id}">
        <span class="num">${isDone(s.id)?'✓':s.id}</span>
        <span class="t">${s.title}<span class="wk">Week ${s.week} · Session ${s.id}</span></span></div>`;
    });
    html += `</div>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',()=>{ go(el.dataset.go); closeSidebar(); });
  });
}

function updateProgressUI(){
  const c=doneCount();
  document.getElementById('progressLabel').textContent = c+' / '+SESSIONS.length;
  document.getElementById('pbarFill').style.width = (c/SESSIONS.length*100)+'%';
}

function renderHome(){
  const total=SESSIONS.length, done=doneCount();
  const full=SESSIONS.filter(s=>!s.outline).length;
  return `<div class="home-hero">
    <div class="crumbs">Welcome</div>
    <h1>Build Real Games from Zero — with HTML, CSS & JavaScript</h1>
    <p style="color:var(--muted);max-width:680px">A 3-month, twice-a-week journey designed for complete beginners. No prior coding needed. Every session builds on the last: you'll install your tools, learn the language of the web, and steadily create real playable 2D games — Pong, Snake, Breakout and a platformer — all in your browser.</p>
    <div class="home-grid">
      <div class="home-card"><div class="big">24</div><div class="lbl">Sessions</div></div>
      <div class="home-card"><div class="big">12</div><div class="lbl">Weeks · 2×1hr / week</div></div>
      <div class="home-card"><div class="big">${done}</div><div class="lbl">Completed by you</div></div>
      <div class="home-card"><div class="big">4+</div><div class="lbl">Playable games</div></div>
    </div>
    <div class="note info" style="margin-top:24px"><div class="nt">ℹ️ How to use this companion</div><div>
      Work through the sessions <b>in order</b> — each one assumes what you learned before. Read the explanations, then use the <b>green Run buttons</b> to edit and run code right here on the page (nothing to install for that). Mark a session <b>complete</b> at the bottom when you finish; your progress is saved in this browser. Sessions 1–4 are fully written; the rest show their full plan and arrive as you progress.
    </div></div>
    <div class="note key" style="margin-top:8px"><div class="nt">🔑 The golden rule of learning to code</div><div>
      Don't just read — <b>type the code yourself and break it on purpose</b>. Change a number, delete a line, see what happens, then fix it. That loop is where real understanding comes from.
    </div></div>
    <div style="margin-top:22px"><button class="btn" data-go="1">Start Session 1 →</button></div>
  </div>`;
}

function renderSession(s){
  const objectives = `<div class="obj"><h3>By the end of this session you will be able to</h3><ul>${s.objectives.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
  let body='';
  if(s.outline){
    body = `<div class="outline-banner">📋 <b>Full session plan below.</b> This session's complete written walkthrough and live demos are being prepared. Everything you'll cover, in order, is listed here so you can see exactly where the course is heading.</div>`;
    body += (s.blocks||[]).map(renderBlock).join('');
  } else {
    body = (s.blocks||[]).map(renderBlock).join('');
  }
  const prev=SESSIONS.find(x=>x.id===s.id-1);
  const next=SESSIONS.find(x=>x.id===s.id+1);
  const nav=`<div class="footer-nav">
    <button class="${prev?'':'disabled'}" data-go="${prev?prev.id:'home'}"><span>Previous</span>${prev?('← '+prev.title):'← Home'}</button>
    <button class="next ${next?'':'disabled'}" data-go="${next?next.id:'home'}"><span>Next</span>${next?(next.title+' →'):'Home →'}</button>
  </div>`;
  const complete=`<div class="complete-row">
    <button class="checkbtn ${isDone(s.id)?'done':''}" id="completeBtn">${isDone(s.id)?'✓ Completed':'Mark this session complete'}</button>
    <span style="color:var(--muted);font-size:13px">Week ${s.week} · ${s.duration||'≈ 60 min'} · Session ${s.id} of ${SESSIONS.length}</span>
  </div>`;
  return `<div class="crumbs">Game Dev Pro · Week ${s.week} · Session ${s.id}</div>
    <h1 class="session-title">${s.title}</h1>
    <div class="session-meta">
      <span class="chip brand">⏱ ${s.duration||'≈ 60 minutes'}</span>
      <span class="chip">📅 Week ${s.week}</span>
      <span class="chip">🧩 ${s.outline?'Planned':'Full lesson'}</span>
    </div>
    ${objectives}
    <div class="content">${body}</div>
    ${complete}
    ${nav}`;
}

function go(target){
  current = (target==='home')?'home':parseInt(target,10);
  const c=document.getElementById('content');
  if(current==='home'){
    c.innerHTML=renderHome();
  } else {
    const s=SESSIONS.find(x=>x.id===current);
    c.innerHTML=renderSession(s);
    const cb=document.getElementById('completeBtn');
    if(cb) cb.addEventListener('click',()=>{ toggleDone(s.id); go(s.id); updateProgressUI(); buildNav(document.getElementById('search').value); });
  }
  c.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
  wireInteractions(c);
  buildNav(document.getElementById('search').value);
  window.scrollTo({top:0,behavior:'smooth'});
  location.hash = current==='home'?'':('s'+current);
}

/* sidebar mobile */
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');}

/* boot */
function boot(){
  buildNav();
  updateProgressUI();
  const h=location.hash.replace('#','');
  if(h.startsWith('s')) go(parseInt(h.slice(1),10)); else go('home');
  document.getElementById('search').addEventListener('input',e=>buildNav(e.target.value));
  document.getElementById('menuBtn').addEventListener('click',openSidebar);
  document.getElementById('scrim').addEventListener('click',closeSidebar);
}

{
  id:1, week:1, duration:'≈ 60 minutes',
  title:'Setting Up Your Game Studio',

  blocks:[
    {type:'p',html:`Welcome to <b>Game Dev Pro</b>! Over the next three months you'll go from never having written a line of code to building real, playable games that run in any web browser. This very first session is all about <b>setting up your tools</b> — the same way a carpenter sets up a workbench before building anything. Take your time here; a clean setup makes everything that follows easier.`},

    {type:'note',kind:'info',title:'No experience needed',html:`If you've never coded before, you're in exactly the right place. We assume <b>zero</b> prior knowledge. Every new word is explained the first time it appears.`},

    {type:'h',text:'1. What are we actually building games with?'},
    {type:'p',html:`Every website you've ever visited is built from three technologies that work together. We'll use the exact same three to build games:`},
    {type:'list',items:[
      `<b>HTML</b> (HyperText Markup Language) — the <i>structure</i>. Think of it as the skeleton: "here is a heading, here is a button, here is a game screen."`,
      `<b>CSS</b> (Cascading Style Sheets) — the <i>style</i>. The skin and clothing: colours, sizes, fonts, layout, spacing.`,
      `<b>JavaScript</b> (often shortened to <b>JS</b>) — the <i>behaviour</i>. The muscles and brain: it makes things move, respond to your keyboard, keep score, and react. This is where most of "the game" lives.`
    ]},
    {type:'note',kind:'key',html:`A helpful mental picture: <b>HTML is the noun, CSS is the adjective, JavaScript is the verb.</b> A page says <i>"button"</i> (HTML), <i>"a big red button"</i> (CSS), <i>"when clicked, jump"</i> (JavaScript).`},
    {type:'p',html:`Your web browser (Chrome, Firefox, Edge, Safari…) already knows how to read all three of these and turn them into something you can see and interact with. That means <b>you don't need to install anything special to run your games</b> — if it works in your browser, you can share it with anyone who has a browser. That's the magic of building games this way.`},

    {type:'h',text:'2. The two tools you need'},
    {type:'p',html:`To write games comfortably you only need two free tools:`},
    {type:'olist',items:[
      `A <b>code editor</b> — a special text editor designed for writing code. We'll use <b>Visual Studio Code</b> (VS Code), the most popular one in the world. It's free and runs on Windows, Mac and Linux.`,
      `A <b>modern web browser</b> — to run and test your games. We recommend <b>Google Chrome</b> or <b>Microsoft Edge</b> because their built-in developer tools are excellent, but any modern browser works.`
    ]},
    {type:'note',kind:'warn',title:'Don\'t use Word or Notepad for code',html:`Programs like Microsoft Word add hidden formatting that breaks code. A code editor like VS Code saves plain text and adds colours, error-checking, and helpers that make coding far easier.`},

    {type:'h',text:'3. Installing Visual Studio Code'},
    {type:'olist',items:[
      `Open your browser and go to <code class="inline">https://code.visualstudio.com</code>.`,
      `Click the big <b>Download</b> button — the site detects your operating system automatically (Windows / Mac / Linux).`,
      `Open the downloaded file and follow the installer. On Windows, tick the box that says <b>"Add to PATH"</b> and <b>"Add 'Open with Code' action"</b> if offered — they're handy. On Mac, drag the Visual Studio Code icon into your <b>Applications</b> folder.`,
      `Launch VS Code. You'll see a Welcome tab — you can close it.`
    ]},
    {type:'note',kind:'tip',title:'One extension worth installing now',html:`In VS Code, click the <b>Extensions</b> icon on the left bar (it looks like four little squares), search for <b>"Live Server"</b> by Ritwick Dey, and click <b>Install</b>. This lets you preview your game in the browser and auto-refreshes every time you save. We'll use it in a moment.`},

    {type:'h',text:'4. A quick tour of VS Code'},
    {type:'p',html:`When you open VS Code you'll see a few main areas. You don't need to memorise these — just know they exist:`},
    {type:'list',items:[
      `<b>The Activity Bar</b> (far left): icons for Files (Explorer), Search, Extensions, and more.`,
      `<b>The Explorer</b>: shows the files and folders in your project.`,
      `<b>The Editor</b> (the big middle area): where you actually write code.`,
      `<b>The Terminal</b> (bottom, open it with <kbd>Ctrl</kbd>+<kbd>\`</kbd> on Windows or <kbd>Cmd</kbd>+<kbd>\`</kbd> on Mac): a place to type commands. We'll barely need it early on, so don't worry about it yet.`
    ]},

    {type:'h',text:'5. Create your first project folder'},
    {type:'p',html:`Good organisation now saves headaches later. Let's make a home for everything you'll build in this course.`},
    {type:'olist',items:[
      `On your computer, create a folder somewhere easy to find — for example <code class="inline">Documents/game-dev-pro</code>.`,
      `Inside it, create another folder called <code class="inline">session-01</code>. (Each session will get its own folder.)`,
      `In VS Code, go to <b>File → Open Folder…</b> and choose your <code class="inline">session-01</code> folder. VS Code now treats this folder as your "project".`
    ]},
    {type:'note',kind:'tip',title:'Naming files and folders',html:`Use lowercase letters and dashes instead of spaces: <code class="inline">my-first-game</code>, not <code class="inline">My First Game</code>. Spaces and capital letters can cause subtle problems on the web. Make this a habit from day one.`},

    {type:'h',text:'6. Your first web page: "Hello, Game!"'},
    {type:'p',html:`In VS Code's Explorer, hover over your folder name and click the <b>New File</b> icon. Name it exactly <code class="inline">index.html</code>. The name <code class="inline">index</code> is special — browsers look for it first, so it's the traditional name for a site's home page.`},
    {type:'p',html:`Type the following into <code class="inline">index.html</code>. <b>Type it by hand</b> rather than copy-pasting — your fingers learn the shapes of code, and you'll start to recognise the pieces. We'll explain every line right after.`},
    {type:'code',lang:'html',code:`<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My First Game Page</title>
  </head>
  <body>
    <h1>Hello, Game!</h1>
    <p>This is the beginning of my game development journey.</p>
  </body>
</html>`},
    {type:'h3',text:'What each line means'},
    {type:'list',items:[
      `<code class="inline">&lt;!DOCTYPE html&gt;</code> — tells the browser "this is a modern HTML page." Always the first line.`,
      `<code class="inline">&lt;html lang="en"&gt;</code> — the container that wraps the whole page; <code class="inline">lang="en"</code> says the content is in English.`,
      `<code class="inline">&lt;head&gt;</code> — information <i>about</i> the page that you don't see directly: its title, character settings, and later its styles and scripts.`,
      `<code class="inline">&lt;meta charset="UTF-8"&gt;</code> — lets the page use any character (accents, emoji, symbols) correctly.`,
      `<code class="inline">&lt;title&gt;</code> — the text shown on the browser tab.`,
      `<code class="inline">&lt;body&gt;</code> — everything you actually see on the page goes here.`,
      `<code class="inline">&lt;h1&gt;</code> — a big top-level heading. <code class="inline">&lt;p&gt;</code> — a paragraph of text.`
    ]},
    {type:'note',kind:'key',title:'Tags come in pairs',html:`Notice most things open and close: <code class="inline">&lt;h1&gt;</code> … <code class="inline">&lt;/h1&gt;</code>. The one with the slash <code class="inline">/</code> is the <b>closing</b> tag. Whatever sits between the two is what that tag affects. Forgetting to close a tag is one of the most common beginner mistakes — so watch for it.`},

    {type:'h',text:'7. See it run — right here'},
    {type:'p',html:`On your own machine you'd right-click <code class="inline">index.html</code> and choose <b>"Open with Live Server"</b> to view it in your browser. But this companion has a live editor built in! The box below contains that exact page. Press <b>▶ Run</b> to see it, then try changing the heading text and run it again.`},
    {type:'run',label:'Live editor — change the words, then press Run',code:`<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My First Game Page</title>
  </head>
  <body>
    <h1>Hello, Game!</h1>
    <p>This is the beginning of my game development journey.</p>
  </body>
</html>`},
    {type:'note',kind:'tip',html:`Try replacing <code class="inline">Hello, Game!</code> with your own name, or add a second <code class="inline">&lt;p&gt;…&lt;/p&gt;</code> line. Press Run to see the change. Press <b>↺ Reset</b> to go back to the original. You cannot break anything here — experiment freely.`},

    {type:'h',text:'8. Meet the browser developer tools'},
    {type:'p',html:`Your browser hides a powerful workshop called the <b>Developer Tools</b> (or "DevTools"). Game developers practically live in here. Open it on a real web page with <kbd>F12</kbd>, or right-click anywhere and choose <b>Inspect</b>.`},
    {type:'list',items:[
      `The <b>Elements</b> tab shows the live HTML of the page — you can even edit it temporarily.`,
      `The <b>Console</b> tab is where JavaScript prints messages and where errors show up in red. When something goes wrong later, <b>the Console is the first place you look.</b>`
    ]},
    {type:'note',kind:'info',html:`We'll use the Console heavily from Session 4 onward when we start writing JavaScript. For now, just know it exists and how to open it.`},

    {type:'exercise',title:'Practice before next session',html:`<ol>
      <li>Make sure VS Code and a browser are installed, and the <b>Live Server</b> extension is added.</li>
      <li>Create the <code class="inline">game-dev-pro</code> folder with a <code class="inline">session-01</code> folder inside.</li>
      <li>Recreate the "Hello, Game!" page by typing it yourself, and open it with Live Server.</li>
      <li>Change the heading to a game title you'd love to build one day, and add a paragraph describing it in one sentence.</li>
    </ol>Come to the next session with your tools installed — we'll start filling the page with real content.`},

    {type:'note',kind:'key',title:'Session 1 recap',html:`Games here are made of <b>HTML</b> (structure), <b>CSS</b> (style) and <b>JavaScript</b> (behaviour). You installed <b>VS Code</b> and a browser, learned to make a project folder and an <code class="inline">index.html</code> page, and saw it run. Next time: HTML in depth, and your first game <i>canvas</i>.`}
  ]
},
{
  id:2, week:1, duration:'≈ 60 minutes',
  title:'HTML & Your First Game Canvas',
  objectives:[
    'Understand HTML elements, tags, and attributes properly',
    'Build a well-structured page that will host a game',
    'Meet the canvas element — the rectangle where games are drawn',
    'Draw your very first shapes on the canvas with a few lines of JavaScript',
    'Understand the canvas coordinate system'
  ],
  blocks:[
    {type:'p',html:`Last session you set up your tools and made a tiny page. Today we go deeper into <b>HTML</b> and then meet the single most important element for game development: the <b>&lt;canvas&gt;</b>. By the end you'll have drawn your first shapes — the literal building blocks of every game you'll make.`},
    {type:'note',kind:'info',html:`Make a new folder <code class="inline">session-02</code> and a fresh <code class="inline">index.html</code> inside it, just like last time. Open it with Live Server as you follow along.`},

    {type:'h',text:'1. HTML, looked at more closely'},
    {type:'p',html:`An HTML page is a tree of <b>elements</b>. Each element is written with <b>tags</b>. Most elements have an opening tag and a closing tag with content in between:`},
    {type:'code',lang:'html',code:`<p>This sentence is the content of a paragraph element.</p>`},
    {type:'p',html:`Some elements also carry extra information called <b>attributes</b>, written inside the opening tag as <code class="inline">name="value"</code> pairs. For example, an image element needs to know <i>which</i> image to show:`},
    {type:'code',lang:'html',code:`<img src="player.png" alt="The player character" />`},
    {type:'list',items:[
      `<code class="inline">src</code> is an attribute whose value is the file to load.`,
      `<code class="inline">alt</code> is alternative text shown if the image can't load.`,
      `<code class="inline">&lt;img&gt;</code> has no separate closing tag — it's "self-closing". We write it as <code class="inline">&lt;img … /&gt;</code>.`
    ]},
    {type:'note',kind:'key',title:'The three pieces',html:`<b>Tag</b> = the keyword in angle brackets (<code class="inline">p</code>, <code class="inline">img</code>). <b>Element</b> = the whole thing including content. <b>Attribute</b> = extra settings inside the opening tag. You'll use these words constantly.`},

    {type:'h',text:'2. A few HTML elements you\'ll use a lot'},
    {type:'list',items:[
      `<code class="inline">&lt;div&gt;</code> — a generic box/container used to group things and lay them out.`,
      `<code class="inline">&lt;button&gt;</code> — a clickable button (Start, Pause, Restart).`,
      `<code class="inline">&lt;h1&gt;</code> to <code class="inline">&lt;h6&gt;</code> — headings, biggest to smallest.`,
      `<code class="inline">&lt;span&gt;</code> — a small inline container, handy for showing a score number.`,
      `<code class="inline">&lt;canvas&gt;</code> — the drawing surface for our games. The star of the show.`
    ]},
    {type:'note',kind:'tip',title:'The id attribute',html:`We often give an element a unique name with the <code class="inline">id</code> attribute, e.g. <code class="inline">&lt;canvas id="game"&gt;</code>. Later, JavaScript uses that id to "grab" the element and control it. Think of an id as a name tag.`},

    {type:'h',text:'3. Meet the canvas'},
    {type:'p',html:`The <code class="inline">&lt;canvas&gt;</code> element is exactly what it sounds like: a blank rectangle you can paint on using JavaScript. It does nothing on its own — it's an empty frame. We give it a <b>width</b> and <b>height</b> in pixels:`},
    {type:'code',lang:'html',code:`<canvas id="game" width="400" height="300"></canvas>`},
    {type:'note',kind:'warn',title:'Set size with attributes, not just CSS',html:`Always set the canvas <code class="inline">width</code> and <code class="inline">height</code> as <b>attributes</b> (as above). If you only set the size with CSS, the drawing gets stretched and blurry. We'll revisit this, but build the habit now.`},

    {type:'h',text:'4. Drawing needs a "context"'},
    {type:'p',html:`To paint on the canvas, JavaScript first asks the canvas for its <b>drawing context</b> — a toolbox of drawing commands. For 2D games we ask for the <code class="inline">"2d"</code> context. Here's the pattern you'll repeat in every game:`},
    {type:'code',lang:'js',code:`// 1. Find the canvas element on the page by its id
const canvas = document.getElementById("game");

// 2. Ask it for the 2D drawing toolbox (the "context")
const ctx = canvas.getContext("2d");

// 3. Now use ctx.* commands to draw!
ctx.fillStyle = "tomato";       // choose a colour
ctx.fillRect(20, 20, 100, 60);  // draw a filled rectangle`},
    {type:'list',items:[
      `<code class="inline">document.getElementById("game")</code> — finds the element whose id is "game".`,
      `<code class="inline">getContext("2d")</code> — hands back the 2D toolbox; we store it in a variable called <code class="inline">ctx</code> (short for "context") by convention.`,
      `<code class="inline">fillStyle</code> — sets the current fill colour (a name, or a code like <code class="inline">"#34d399"</code>).`,
      `<code class="inline">fillRect(x, y, width, height)</code> — draws a solid rectangle.`
    ]},

    {type:'h',text:'5. The canvas coordinate system'},
    {type:'p',html:`This is important and slightly surprising: on a canvas, the point <b>(0, 0) is the top-left corner</b>. The <b>x</b> value grows to the <b>right</b>, and the <b>y</b> value grows <b>downward</b> (not upward like in school maths). So a higher y means lower on the screen.`},
    {type:'note',kind:'key',title:'Remember the flip',html:`<b>x → right, y → down.</b> A ball at <code class="inline">(0,0)</code> sits in the top-left; increasing its y moves it <i>down</i> the screen. Almost every movement bug beginners hit comes from forgetting that y grows downward.`},

    {type:'h',text:'6. Your first drawing — live'},
    {type:'p',html:`Here is a complete page: an HTML canvas plus a script that draws on it. Press <b>▶ Run</b>, then change the numbers and colours and run again. Notice how the rectangle moves as you change its x and y.`},
    {type:'run',label:'Draw on the canvas — change the numbers and Run',code:`<!DOCTYPE html>
<html>
<head>
  <style>
    body { background:#222; display:flex; justify-content:center; padding:16px; }
    canvas { background:#fff; border:2px solid #555; }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="260"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // A red square near the top-left
    ctx.fillStyle = "tomato";
    ctx.fillRect(20, 20, 80, 80);

    // A green rectangle further right and down
    ctx.fillStyle = "#34d399";
    ctx.fillRect(160, 100, 120, 60);

    // A blue circle (drawn as an arc)
    ctx.fillStyle = "dodgerblue";
    ctx.beginPath();
    ctx.arc(320, 70, 40, 0, Math.PI * 2);
    ctx.fill();

    // Some text
    ctx.fillStyle = "#333";
    ctx.font = "20px sans-serif";
    ctx.fillText("My canvas!", 20, 200);
  <\/script>
</body>
</html>`},
    {type:'h3',text:'New things you just used'},
    {type:'list',items:[
      `<code class="inline">arc(x, y, radius, startAngle, endAngle)</code> draws a circle/arc. <code class="inline">Math.PI * 2</code> means "all the way around" (a full circle).`,
      `<code class="inline">beginPath()</code> starts a new shape, and <code class="inline">fill()</code> fills it with the current colour.`,
      `<code class="inline">font</code> and <code class="inline">fillText(text, x, y)</code> draw words.`,
      `The <code class="inline">&lt;style&gt;</code> in the head is CSS — we'll dive into that next session. Here it just centres the canvas and gives it a white background.`
    ]},
    {type:'note',kind:'warn',title:'Why the funny <\/script>?',html:`Inside this editor we write <code class="inline">&lt;\/script&gt;</code> with a backslash so the page doesn't end the script too early. In your own files on your computer, you write a normal <code class="inline">&lt;/script&gt;</code> with no backslash.`},

    {type:'h',text:'7. Putting it together in your own file'},
    {type:'p',html:`In your <code class="inline">session-02/index.html</code>, recreate the page above (without the backslash trick). Save, and Live Server will refresh automatically. You're now drawing graphics with code — that's the foundation of literally every game.`},

    {type:'exercise',title:'Try these challenges',html:`<ol>
      <li>Draw a "traffic light": three circles stacked vertically in red, yellow, green.</li>
      <li>Draw a simple house: a square for the wall and a triangle for the roof. (Hint for the triangle: <code class="inline">beginPath()</code>, then <code class="inline">moveTo(x,y)</code>, two <code class="inline">lineTo(x,y)</code> calls, then <code class="inline">fill()</code>.)</li>
      <li>Write your name on the canvas in a colour you like.</li>
    </ol>`},
    {type:'note',kind:'key',title:'Session 2 recap',html:`HTML is built from <b>elements</b> (tags + content + attributes). The <b>&lt;canvas&gt;</b> is a blank rectangle; JavaScript gets its <b>2D context</b> (<code class="inline">ctx</code>) and draws shapes with commands like <code class="inline">fillRect</code> and <code class="inline">arc</code>. Coordinates start at the top-left, with <b>y growing downward</b>. Next: CSS to make everything look good.`}
  ]
},
];
